<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D21034">
<meta name="robots" content="noindex">
<title>Machann — Admin MyPlopPlop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/merchant.css">
<style>
.mp-tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:var(--space-md); scrollbar-width:none; }
.mp-tabs::-webkit-scrollbar { display:none; }
.mp-tab { flex:0 0 auto; padding:8px 14px; border-radius:var(--radius-full); cursor:pointer;
  border:1px solid var(--gray-300); background:var(--white); color:var(--gray-600);
  font-family:var(--font-body); font-size:var(--text-xs); font-weight:700; white-space:nowrap; }
.mp-tab.active { background:var(--primary-red); border-color:var(--primary-red); color:var(--white); }
</style>
</head>
<body style="background:var(--bg-light);">

<div class="mp-topbar">
  <a class="mp-brand" href="../index.html"><img src="../assets/icon-192.png" alt="MyPlopPlop"><span>Admin</span></a>
</div>

<div class="mp-layout">
  <aside class="mp-sidebar" id="mpSidebar"></aside>
  <main class="mp-main">
    <h1 class="mp-page-title">Machann</h1>
    <div id="mpBody"></div>
  </main>
</div>

<nav class="mp-bottom-nav" id="mpBottomNav"></nav>

<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
<script>
(function () {
  var stores = [], tab = 'all', q = '';
  var TABS = [
    ['all', 'Tout', null],
    ['active', 'Aktif', function (s) { return s.status === 'active'; }],
    ['unverified', 'Poko verifye', function (s) { return !s.isVerified; }],
    ['suspended', 'Sispann', function (s) { return s.status === 'suspended'; }]
  ];

  function emoji(c) {
    return { restaurant:'🍽️', supermarket:'🛒', pharmacy:'💊', hardware:'🔨',
             wholesale:'📦', retail:'🛍️', bakery:'🥖', other:'🏪' }[c] || '🏪';
  }

  function render() {
    var def = TABS.filter(function (t) { return t[0] === tab; })[0];
    var list = def[2] ? stores.filter(def[2]) : stores;
    if (q) {
      list = list.filter(function (s) {
        return (s.name || '').toLowerCase().indexOf(q) !== -1 ||
               ((s.owner && s.owner.name) || '').toLowerCase().indexOf(q) !== -1 ||
               (s.phone || '').indexOf(q) !== -1;
      });
    }
    var products = list.reduce(function (a, s) { return a + ((s.stats && s.stats.totalProducts) || 0); }, 0);

    var html = '<div class="mp-tabs">' + TABS.map(function (t) {
      var n = t[2] ? stores.filter(t[2]).length : stores.length;
      return '<button class="mp-tab' + (t[0] === tab ? ' active' : '') + '" data-t="' + t[0] + '">' +
             t[1] + ' (' + n + ')</button>';
    }).join('') + '</div>';

    html += '<div class="mp-stats">' +
      '<div class="mp-stat"><div class="mp-stat-value">' + list.length + '</div><div class="mp-stat-label">Boutik</div></div>' +
      '<div class="mp-stat"><div class="mp-stat-value">' + products + '</div><div class="mp-stat-label">Pwodwi</div></div>' +
      '</div>';

    html += '<input class="mp-input" id="q" placeholder="Chèche yon boutik..." value="' + ADM.esc(q) + '" style="margin-bottom:var(--space-md);">';

    if (!list.length) {
      html += '<div class="mp-empty"><div class="mp-empty-icon">🏪</div><p>Pa gen boutik isit la.</p></div>';
    } else {
      html += list.map(function (s) {
        var logo = s.logo ? '<img src="' + ADM.esc(s.logo) + '" alt="" style="width:100%;height:100%;object-fit:cover;">' : emoji(s.category);
        return '<div class="mp-card" style="margin-bottom:8px;padding:var(--space-sm) var(--space-md);">' +
          '<div style="display:flex;gap:var(--space-sm);align-items:center;">' +
            '<div class="mp-row-thumb">' + logo + '</div>' +
            '<div class="mp-row-main">' +
              '<div class="mp-row-name">' + ADM.esc(s.name) +
                (s.isVerified ? ' <span class="mp-badge verified">✓</span>' : '') + '</div>' +
              '<div class="mp-row-sub">' + ADM.esc((s.owner && s.owner.name) || '—') +
                (s.phone ? ' · ' + ADM.esc(s.phone) : '') + '</div>' +
              '<div class="mp-row-sub">' + ADM.esc(s.category || '') +
                ' · ' + ((s.stats && s.stats.totalProducts) || 0) + ' pwodwi' +
                ' · <span class="mp-status ' + (s.status === 'active' ? 'delivered' : 'cancelled') + '">' + ADM.esc(s.status) + '</span></div>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--space-sm);">' +
            (s.isVerified
              ? '<button class="mp-btn mp-btn-ghost mp-btn-sm" data-a="unverify" data-id="' + s._id + '">Retire verifikasyon</button>'
              : '<button class="mp-btn mp-btn-blue mp-btn-sm" data-a="verify" data-id="' + s._id + '">Verifye</button>') +
            (s.status === 'active'
              ? '<button class="mp-btn mp-btn-ghost mp-btn-sm" data-a="suspend" data-id="' + s._id + '" style="color:var(--error);">Sispann</button>'
              : '<button class="mp-btn mp-btn-ghost mp-btn-sm" data-a="activate" data-id="' + s._id + '">Reaktive</button>') +
            '<a class="mp-btn mp-btn-ghost mp-btn-sm" href="../store.html?id=' + s._id + '" target="_blank" rel="noopener">Wè boutik</a>' +
          '</div></div>';
      }).join('');
    }

    document.getElementById('mpBody').innerHTML = html;

    document.querySelectorAll('[data-t]').forEach(function (b) {
      b.addEventListener('click', function () { tab = b.dataset.t; render(); });
    });
    var qi = document.getElementById('q');
    if (qi) qi.addEventListener('input', function () {
      var pos = qi.selectionStart;
      q = qi.value.trim().toLowerCase();
      render();
      var n = document.getElementById('q');
      n.focus(); n.setSelectionRange(pos, pos);
    });
    document.querySelectorAll('[data-a]').forEach(function (b) {
      b.addEventListener('click', function () {
        b.disabled = true;
        API.adminStoreAction(b.dataset.id, b.dataset.a).then(function (d) {
          if (!d || !d.success) { b.disabled = false; ADM.toast((d && d.message) || 'Pa t mache', 'error'); return; }
          stores = stores.map(function (s) { return s._id === d.data._id ? d.data : s; });
          render();
          ADM.toast('Anrejistre !', 'success');
        }).catch(function () { b.disabled = false; ADM.toast('Pa t mache', 'error'); });
      });
    });
  }

  function load() {
    API.adminStores().then(function (d) {
      if (!d || !d.success) { ADM.fail((d && d.message) || 'Pa t ka chaje boutik yo'); return; }
      stores = d.stores || [];
      render();
    }).catch(function (e) { ADM.fail(String(e.message || e)); });
  }

  ADM.boot('merchants', function () { load(); });
})();
</script>
</body>
</html>
