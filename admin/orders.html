<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D21034">
<meta name="robots" content="noindex">
<title>Kòmand — Admin MyPlopPlop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/merchant.css">
<style>
.mp-tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:var(--space-md); scrollbar-width:none; }
.mp-tabs::-webkit-scrollbar { display:none; }
.mp-tab { flex:0 0 auto; padding:8px 14px; border-radius:var(--radius-full); cursor:pointer;
  border:1px solid var(--gray-300); background:var(--white); color:var(--gray-600);
  font-family:var(--font-body); font-size:var(--text-xs); font-weight:700; white-space:nowrap; }
.mp-tab.active { background:var(--primary-red); border-color:var(--primary-red); color:var(--white); }
</style>
</head>
<body style="background:var(--bg-light);">

<div class="mp-topbar">
  <a class="mp-brand" href="../index.html"><img src="../assets/icon-192.png" alt="MyPlopPlop"><span>Admin</span></a>
</div>

<div class="mp-layout">
  <aside class="mp-sidebar" id="mpSidebar"></aside>
  <main class="mp-main">
    <h1 class="mp-page-title">Kòmand</h1>
    <div id="mpBody"></div>
  </main>
</div>

<nav class="mp-bottom-nav" id="mpBottomNav"></nav>

<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
<script>
(function () {
  var orders = [], tab = 'all', loading = false;
  var TABS = [
    ['all', 'Tout', null],
    ['new', 'Nouvo', ['pending']],
    ['active', 'An kou', ['confirmed','preparing','ready','picked_up','delivering']],
    ['done', 'Livre', ['delivered']],
    ['canc', 'Anile', ['cancelled']]
  ];

  function render() {
    var def = TABS.filter(function (t) { return t[0] === tab; })[0];
    var list = def[2] ? orders.filter(function (o) { return def[2].indexOf(o.status) !== -1; }) : orders;
    var revenue = list.reduce(function (a, o) { return a + (Number(o.total) || 0); }, 0);

    var html = '<div class="mp-tabs">' + TABS.map(function (t) {
      var n = t[2] ? orders.filter(function (o) { return t[2].indexOf(o.status) !== -1; }).length : orders.length;
      return '<button class="mp-tab' + (t[0] === tab ? ' active' : '') + '" data-t="' + t[0] + '">' +
             t[1] + ' (' + n + ')</button>';
    }).join('') + '</div>';

    html += '<div class="mp-stats">' +
      '<div class="mp-stat"><div class="mp-stat-value">' + list.length + '</div><div class="mp-stat-label">Kòmand</div></div>' +
      '<div class="mp-stat"><div class="mp-stat-value">' + ADM.money(revenue) + '</div><div class="mp-stat-label">Total</div></div>' +
      '</div>';

    if (!list.length) {
      html += '<div class="mp-empty"><div class="mp-empty-icon">🧾</div><p>Pa gen kòmand isit la.</p>' +
              '<button class="mp-btn mp-btn-ghost" id="rf">Aktyalize</button></div>';
    } else {
      html += list.map(function (o) {
        return '<div class="mp-card" style="margin-bottom:8px;padding:var(--space-sm) var(--space-md);">' +
          '<div style="display:flex;justify-content:space-between;gap:var(--space-sm);align-items:flex-start;">' +
            '<div style="min-width:0;">' +
              '<div class="mp-row-name">#' + ADM.esc(o.orderNumber || '') + '</div>' +
              '<div class="mp-row-sub">' + ADM.esc((o.store && o.store.name) || '—') + '</div>' +
              '<div class="mp-row-sub">' + ADM.esc((o.customer && o.customer.name) || '—') +
                ((o.customer && o.customer.phone) ? ' · ' + ADM.esc(o.customer.phone) : '') + '</div>' +
              '<div class="mp-row-sub">' + ADM.when(o.createdAt) +
                (o.rider && o.rider.name ? ' · 🛵 ' + ADM.esc(o.rider.name) : '') + '</div>' +
            '</div>' +
            '<div style="text-align:right;flex-shrink:0;">' +
              '<div class="mp-price">' + ADM.money(o.total) + '</div>' +
              '<span class="mp-status ' + ADM.esc(o.status) + '">' + ADM.esc(o.status) + '</span>' +
              '<div class="mp-row-sub">' + (o.paymentStatus === 'paid' ? '✅ peye' : '⏳ poko peye') + '</div>' +
            '</div>' +
          '</div></div>';
      }).join('') +
      '<button class="mp-btn mp-btn-ghost mp-btn-block" id="rf">Aktyalize</button>';
    }

    document.getElementById('mpBody').innerHTML = html;
    document.querySelectorAll('[data-t]').forEach(function (b) {
      b.addEventListener('click', function () { tab = b.dataset.t; render(); });
    });
    var rf = document.getElementById('rf');
    if (rf) rf.addEventListener('click', function () { rf.disabled = true; load(); });
  }

  function load() {
    if (loading) return;
    loading = true;
    API.adminOrders('', 1).then(function (d) {
      loading = false;
      if (!d || !d.success) { ADM.fail((d && d.message) || 'Pa t ka chaje kòmand yo'); return; }
      orders = d.orders || [];
      render();
    }).catch(function (e) { loading = false; ADM.fail(String(e.message || e)); });
  }

  ADM.boot('orders', function () { load(); });
})();
</script>
</body>
</html>
