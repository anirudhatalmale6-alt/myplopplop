<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D21034">
<meta name="robots" content="noindex">
<title>Chofè — Admin MyPlopPlop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/merchant.css">
<style>
.mp-tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:var(--space-md); scrollbar-width:none; }
.mp-tabs::-webkit-scrollbar { display:none; }
.mp-tab { flex:0 0 auto; padding:8px 14px; border-radius:var(--radius-full); cursor:pointer;
  border:1px solid var(--gray-300); background:var(--white); color:var(--gray-600);
  font-family:var(--font-body); font-size:var(--text-xs); font-weight:700; white-space:nowrap; }
.mp-tab.active { background:var(--primary-red); border-color:var(--primary-red); color:var(--white); }
</style>
</head>
<body style="background:var(--bg-light);">

<div class="mp-topbar">
  <a class="mp-brand" href="../index.html"><img src="../assets/icon-192.png" alt="MyPlopPlop"><span>Admin</span></a>
</div>

<div class="mp-layout">
  <aside class="mp-sidebar" id="mpSidebar"></aside>
  <main class="mp-main">
    <h1 class="mp-page-title">Chofè</h1>
    <div id="mpBody"></div>
  </main>
</div>

<nav class="mp-bottom-nav" id="mpBottomNav"></nav>

<script src="/js/referral.js"></script>
    <script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
<script>
(function () {
  var cache = {}, tab = 'pending';
  var TABS = [['pending','Ap tann'], ['approved','Apwouve'], ['rejected','Refize']];

  /* Which pool we are looking at. A MyPlopPlop delivery driver and a MsouWout
     passenger driver are two different approvals, and mixing them in one list
     is how somebody gets approved for the wrong job. 'delivery' first, because
     this is the MyPlopPlop console. */
  var pool = 'delivery';
  var POOLS = [['delivery','📦 Livrezon'], ['ride','🚗 Pasaje'], ['','Tout']];

  function key() { return pool + ':' + tab; }

  function render() {
    var list = cache[key()] || [];
    var online = list.filter(function (d) { return d.isOnline; }).length;

    var html = '<div class="mp-tabs" style="margin-bottom:6px;">' + POOLS.map(function (p) {
      return '<button class="mp-tab' + (p[0] === pool ? ' active' : '') + '" data-pool="' + p[0] + '">' +
             p[1] + '</button>';
    }).join('') + '</div>';

    html += '<div class="mp-tabs">' + TABS.map(function (t) {
      var n = cache[pool + ':' + t[0]] ? cache[pool + ':' + t[0]].length : '·';
      return '<button class="mp-tab' + (t[0] === tab ? ' active' : '') + '" data-t="' + t[0] + '">' +
             t[1] + ' (' + n + ')</button>';
    }).join('') + '</div>';

    html += '<div class="mp-stats">' +
      '<div class="mp-stat"><div class="mp-stat-value">' + list.length + '</div><div class="mp-stat-label">Chofè</div></div>' +
      '<div class="mp-stat"><div class="mp-stat-value">' + online + '</div><div class="mp-stat-label">An liy</div></div>' +
      '</div>';

    if (!list.length) {
      html += '<div class="mp-empty"><div class="mp-empty-icon">🛵</div><p>Pa gen chofè isit la.</p>' +
              '<button class="mp-btn mp-btn-ghost" id="rf">Aktyalize</button></div>';
    } else {
      html += list.map(function (d) {
        var u = d.user || {};
        return '<div class="mp-card" style="margin-bottom:8px;padding:var(--space-sm) var(--space-md);">' +
          '<div style="display:flex;gap:var(--space-sm);align-items:center;">' +
            '<div class="mp-row-thumb">' + (d.isOnline ? '🟢' : '🛵') + '</div>' +
            '<div class="mp-row-main">' +
              '<div class="mp-row-name">' + ADM.esc(u.name || '—') + '</div>' +
              '<div class="mp-row-sub">' + ADM.esc(u.phone || '') +
                (d.vehicleType ? ' · ' + ADM.esc(d.vehicleType) : '') +
                (d.vehiclePlate ? ' · ' + ADM.esc(d.vehiclePlate) : '') + '</div>' +
              // What this driver is actually approved to carry, on the row
              // itself, so nobody approves a parcel rider for passengers by
              // reading the wrong line.
              '<div class="mp-row-sub"><b>' +
                (d.driverType === 'ride' ? '🚗 Pasaje (MsouWout)'
                  : d.driverType === 'both' ? '📦🚗 Livrezon + Pasaje'
                  : '📦 Livrezon (MyPlopPlop)') + '</b></div>' +
              '<div class="mp-row-sub">' + (d.totalRides || 0) + ' kous · ⭐ ' +
                (Number(d.rating) || 0).toFixed(1) + ' · ' + ADM.money(d.totalEarnings || 0) + '</div>' +
            '</div>' +
            '<span class="mp-status ' + (d.status === 'approved' ? 'delivered' : d.status === 'rejected' ? 'cancelled' : 'pending') + '">' +
              ADM.esc(d.status || '') + '</span>' +
          '</div>' +
          (tab === 'pending'
            ? '<div style="display:flex;gap:6px;margin-top:var(--space-sm);">' +
                '<button class="mp-btn mp-btn-blue mp-btn-sm" style="flex:1;" data-ok="' + d._id + '">Apwouve</button>' +
                '<button class="mp-btn mp-btn-ghost mp-btn-sm" style="flex:1;color:var(--error);" data-no="' + d._id + '">Refize</button>' +
              '</div>'
            : '') +
        '</div>';
      }).join('') +
      '<button class="mp-btn mp-btn-ghost mp-btn-block" id="rf">Aktyalize</button>';
    }

    document.getElementById('mpBody').innerHTML = html;

    document.querySelectorAll('[data-t]').forEach(function (b) {
      b.addEventListener('click', function () { tab = b.dataset.t; load(); });
    });
    document.querySelectorAll('[data-pool]').forEach(function (b) {
      b.addEventListener('click', function () { pool = b.dataset.pool; load(); });
    });
    var rf = document.getElementById('rf');
    if (rf) rf.addEventListener('click', function () { rf.disabled = true; cache[key()] = null; load(); });

    document.querySelectorAll('[data-ok]').forEach(function (b) {
      b.addEventListener('click', function () { act(b, b.dataset.ok, 'approve'); });
    });
    document.querySelectorAll('[data-no]').forEach(function (b) {
      b.addEventListener('click', function () {
        var reason = prompt('Poukisa ou refize chofè sa a ?') || '';
        act(b, b.dataset.no, 'reject', reason);
      });
    });
  }

  function act(btn, id, action, reason) {
    btn.disabled = true;
    API.adminVerifyDriver(id, action, reason || '').then(function (r) {
      if (!r || !r.success) { btn.disabled = false; ADM.toast((r && r.message) || 'Pa t mache', 'error'); return; }
      ADM.toast(action === 'approve' ? 'Chofè apwouve !' : 'Chofè refize', 'success');
      cache = {};
      load();
    }).catch(function () { btn.disabled = false; ADM.toast('Pa t mache', 'error'); });
  }

  function load() {
    if (cache[key()]) { render(); return; }
    API.adminDrivers(tab, pool).then(function (d) {
      if (!d || !d.success) { ADM.fail((d && d.message) || 'Pa t ka chaje chofè yo'); return; }
      cache[key()] = d.drivers || d.data || [];
      render();
    }).catch(function (e) { ADM.fail(String(e.message || e)); });
  }

  ADM.boot('riders', function () { load(); });
})();
</script>
</body>
</html>
