<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D21034">
<meta name="robots" content="noindex">
<title>Paramèt — Admin MyPlopPlop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/merchant.css">
<style>
.mp-kv { display:flex; justify-content:space-between; gap:var(--space-md); padding:10px 0;
  border-bottom:1px solid var(--gray-100); font-size:var(--text-sm); }
.mp-kv:last-child { border-bottom:none; }
.mp-kv .k { color:var(--text-muted); }
.mp-kv .v { font-weight:600; color:var(--text-dark); text-align:right; word-break:break-word; }
.mp-note { background:var(--info-light); border-radius:var(--radius-md); padding:var(--space-md);
  font-size:var(--text-sm); color:var(--primary-blue); line-height:1.55; }
</style>
</head>
<body style="background:var(--bg-light);">

<div class="mp-topbar">
  <a class="mp-brand" href="../index.html"><img src="../assets/icon-192.png" alt="MyPlopPlop"><span>Admin</span></a>
</div>

<div class="mp-layout">
  <aside class="mp-sidebar" id="mpSidebar"></aside>
  <main class="mp-main">
    <h1 class="mp-page-title">Paramèt</h1>
    <div id="mpBody"></div>
  </main>
</div>

<nav class="mp-bottom-nav" id="mpBottomNav"></nav>

<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
<script>
(function () {
  function kv(k, v) {
    return '<div class="mp-kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
  }

  function render(health, mk) {
    var up = health && (health.status === 'ok' || health.success);
    document.getElementById('mpBody').innerHTML =
      '<div class="mp-card">' +
        '<div class="mp-card-title">' + ADM.svg('<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>') + 'Eta sistèm nan</div>' +
        kv('Sèvè API', up ? '<span class="mp-status delivered">an mach</span>' : '<span class="mp-status cancelled">pa reponn</span>') +
        kv('Adrès API', '<code style="font-size:11px;">myplopplop-api.onrender.com</code>') +
        kv('Sit la', '<code style="font-size:11px;">myplopplop.com</code>') +
        (health && health.uptime ? kv('An mach depi', Math.round(health.uptime / 3600) + ' èdtan') : '') +
      '</div>' +

      '<div class="mp-card">' +
        '<div class="mp-card-title">' + ADM.svg('<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>') + 'Komisyon ak frè</div>' +
        kv('Komisyon sou boutik', '25%') +
        kv('Komisyon pa defo sou yon nouvo boutik', '10%') +
        kv('Pòsyon chofè sou yon livrezon', '80%') +
        kv('Pòsyon platfòm sou yon livrezon', '20%') +
        kv('Minimòm pou mande peman', '500 HTG') +
        kv('Pot DASH sou chak kous', '25 HTG') +
        '<p class="mp-hint">Valè sa yo fikse nan sèvè a pou kounye a. Di m ki sa ou vle chanje epi m ap fè yo modifiab dirèk isit la.</p>' +
      '</div>' +

      (mk ? '<div class="mp-card">' +
        '<div class="mp-card-title">' + ADM.svg('<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>') + 'Machè entènasyonal</div>' +
        (mk.retailers || []).map(function (r) {
          return kv(ADM.esc(r.name || r.key),
                    (r.affiliateEnabled ? '<span class="mp-status delivered">aktif</span>' : '<span class="mp-status pending">fèmen</span>'));
        }).join('') +
        '<a class="mp-btn mp-btn-blue mp-btn-block" href="marketplace.html" style="margin-top:var(--space-md);">Modifye yo</a>' +
      '</div>' : '') +

      '<div class="mp-card">' +
        '<div class="mp-card-title">' + ADM.svg('<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>') + 'Sa ki jere lòt kote</div>' +
        '<div class="mp-note">Boutik ak verifikasyon yo jere nan paj <a href="merchants.html" style="font-weight:700;">Machann</a>. ' +
        'Chofè yo nan paj <a href="riders.html" style="font-weight:700;">Chofè</a>. ' +
        'Machè entènasyonal yo nan <a href="marketplace.html" style="font-weight:700;">Marketplace</a>.</div>' +
      '</div>';
  }

  ADM.boot('settings', function () {
    Promise.all([
      API.health().catch(function () { return null; }),
      API.adminMarketplaceSettings ? API.adminMarketplaceSettings().catch(function () { return null; })
                                   : Promise.resolve(null)
    ]).then(function (r) {
      render(r[0], r[1] && r[1].settings);
    }).catch(function (e) { ADM.fail(String(e.message || e)); });
  });
})();
</script>
</body>
</html>
