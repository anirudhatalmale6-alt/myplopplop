<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Driver — Deliveries | MyPlopPlop</title>
<meta name="description" content="MyPlopPlop driver screen: receive delivery offers automatically, accept, and complete with the customer's code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<style>
:root{
  --red:#D21034; --blue:#00209F; --ink:#111827; --muted:#6b7280;
  --line:#e5e7eb; --bg:#f4f6fa; --white:#fff; --green:#0f9d55; --amber:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
.top{background:var(--blue);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.top h1{font-family:Poppins;font-size:17px;font-weight:700}
.top .dot{margin-left:auto;font-size:12px;background:rgba(255,255,255,.18);padding:5px 10px;border-radius:999px;font-weight:600}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--white);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(16,24,40,.08);margin-bottom:14px}
.muted{color:var(--muted);font-size:13.5px;line-height:1.5}
h2{font-family:Poppins;font-size:16px;margin-bottom:6px}
.big{font-family:Poppins;font-size:26px;font-weight:800}
.btn{width:100%;padding:15px;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;font-family:Inter}
.btn-accept{background:var(--green);color:#fff}
.btn-decline{background:#fff;color:var(--red);border:2px solid var(--line);margin-top:8px}
.btn-blue{background:var(--blue);color:#fff}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted)}
.row .v{font-weight:600;text-align:right}
.offer{border:2px solid var(--green);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(15,157,85,.35)}50%{box-shadow:0 0 0 10px rgba(15,157,85,0)}}
.count{background:#fff4e5;color:#b45309;border-radius:10px;padding:10px;text-align:center;font-weight:700;margin:12px 0}
.empty{text-align:center;padding:34px 16px}
.empty .ico{font-size:44px;margin-bottom:10px}
.pin{width:100%;padding:15px;border:2px solid var(--line);border-radius:12px;font-size:22px;text-align:center;letter-spacing:8px;font-weight:700;font-family:Inter;margin-bottom:10px}
.err{color:var(--red);font-weight:600;font-size:13.5px;margin-top:8px}
.ok{color:var(--green);font-weight:700}
.login input{width:100%;padding:13px;border:2px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:10px;font-family:Inter}
.badge{display:inline-block;background:#eef3ff;color:var(--blue);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;margin-bottom:8px}
a.map{display:block;text-align:center;margin-top:10px;color:var(--blue);font-weight:700;font-size:14px;text-decoration:none}
</style>
</head>
<body>

<div class="top">
  <span style="font-size:20px">🛵</span>
  <h1>Driver — Deliveries</h1>
  <span class="dot" id="onlineDot">…</span>
</div>

<div class="wrap">
  <!-- LOGIN -->
  <div class="card login" id="loginCard" style="display:none;">
    <h2>Driver sign in</h2>
    <p class="muted" style="margin-bottom:12px">Enter your phone and PIN to start receiving deliveries.</p>
    <input type="tel" id="phone" placeholder="Phone (e.g. +50900000401)">
    <input type="password" id="pin" placeholder="PIN" inputmode="numeric">
    <button class="btn btn-blue" onclick="login()">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- MAIN -->
  <div id="main" style="display:none;">
    <div id="content"></div>
  </div>
</div>

<script>
var API = 'https://myplopplop-api.onrender.com';
var token = localStorage.getItem('pp_token') || '';
var timer = null, poll = null, current = null;

function el(id){ return document.getElementById(id); }

/* 22 Oct 2026: the driver screen was entirely English. Kreyòl by default,
   French and English from the site's saved language. */
var DT = {
  kr: { title:'Chofè — Livrezon', signin:'Konekte kòm chofè', signinSub:'Mete telefòn ou ak PIN ou pou w kòmanse resevwa livrezon.', phone:'Telefòn (egz. 3700 0000)', pin:'PIN', signinBtn:'Konekte',
        noSignin:'Nou pa t kapab konekte w.', net:'Pa gen entènèt.', online:'An liy', newOffer:'NOUVO LIVREZON', earnThis:'Sa w ap touche pou livrezon an', acceptIn:'Aksepte nan {s}s',
        pickup:'Pran nan', store:'Boutik', dropoff:'Livre bay', customer:'Kliyan', distance:'Distans', accept:'Aksepte livrezon an', pass:'Kite l pou yon lòt chofè',
        arrived:'Mwen rive nan boutik la', shopTypes:'Boutik la ap tape kòd sa a pou l ba w kòmand lan. Ekran an ap avanse pou kont li.',
        askPin:'Devan pòt la, mande kliyan an KÒD 4 chif PA L:', complete:'Fini livrezon an', pickupCode:'Kòd pou w pran kòmand lan — montre l nan boutik la',
        cannot:'Mwen pa ka fè livrezon sa a', toCustomer:'AN WOUT POU KAY KLIYAN AN', toShop:'ALE NAN BOUTIK LA', youEarn:'Ou touche', maps:'🗺️ Louvri wout la nan Maps',
        onlineH:'Ou an liy', waiting:'N ap tann yon livrezon. Lè yon boutik toupre make yon kòmand pare, li parèt isit la poukont li.',
        expired:'Tan an pase — n ap pase l bay yon lòt chofè…', noAccept:'Nou pa t kapab aksepte l', why:'Poukisa ou pa ka fè l? (kliyan an ak boutik la ap konnen)',
        noUpdate:'Nou pa t kapab mete l ajou', done:'Livrezon an fini', earned:'Ou touche {m}. Li rete an atant 24 èdtan, apre sa ou ka retire l.' },
  fr: { title:'Chauffeur — Livraisons', signin:'Connexion chauffeur', signinSub:'Entrez votre téléphone et votre PIN pour recevoir des livraisons.', phone:'Téléphone (ex. 3700 0000)', pin:'PIN', signinBtn:'Se connecter',
        noSignin:'Connexion impossible.', net:'Pas de réseau.', online:'En ligne', newOffer:'NOUVELLE LIVRAISON', earnThis:'Ce que vous gagnez pour cette livraison', acceptIn:'Acceptez dans {s}s',
        pickup:'Retrait', store:'Boutique', dropoff:'Livrer à', customer:'Client', distance:'Distance', accept:'Accepter la livraison', pass:'Laisser à un autre chauffeur',
        arrived:'Je suis arrivé à la boutique', shopTypes:'La boutique tape ce code pour vous remettre la commande. L’écran avance tout seul.',
        askPin:'À la porte, demandez au client SON code à 4 chiffres :', complete:'Terminer la livraison', pickupCode:'Votre code de retrait — montrez-le à la boutique',
        cannot:'Je ne peux pas faire cette livraison', toCustomer:'EN ROUTE VERS LE CLIENT', toShop:'ALLEZ À LA BOUTIQUE', youEarn:'Vous gagnez', maps:'🗺️ Ouvrir l’itinéraire dans Maps',
        onlineH:'Vous êtes en ligne', waiting:'En attente d’une livraison. Quand une boutique proche marque une commande prête, elle apparaît ici automatiquement.',
        expired:'Offre expirée — elle passe au chauffeur suivant…', noAccept:'Impossible d’accepter', why:'Pourquoi ne pouvez-vous pas la faire ? (le client et la boutique sont prévenus)',
        noUpdate:'Mise à jour impossible', done:'Livraison terminée', earned:'Vous avez gagné {m}. C’est retenu 24 heures, puis vous pouvez le retirer.' },
  en: { title:'Driver — Deliveries', signin:'Driver sign in', signinSub:'Enter your phone and PIN to start receiving deliveries.', phone:'Phone (e.g. 3700 0000)', pin:'PIN', signinBtn:'Sign in',
        noSignin:'Could not sign in.', net:'Network error.', online:'Online', newOffer:'NEW DELIVERY OFFER', earnThis:'You earn this for the delivery', acceptIn:'Accept within {s}s',
        pickup:'Pick up', store:'Store', dropoff:'Deliver to', customer:'Customer', distance:'Distance', accept:'Accept delivery', pass:'Pass to another driver',
        arrived:'I have arrived at the store', shopTypes:'The shop types this code to hand you the order. This screen moves on by itself.',
        askPin:'At the door, ask the customer for THEIR 4-digit code:', complete:'Complete delivery', pickupCode:'Your pickup code — show it at the shop',
        cannot:'I cannot do this delivery', toCustomer:'ON THE WAY TO THE CUSTOMER', toShop:'GO TO THE SHOP', youEarn:'You earn', maps:'🗺️ Open route in Maps',
        onlineH:'You are online', waiting:'Waiting for a delivery. When a store nearby marks an order ready, it will appear here automatically.',
        expired:'Offer expired — passing to the next driver…', noAccept:'Could not accept', why:'Why can you not do it? (the customer and the shop are told)',
        noUpdate:'Could not update', done:'Delivery complete', earned:'You earned {m}. It is held for 24 hours, then you can withdraw it.' }
};
function dt(k, v){
  var l = 'kr'; try { l = localStorage.getItem('myplopplop_lang') || 'kr'; } catch (e) {}
  if (l === 'ht') l = 'kr';
  var s = String((DT[l] || DT.en)[k] || DT.en[k] || k);
  if (v) Object.keys(v).forEach(function(x){ s = s.split('{' + x + '}').join(v[x]); });
  return s;
}

function api(method, path, body){
  var opts = { method: method, headers: { 'Content-Type':'application/json' } };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body) opts.body = JSON.stringify(body);
  return fetch(API + path, opts).then(function(r){ return r.json(); });
}

function login(){
  var phone = el('phone').value.trim(), pin = el('pin').value.trim();
  el('loginErr').textContent = '';
  api('POST','/api/auth/login',{ phone: phone, pin: pin }).then(function(d){
    if (d.success && d.token){
      token = d.token; localStorage.setItem('pp_token', token);
      el('loginCard').style.display='none'; el('main').style.display='block';
      goOnline(); start();
    } else {
      el('loginErr').textContent = d.message || dt('noSignin');
    }
  }).catch(function(){ el('loginErr').textContent = dt('net'); });
}

// Tell the server we're online and share our location so we can be matched.
function goOnline(){
  api('PUT','/api/drivers/online',{ isOnline:true }).catch(function(){});
  el('onlineDot').textContent = dt('online');
  sendLocation();
  if (beat) clearInterval(beat);
  beat = setInterval(sendLocation, 60000);
}

function money(n){ return (n||0).toLocaleString() + ' HTG'; }
function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
/* 16 Oct 2026: a fresh position every minute while online - the dispatcher
   only offers jobs to drivers whose position is under 15 minutes old. */
var beat = null;
function sendLocation(){
  if (!navigator.geolocation || !token) return;
  navigator.geolocation.getCurrentPosition(function(p){
    api('PUT','/api/drivers/location',{ latitude:p.coords.latitude, longitude:p.coords.longitude }).catch(function(){});
  }, function(){}, { enableHighAccuracy:true, timeout:15000, maximumAge:30000 });
}

function render(data){
  var offer = data.offer, active = data.active;
  var c = el('content');

  if (offer){
    if (current !== String(offer._id)) { current = String(offer._id); }
    var secs = Math.max(0, Math.round((new Date(offer.offerExpiresAt) - new Date())/1000));
    c.innerHTML =
      '<div class="card offer">' +
        '<span class="badge">' + dt('newOffer') + '</span>' +
        '<div class="big">' + money(offer.fare && offer.fare.driverEarning) + '</div>' +
        '<p class="muted">' + dt('earnThis') + '</p>' +
        '<div class="count" id="cd">' + dt('acceptIn', { s: secs }) + '</div>' +
        '<div class="row"><span class="k">' + dt('pickup') + '</span><span class="v">' + esc(offer.pickup.address||dt('store')) + '</span></div>' +
        '<div class="row"><span class="k">' + dt('dropoff') + '</span><span class="v">' + esc(offer.dropoff.address||dt('customer')) + '</span></div>' +
        '<div class="row"><span class="k">' + dt('distance') + '</span><span class="v">' + (offer.distanceKm||0) + ' km</span></div>' +
        '<button class="btn btn-accept" onclick="accept(\'' + offer._id + '\')">' + dt('accept') + '</button>' +
        '<button class="btn btn-decline" onclick="decline(\'' + offer._id + '\')">' + dt('pass') + '</button>' +
      '</div>';
    startCountdown(new Date(offer.offerExpiresAt));
    return;
  }

  if (active){
    /* 16 Oct 2026: the shop confirms the pickup by typing the driver's PICKUP
       code; the driver confirms the delivery with the CUSTOMER's code. */
    var st = active.status;
    var step = '';
    if (st === 'accepted') {
      step = '<button class="btn btn-blue" style="margin-top:12px" onclick="advance(\'' + active._id + '\',\'picking_up\')">' + dt('arrived') + '</button>';
    } else if (st === 'picking_up') {
      step = '<p class="muted" style="margin:6px 0 0">' + dt('shopTypes') + '</p>';
    } else if (st === 'in_progress') {
      step = '<p class="muted" style="margin:10px 0 6px">' + dt('askPin') + '</p>' +
        '<input class="pin" id="pinIn" maxlength="4" inputmode="numeric" placeholder="••••" autocomplete="off">' +
        '<button class="btn btn-blue" style="margin-top:12px" onclick="advance(\'' + active._id + '\',\'delivered\')">' + dt('complete') + '</button>';
    }
    var codeBox = (active.pickupCode && (st === 'accepted' || st === 'picking_up'))
      ? '<div style="margin:12px 0 4px;padding:14px;border:2px dashed #00209F;border-radius:14px;text-align:center">' +
          '<div class="muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px">' + dt('pickupCode') + '</div>' +
          '<div style="font-size:40px;font-weight:800;letter-spacing:.3em;padding-left:.3em">' + esc(active.pickupCode) + '</div>' +
        '</div>'
      : '';
    var drop = (st === 'accepted' || st === 'picking_up')
      ? '<button class="btn btn-decline" style="margin-top:10px" onclick="dropJob(\'' + active._id + '\')">' + dt('cannot') + '</button>'
      : '';
    var dest = (st === 'accepted' || st === 'picking_up') ? active.pickup : active.dropoff;
    var dc = dest && dest.coordinates && dest.coordinates.coordinates;
    c.innerHTML =
      '<div class="card">' +
        '<span class="badge">' + (st === 'in_progress' ? dt('toCustomer') : dt('toShop')) + '</span>' +
        '<div class="row"><span class="k">' + dt('pickup') + '</span><span class="v">' + esc(active.pickup.address||dt('store')) + '</span></div>' +
        '<div class="row"><span class="k">' + dt('dropoff') + '</span><span class="v">' + esc(active.dropoff.address||dt('customer')) + '</span></div>' +
        '<div class="row"><span class="k">' + dt('customer') + '</span><span class="v">' + esc((active.customer&&active.customer.name)||dt('customer')) + '</span></div>' +
        '<div class="row"><span class="k">' + dt('youEarn') + '</span><span class="v">' + money(active.fare&&active.fare.driverEarning) + '</span></div>' +
        codeBox + step + drop +
        '<div class="err" id="stepErr"></div>' +
        (dc ? '<a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=' + Number(dc[1]) + ',' + Number(dc[0]) + '">' + dt('maps') + '</a>' : '') +
      '</div>';
    return;
  }
  c.innerHTML =
    '<div class="card empty">' +
      '<div class="ico">🛵</div>' +
      '<h2>' + dt('onlineH') + '</h2>' +
      '<p class="muted">' + dt('waiting') + '</p>' +
    '</div>';
  current = null;
}

function startCountdown(expiry){
  if (timer) clearInterval(timer);
  timer = setInterval(function(){
    var cd = el('cd'); if (!cd) { clearInterval(timer); return; }
    var s = Math.max(0, Math.round((expiry - new Date())/1000));
    cd.textContent = s > 0 ? dt('acceptIn', { s: s }) : dt('expired');
    if (s <= 0) clearInterval(timer);
  }, 1000);
}

function accept(id){
  api('PUT','/api/rides/'+id+'/accept').then(function(d){
    if (!d.success) alert(d.message || dt('noAccept'));
    else sendLocation();
    refresh();
  });
}
function decline(id){
  api('PUT','/api/rides/'+id+'/decline').then(function(){ refresh(); });
}
function dropJob(id){
  var why = prompt(dt('why'));
  if (why === null) return;
  api('PUT','/api/rides/'+id+'/status',{ status:'cancelled', reason: String(why).slice(0,200) }).then(function(d){
    if (!d.success){ var e = el('stepErr'); if (e) e.textContent = d.message || dt('noUpdate'); }
    refresh();
  });
}
function advance(id, next){
  var body = {}; body.status = next;
  if (next === 'delivered'){
    var p = el('pinIn'); body.pin = p ? p.value.trim() : '';
  }
  api('PUT','/api/rides/'+id+'/status', body).then(function(d){
    if (!d.success){
      var e = el('stepErr'); if (e) e.textContent = d.message || dt('noUpdate');
      return;
    }
    if (next === 'delivered'){
      el('content').innerHTML =
        '<div class="card empty"><div class="ico">✅</div><h2 class="ok">' + dt('done') + '</h2>' +
        '<p class="muted">' + dt('earned', { m: money(d.earned) }) + '</p></div>';
      setTimeout(refresh, 3500);
      return;
    }
    refresh();
  });
}

var lastKey = '';
function refresh(){
  api('GET','/api/rides/my-offer').then(function(d){
    if (!(d.success && d.data)) return;
    // Nothing changed: leave the screen alone, or the 4-second refresh wipes
    // the customer's code while the driver is typing it.
    var a = d.data.active, o = d.data.offer;
    var key = o ? 'o' + o._id : a ? 'a' + a._id + a.status : 'idle';
    if (key === lastKey && !o) return;
    lastKey = key;
    render(d.data);
  }).catch(function(){});
}

function start(){
  refresh();
  if (poll) clearInterval(poll);
  poll = setInterval(refresh, 4000); // offers arrive automatically
}

// boot — the fixed text first
document.querySelector('.top h1').textContent = dt('title');
document.querySelector('#loginCard h2').textContent = dt('signin');
document.querySelector('#loginCard p.muted').textContent = dt('signinSub');
el('phone').placeholder = dt('phone'); el('pin').placeholder = dt('pin');
document.querySelector('#loginCard button').textContent = dt('signinBtn');
if (token){
  el('main').style.display='block';
  api('GET','/api/rides/my-offer').then(function(d){
    if (d.success){ goOnline(); start(); }
    else { el('main').style.display='none'; el('loginCard').style.display='block'; }
  }).catch(function(){ el('loginCard').style.display='block'; });
} else {
  el('loginCard').style.display='block';
}
</script>
</body>
</html>
