<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D21034">
<meta property="og:image" content="https://myplopplop.com/assets/og-myplopplop.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<title>Tablo Machann — MyPlopPlop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/merchant.css">
</head>
<body style="background:var(--bg-light);">

<div class="mp-topbar">
  <a class="mp-brand" href="../index.html">
    <img src="../assets/icon-192.png" alt="MyPlopPlop">
    <span>Merchant</span>
  </a>
  <div class="mp-top-actions" id="mpLangBar"></div>
</div>

<div class="mp-store-header" id="mpStoreHeader"></div>

<div class="mp-layout">
  <aside class="mp-sidebar" id="mpSidebar"></aside>
  <main class="mp-main">
    <h1 class="mp-page-title" id="pgTitle">Tablo</h1>
    <div id="mpBody"></div>
  </main>
</div>

<nav class="mp-bottom-nav" id="mpBottomNav"></nav>

<script src="../js/merchant.js"></script>
<script>
(function () {
  var L = {
    title:     { kr:'Tablo', fr:'Tableau de bord', en:'Dashboard', es:'Panel' },
    hello:     { kr:'Bonjou', fr:'Bonjour', en:'Hello', es:'Hola' },
    todo:      { kr:'Aksyon rapid', fr:'Actions rapides', en:'Quick actions', es:'Acciones rápidas' },
    addProd:   { kr:'Ajoute pwodwi', fr:'Ajouter produit', en:'Add product', es:'Añadir producto' },
    seeOrders: { kr:'Wè kòmand', fr:'Voir commandes', en:'View orders', es:'Ver pedidos' },
    editStore: { kr:'Modifye boutik', fr:'Modifier la boutique', en:'Edit store', es:'Editar tienda' },
    viewLive:  { kr:'Wè boutik la an dirèk', fr:'Voir la boutique en ligne', en:'View live store', es:'Ver tienda en vivo' },
    products:  { kr:'Pwodwi', fr:'Produits', en:'Products', es:'Productos' },
    orders:    { kr:'Kòmand', fr:'Commandes', en:'Orders', es:'Pedidos' },
    revenue:   { kr:'Lajan', fr:'Revenus', en:'Revenue', es:'Ingresos' },
    rating:    { kr:'Nòt', fr:'Note', en:'Rating', es:'Calificación' },
    recent:    { kr:'Dènye kòmand yo', fr:'Commandes récentes', en:'Recent orders', es:'Pedidos recientes' },
    noOrders:  { kr:'Pa gen kòmand ankò. Pataje lyen boutik ou a !', fr:'Aucune commande pour le moment. Partagez le lien de votre boutique !', en:'No orders yet. Share your store link!', es:'Aún no hay pedidos.' },
    checklist: { kr:'Konplete boutik ou', fr:'Complétez votre boutique', en:'Finish setting up', es:'Completa tu tienda' },
    ckLogo:    { kr:'Mete logo boutik ou', fr:'Ajoutez votre logo', en:'Add your store logo', es:'Añade tu logo' },
    ckDesc:    { kr:'Ekri yon deskripsyon', fr:'Écrivez une description', en:'Write a description', es:'Escribe una descripción' },
    ckProds:   { kr:'Ajoute pwodwi ou yo', fr:'Ajoutez vos produits', en:'Add your products', es:'Añade tus productos' },
    ckPhone:   { kr:'Mete telefòn ou', fr:'Ajoutez votre téléphone', en:'Add your phone', es:'Añade tu teléfono' },
    ckAddr:    { kr:'Mete adrès boutik la', fr:"Ajoutez l'adresse", en:'Add your address', es:'Añade la dirección' },
    fix:       { kr:'Ranje', fr:'Corriger', en:'Fix', es:'Corregir' },
    allDone:   { kr:'Boutik ou konplè ! 🎉', fr:'Votre boutique est complète ! 🎉', en:'Your store is complete! 🎉', es:'¡Tu tienda está completa! 🎉' }
  };
  function L_(k) { var e = L[k]; return e ? (e[MP.lang()] || e.en) : k; }

  function langBar() {
    var bar = document.getElementById('mpLangBar');
    bar.innerHTML = ['kr', 'fr', 'en', 'es'].map(function (l) {
      var flag = { kr: '🇭🇹', fr: '🇫🇷', en: '🇬🇧', es: '🇪🇸' }[l];
      return '<button class="mp-lang' + (MP.lang() === l ? ' active' : '') + '" data-l="' + l + '">' + flag + '</button>';
    }).join('');
    bar.querySelectorAll('[data-l]').forEach(function (b) {
      b.addEventListener('click', function () { localStorage.setItem('pp_lang', b.dataset.l); location.reload(); });
    });
  }

  function stat(icon, bg, value, label) {
    return '<div class="mp-stat"><div class="mp-stat-icon" style="background:' + bg + ';">' + icon + '</div>' +
      '<div class="mp-stat-value">' + value + '</div><div class="mp-stat-label">' + label + '</div></div>';
  }

  function render(data) {
    var s = data.store, prods = data.products || [], orders = data.recentOrders || [];
    document.getElementById('pgTitle').textContent = L_('title');
    var storeUrl = '../store.html?id=' + s._id;

    var checks = [
      { ok: !!s.logo,             label: L_('ckLogo'),  href: 'settings.html' },
      { ok: !!(s.description && s.description.length > 15), label: L_('ckDesc'), href: 'settings.html' },
      { ok: prods.length > 0,     label: L_('ckProds'), href: 'products.html' },
      { ok: !!s.phone,            label: L_('ckPhone'), href: 'settings.html' },
      { ok: !!(s.address && s.address.street), label: L_('ckAddr'), href: 'settings.html' }
    ];
    var missing = checks.filter(function (c) { return !c.ok; });

    var html =
      '<div class="mp-stats">' +
        stat('📦', 'var(--primary-blue-light)', prods.length, L_('products')) +
        stat('🧾', 'var(--warning-light)', (s.stats && s.stats.totalOrders) || 0, L_('orders')) +
        stat('💰', 'var(--success-light)', MP.money((s.stats && s.stats.totalRevenue) || 0), L_('revenue')) +
        stat('⭐', 'var(--primary-red-light)', ((s.rating && s.rating.average) || 0).toFixed(1), L_('rating')) +
      '</div>' +

      '<div class="mp-card">' +
        '<div class="mp-card-title">' + MP.svg('<polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>') + L_('todo') + '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
          '<a class="mp-btn mp-btn-red" href="products.html">' + L_('addProd') + '</a>' +
          '<a class="mp-btn mp-btn-blue" href="orders.html">' + L_('seeOrders') + '</a>' +
          '<a class="mp-btn mp-btn-ghost" href="settings.html">' + L_('editStore') + '</a>' +
          '<a class="mp-btn mp-btn-ghost" href="' + storeUrl + '" target="_blank" rel="noopener">' + L_('viewLive') + '</a>' +
        '</div>' +
      '</div>';

    html += '<div class="mp-card">' +
      '<div class="mp-card-title">' + MP.svg('<polyline points="20 6 9 17 4 12"/>') + L_('checklist') + '</div>';
    if (!missing.length) {
      html += '<div style="font-size:var(--text-sm);color:var(--success);font-weight:600;">' + L_('allDone') + '</div>';
    } else {
      html += missing.map(function (c) {
        return '<div class="mp-row"><div class="mp-row-thumb" style="background:var(--warning-light);">!</div>' +
          '<div class="mp-row-main"><div class="mp-row-name">' + c.label + '</div></div>' +
          '<a class="mp-btn mp-btn-blue mp-btn-sm" href="' + c.href + '">' + L_('fix') + '</a></div>';
      }).join('');
    }
    html += '</div>';

    html += '<div class="mp-card">' +
      '<div class="mp-card-title">' + MP.svg('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>') + L_('recent') + '</div>';
    if (!orders.length) {
      html += '<div class="mp-empty" style="padding:var(--space-lg) 0;"><div class="mp-empty-icon">🧾</div><p>' + L_('noOrders') + '</p></div>';
    } else {
      html += orders.slice(0, 8).map(function (o) {
        var cust = (o.customer && o.customer.name) || '';
        return '<a class="mp-row" style="text-decoration:none;" href="orders.html">' +
          '<div class="mp-row-thumb">🧾</div>' +
          '<div class="mp-row-main"><div class="mp-row-name">#' + MP.esc(o.orderNumber || '') + '</div>' +
          '<div class="mp-row-sub">' + MP.esc(cust) + ' · ' + MP.when(o.createdAt) + '</div></div>' +
          '<div style="text-align:right;"><div class="mp-price">' + MP.money(o.total) + '</div>' +
          '<span class="mp-status ' + MP.esc(o.status) + '">' + MP.esc(o.status) + '</span></div></a>';
      }).join('');
    }
    html += '</div>';

    document.getElementById('mpBody').innerHTML = html;
    verifyCard();
  }

  /* 4 Nov 2026 (Jeffery): every new store is verified by HaitiBiznis before it is public. The merchant sees where
     his application stands and sends a missing / redo photo HERE - no need to register again. */
  var V = {
    wait:  { kr:'⏳ Magazen ou an atant verifikasyon HaitiBiznis. Ou ka ajoute pwodwi; li ap parèt piblik epi resevwa kòmand lè l apwouve.', fr:'⏳ Votre boutique attend la vérification de HaitiBiznis. Vous pouvez ajouter des produits ; elle sera publique et recevra des commandes une fois approuvée.', en:'⏳ Your store is waiting for HaitiBiznis verification. You can add products; it becomes public and receives orders once approved.', es:'⏳ Tu tienda espera la verificación de HaitiBiznis. Puedes agregar productos; será pública y recibirá pedidos cuando sea aprobada.' },
    fix:   { kr:'🔧 HaitiBiznis mande korije:', fr:'🔧 HaitiBiznis demande de corriger :', en:'🔧 HaitiBiznis asks you to correct:', es:'🔧 HaitiBiznis pide corregir:' },
    rej:   { kr:'⛔ Demann lan pa t aksepte:', fr:'⛔ La demande n’a pas été acceptée :', en:'⛔ The application was not accepted:', es:'⛔ La solicitud no fue aceptada:' },
    front: { kr:'Foto devan magazen an', fr:'Photo de la devanture', en:'Storefront photo', es:'Foto del frente' },
    owner: { kr:'Pyès idantite pwopriyetè a (prive)', fr:'Pièce d’identité du propriétaire (privée)', en:"Owner's ID (private)", es:'Documento del dueño (privado)' },
    info:  { kr:'Enfòmasyon magazen an', fr:'Les informations de la boutique', en:'The store information', es:'La información de la tienda' },
    have:  { kr:'✅ Resevwa', fr:'✅ Reçue', en:'✅ Received', es:'✅ Recibida' },
    miss:  { kr:'⚠️ Manke', fr:'⚠️ Manquante', en:'⚠️ Missing', es:'⚠️ Falta' },
    send:  { kr:'📷 Voye foto a', fr:'📷 Envoyer la photo', en:'📷 Send the photo', es:'📷 Enviar la foto' },
    ok:    { kr:'Foto a rive. Mèsi!', fr:'Photo reçue. Merci !', en:'Photo received. Thank you!', es:'Foto recibida. ¡Gracias!' },
    off:   { kr:'Foto a pa rive (koneksyon). Eseye ankò.', fr:'La photo n’est pas arrivée (connexion). Réessayez.', en:'The photo did not arrive (connection). Try again.', es:'La foto no llegó (conexión). Intenta de nuevo.' }
  };
  function V_(k) { var e = V[k]; return e ? (e[MP.lang()] || e.en) : k; }
  function verifyCard() {
    MP.req('GET', '/api/stores/my/verification').then(function (v) {
      if (!v || !v.success || v.state === 'approved') return;
      var body = document.getElementById('mpBody'); if (!body) return;
      var waiting = v.state === 'pending' || v.state === 'fix';
      var rows = [['storefront', V_('front')], ['owner_id', V_('owner')]].map(function (r) {
        var has = (v.docs || []).indexOf(r[0]) >= 0, redo = (v.fix || []).indexOf(r[0]) >= 0;
        return '<div class="mp-row"><div class="mp-row-main"><div class="mp-row-name">' + r[1] + '</div><div class="mp-row-sub">' + (redo ? '🔧' : has ? V_('have') : V_('miss')) + '</div></div>' +
          (waiting && (!has || redo) ? '<label class="mp-btn mp-btn-blue mp-btn-sm" style="cursor:pointer">' + V_('send') + '<input type="file" accept="image/*" data-vt="' + r[0] + '" style="display:none"></label>' : '') + '</div>';
      }).join('');
      var head = v.state === 'rejected' ? V_('rej') + ' ' + MP.esc(v.reason || '') : v.state === 'fix' ? V_('fix') + ' ' + (v.fix || []).map(function (x) { return x === 'storefront' ? V_('front') : x === 'owner_id' ? V_('owner') : V_('info'); }).join(', ') + (v.note ? ' — “' + MP.esc(v.note) + '”' : '') : V_('wait');
      var card = document.createElement('div'); card.className = 'mp-card'; card.id = 'mpVerify';
      card.style.border = '2px solid ' + (v.state === 'rejected' ? '#F2A7A7' : '#F3B36B');
      card.innerHTML = '<div class="mp-card-title" style="white-space:normal;line-height:1.4">' + head + '</div>' + rows;
      var old = document.getElementById('mpVerify'); if (old) old.remove();
      body.insertBefore(card, body.firstChild);
      card.querySelectorAll('input[data-vt]').forEach(function (inp) {
        inp.addEventListener('change', function () {
          var f = inp.files && inp.files[0]; if (!f) return;
          MP.compressImage(f, 1600, 1500000).then(function (url) {
            return MP.req('POST', '/api/stores/' + v.storeId + '/verification-docs', { type: inp.getAttribute('data-vt'), image_data: url });
          }).then(function (d) { if (!d || !d.success) throw new Error('send'); MP.toast(V_('ok'), 'success'); verifyCard(); })
            .catch(function () { MP.toast(V_('off'), 'error'); });
        });
      });
    }).catch(function () {});
  }

  langBar();
  MP.boot('dashboard', render);
})();
</script>
</body>
</html>
