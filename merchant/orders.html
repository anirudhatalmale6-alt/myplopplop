<style>
/* ===== Page Content ===== */
.page-content {
    padding: var(--space-md) var(--content-padding);
    padding-bottom: calc(var(--bottom-nav-height) + var(--space-lg));
}

/* ===== Sound Indicator ===== */
.sound-indicator {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    padding: var(--space-sm) var(--space-md);
    background: var(--primary-red-light);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-md);
    font-size: var(--text-xs);
    font-weight: 600;
    color: var(--primary-red);
}
.sound-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
}
.sound-bar {
    width: 3px;
    background: var(--primary-red);
    border-radius: 2px;
    animation: soundWave 1s ease-in-out infinite alternate;
}
.sound-bar:nth-child(1) { height: 6px; animation-delay: 0s; }
.sound-bar:nth-child(2) { height: 10px; animation-delay: 0.2s; }
.sound-bar:nth-child(3) { height: 14px; animation-delay: 0.4s; }
.sound-bar:nth-child(4) { height: 8px; animation-delay: 0.6s; }
@keyframes soundWave {
    from { transform: scaleY(0.4); }
    to { transform: scaleY(1); }
}

/* ===== Filter Tabs ===== */
.filter-tabs {
    display: flex;
    gap: var(--space-sm);
    margin-bottom: var(--space-md);
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: var(--space-xs);
}
.filter-tabs::-webkit-scrollbar { display: none; }
.filter-tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: var(--radius-full);
    font-size: var(--text-sm);
    font-weight: 500;
    color: var(--gray-600);
    background: var(--gray-100);
    white-space: nowrap;
    cursor: pointer;
    transition: all var(--transition-fast);
    border: none;
}
.filter-tab:hover { background: var(--gray-200); }
.filter-tab.active {
    background: var(--primary-red);
    color: var(--white);
}
.filter-tab .count {
    font-size: 11px;
    font-weight: 700;
    background: rgba(255,255,255,0.25);
    padding: 1px 6px;
    border-radius: var(--radius-full);
}
.filter-tab.active .count {
    background: rgba(255,255,255,0.3);
}

/* ===== Order Card ===== */
.order-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    border: 1px solid var(--gray-200);
    padding: var(--space-md);
    margin-bottom: var(--space-md);
    transition: box-shadow var(--transition-fast);
}
.order-card:hover { box-shadow: var(--shadow-sm); }
.order-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-sm);
}
.order-card-id {
    font-weight: 700;
    font-size: var(--text-base);
    color: var(--text-dark);
}
.order-card-customer {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    margin-bottom: var(--space-md);
}
.customer-avatar {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-full);
    background: var(--gray-200);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
}
.customer-name {
    font-weight: 600;
    font-size: var(--text-sm);
}
.customer-phone {
    font-size: var(--text-xs);
    color: var(--text-muted);
}
.order-items-list {
    background: var(--gray-50);
    border-radius: var(--radius-sm);
    padding: var(--space-sm) var(--space-md);
    margin-bottom: var(--space-md);
}
.order-item-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: var(--text-sm);
}
.order-item-row + .order-item-row {
    border-top: 1px solid var(--gray-200);
}
.order-item-qty {
    color: var(--primary-red);
    font-weight: 700;
    margin-right: 6px;
}
.order-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: var(--space-sm);
    border-top: 1px solid var(--gray-100);
}
.order-total-label {
    font-size: var(--text-xs);
    color: var(--text-muted);
}
.order-total-value {
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: var(--text-lg);
    color: var(--text-dark);
}
.order-time-placed {
    font-size: var(--text-xs);
    color: var(--gray-400);
    margin-bottom: var(--space-sm);
    display: flex;
    align-items: center;
    gap: 4px;
}
.order-actions {
    display: flex;
    gap: var(--space-sm);
    margin-top: var(--space-sm);
}
.order-actions .btn { flex: 1; }

/* ===== Status Badges ===== */
.badge-new { background: var(--primary-red-light); color: var(--primary-red); }
.badge-preparing { background: var(--warning-light); color: var(--warning); }
.badge-ready { background: var(--info-light); color: var(--info); }
.badge-delivered { background: var(--success-light); color: var(--success); }

/* ===== New order pulse ===== */
.order-card.is-new {
    border-color: var(--primary-red);
    border-width: 2px;
    animation: newOrderPulse 2s ease-in-out 3;
}
@keyframes newOrderPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(210,16,52,0); }
    50% { box-shadow: 0 0 0 6px rgba(210,16,52,0.15); }
}

/* ===== Merchant Bottom Nav ===== */
.merchant-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--bottom-nav-height);
    background: var(--white);
    border-top: 1px solid var(--gray-200);
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 1000;
    padding-bottom: env(safe-area-inset-bottom, 0);
}
.merchant-nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 12px;
    font-size: 10px;
    font-weight: 500;
    color: var(--gray-400);
    text-decoration: none;
    transition: color var(--transition-fast);
    position: relative;
}
.merchant-nav-item svg { width: 24px; height: 24px; }
.merchant-nav-item.active { color: var(--primary-red); }
.merchant-nav-item .nav-badge {
    position: absolute;
    top: 0;
    right: 4px;
    width: 16px;
    height: 16px;
    background: var(--primary-red);
    color: var(--white);
    font-size: 9px;
    font-weight: 700;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ===== Desktop ===== */
@media (min-width: 1024px) {
    .merchant-nav { display: none; }
    .page-content { padding-bottom: var(--space-lg); }
    .dashboard-content { max-width: 900px; }
    .orders-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-md);
    }
    .orders-grid .order-card { margin-bottom: 0; }
}
</style>

<script>
(function() {
    if (!API.isLoggedIn()) {
        window.location.href = '../login.html';
        return;
    }

    var myStore = null;
    var allOrders = [];
    var currentFilter = 'pending';

    function formatHTG(amount) {
        return (amount || 0).toLocaleString('fr-HT') + ' HTG';
    }

    function timeAgo(dateStr) {
        var diff = Date.now() - new Date(dateStr).getTime();
        var mins = Math.floor(diff / 60000);
        if (mins < 1) return 'Just now';
        if (mins < 60) return mins + ' min ago';
        var hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs + ' hr ago';
        return Math.floor(hrs / 24) + ' days ago';
    }

    function getInitials(name) {
        if (!name) return '??';
        return name.split(' ').map(function(w) { return w[0]; }).join('').toUpperCase().slice(0, 2);
    }

    function statusToBadge(status) {
        var map = {
            pending: { cls: 'badge-new', label: 'New' },
            confirmed: { cls: 'badge-new', label: 'Confirmed' },
            preparing: { cls: 'badge-preparing', label: 'Preparing' },
            ready: { cls: 'badge-ready', label: 'Ready' },
            picked_up: { cls: 'badge-ready', label: 'Picked Up' },
            delivering: { cls: 'badge-ready', label: 'On the Way' },
            delivered: { cls: 'badge-delivered', label: 'Delivered' },
            cancelled: { cls: '', label: 'Cancelled' }
        };
        return map[status] || { cls: '', label: status };
    }

    function getActions(order) {
        var s = order.status;
        var id = order._id;
        if (s === 'pending') {
            return '<button class="btn btn-white btn-sm" onclick="declineOrder(\'' + id + '\')">Decline</button>' +
                   '<button class="btn btn-red btn-sm" onclick="acceptOrder(\'' + id + '\')">Accept</button>';
        }
        if (s === 'confirmed') {
            return '<button class="btn btn-blue btn-sm btn-full" onclick="startPreparing(\'' + id + '\')">Start Preparing</button>';
        }
        if (s === 'preparing') {
            return '<button class="btn btn-blue btn-sm btn-full" onclick="markReady(\'' + id + '\')">Ready for Pickup</button>';
        }
        if (s === 'ready') {
            if (order.deliveryType === 'delivery' && !order.msouwoutRideId) {
                return '<button class="btn btn-blue btn-sm btn-full" onclick="requestDriver(\'' + id + '\')">Request MsouWout Driver</button>';
            }
            return '<button class="btn btn-white btn-sm btn-full" disabled>Awaiting Pickup</button>';
        }
        if (s === 'picked_up' || s === 'delivering') {
            return '<span style="font-size:var(--text-xs);color:var(--info);font-weight:600;">Driver en route</span>';
        }
        if (s === 'delivered') {
            return '<span style="font-size:var(--text-xs);color:var(--success);font-weight:600;">Completed</span>';
        }
        return '';
    }

    function renderCard(order) {
        var badge = statusToBadge(order.status);
        var isNew = order.status === 'pending';
        var cName = order.customer ? order.customer.name : (order.recipient ? order.recipient.name : 'Customer');
        var cPhone = order.customer ? order.customer.phone : (order.recipient ? order.recipient.phone : '');

        var itemsHtml = '';
        if (order.items && order.items.length) {
            order.items.forEach(function(item) {
                itemsHtml += '<div class="order-item-row">' +
                    '<span><span class="order-item-qty">' + item.quantity + 'x</span> ' + item.name + '</span>' +
                    '<span>' + formatHTG(item.subtotal) + '</span>' +
                '</div>';
            });
        }

        return '<div class="order-card' + (isNew ? ' is-new' : '') + '" data-status="' + order.status + '" data-id="' + order._id + '">' +
            '<div class="order-card-header">' +
                '<span class="order-card-id">#' + order.orderNumber + '</span>' +
                '<span class="badge ' + badge.cls + '">' + badge.label + '</span>' +
            '</div>' +
            '<div class="order-card-customer">' +
                '<div class="customer-avatar">' + getInitials(cName) + '</div>' +
                '<div>' +
                    '<div class="customer-name">' + cName + '</div>' +
                    '<div class="customer-phone">' + cPhone + '</div>' +
                '</div>' +
            '</div>' +
            '<div class="order-time-placed">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
                timeAgo(order.createdAt) +
            '</div>' +
            '<div class="order-items-list">' + itemsHtml + '</div>' +
            '<div class="order-card-footer">' +
                '<div>' +
                    '<div class="order-total-label">Total</div>' +
                    '<div class="order-total-value">' + formatHTG(order.total) + '</div>' +
                '</div>' +
            '</div>' +
            '<div class="order-actions">' + getActions(order) + '</div>' +
        '</div>';
    }

    function renderOrders() {
        var grid = document.getElementById('ordersGrid');
        var filtered = allOrders;

        if (currentFilter !== 'all') {
            filtered = allOrders.filter(function(o) {
                if (currentFilter === 'pending') return o.status === 'pending' || o.status === 'confirmed';
                return o.status === currentFilter;
            });
        }

        if (filtered.length === 0) {
            grid.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-muted);">' +
                '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin:0 auto 12px;display:block;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' +
                '<div style="font-weight:600;margin-bottom:4px;">No orders</div>' +
                '<div style="font-size:var(--text-sm);">Orders will appear here when customers place them</div>' +
            '</div>';
            return;
        }

        filtered.sort(function(a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
        grid.innerHTML = filtered.map(renderCard).join('');

        // Update counts
        var newCount = allOrders.filter(function(o) { return o.status === 'pending' || o.status === 'confirmed'; }).length;
        var prepCount = allOrders.filter(function(o) { return o.status === 'preparing'; }).length;
        var readyCount = allOrders.filter(function(o) { return o.status === 'ready'; }).length;
        document.getElementById('countNew').textContent = newCount;
        document.getElementById('countPreparing').textContent = prepCount;
        document.getElementById('countReady').textContent = readyCount;

        // Update nav badge
        var navBadge = document.querySelector('.merchant-nav-item.active .nav-badge');
        if (navBadge) navBadge.textContent = newCount + prepCount + readyCount;
    }

    // Filter tab click handlers
    document.querySelectorAll('#filterTabs .filter-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            document.querySelectorAll('#filterTabs .filter-tab').forEach(function(t) { t.classList.remove('active'); });
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            renderOrders();
        });
    });

    // Order actions
    window.acceptOrder = async function(orderId) {
        var res = await API.updateOrderStatus(orderId, 'confirmed');
        if (res.success) {
            var order = allOrders.find(function(o) { return o._id === orderId; });
            if (order) order.status = 'confirmed';
            startPreparing(orderId);
        } else {
            alert('Failed: ' + (res.message || 'Unknown error'));
        }
    };

    window.startPreparing = async function(orderId) {
        var res = await API.updateOrderStatus(orderId, 'preparing');
        if (res.success) {
            var order = allOrders.find(function(o) { return o._id === orderId; });
            if (order) order.status = 'preparing';
            renderOrders();
        }
    };

    window.markReady = async function(orderId) {
        var res = await API.updateOrderStatus(orderId, 'ready');
        if (res.success) {
            var order = allOrders.find(function(o) { return o._id === orderId; });
            if (order) order.status = 'ready';
            renderOrders();

            // Auto-request MsouWout driver for delivery orders
            if (order && order.deliveryType === 'delivery') {
                requestDriver(orderId);
            }
        }
    };

    window.declineOrder = async function(orderId) {
        if (!confirm('Decline this order?')) return;
        var res = await API.updateOrderStatus(orderId, 'cancelled', 'Declined by merchant');
        if (res.success) {
            allOrders = allOrders.filter(function(o) { return o._id !== orderId; });
            renderOrders();
        }
    };

    window.requestDriver = async function(orderId) {
        var btn = document.querySelector('[data-id="' + orderId + '"] .order-actions button');
        if (btn) { btn.disabled = true; btn.textContent = 'Requesting driver...'; }

        var res = await API.requestDriver(orderId);
        if (res.success) {
            var order = allOrders.find(function(o) { return o._id === orderId; });
            if (order) order.msouwoutRideId = res.rideId || true;
            renderOrders();
            alert('Driver requested! Tracking: ' + (res.trackingCode || 'Searching...'));
        } else {
            if (btn) { btn.disabled = false; btn.textContent = 'Request MsouWout Driver'; }
            alert(res.message || 'Could not request driver. Try again.');
        }
    };

    // Load store and orders
    async function loadOrders() {
        if (!myStore) {
            var storeRes = await API.getMyStore();
            if (storeRes.success && storeRes.data) {
                myStore = storeRes.data.store;
                // Update sidebar store name
                var nameEl = document.querySelector('.sidebar div[style*="font-weight:700"]');
                if (nameEl && myStore.name) nameEl.textContent = myStore.name;
            } else {
                document.getElementById('ordersGrid').innerHTML =
                    '<div style="text-align:center;padding:60px;color:var(--text-muted);">' +
                    '<div style="font-weight:600;margin-bottom:8px;">No store found</div>' +
                    '<div style="font-size:var(--text-sm);">Create a store first using the <a href="../store-designer.html">Store Designer</a></div></div>';
                return;
            }
        }

        var ordersRes = await API.getStoreOrders(myStore._id, 1);
        if (ordersRes.success && ordersRes.data) {
            allOrders = ordersRes.data;
        }
        renderOrders();
    }

    loadOrders();
    setInterval(loadOrders, 10000);
})();
</script>

<script src="/js/api.js"></script>
<script src="/js/i18n.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js");}</script>
</body>
