<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D21034">
<meta property="og:image" content="https://myplopplop.com/assets/og-myplopplop.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<title>Kòmand — MyPlopPlop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/merchant.css">
<style>
.mp-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: var(--space-md); -webkit-overflow-scrolling: touch; }
.mp-tab {
  flex: 0 0 auto; padding: 8px 14px; border-radius: var(--radius-full); cursor: pointer;
  border: 1px solid var(--gray-300); background: var(--white); color: var(--gray-600);
  font-family: var(--font-body); font-size: var(--text-xs); font-weight: 700; white-space: nowrap;
}
.mp-tab.active { background: var(--primary-red); border-color: var(--primary-red); color: var(--white); }
.mp-order { display: block; background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: var(--space-md); margin-bottom: var(--space-sm); }
.mp-order-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-sm); }
.mp-order-num { font-family: var(--font-heading); font-weight: 700; font-size: var(--text-sm); color: var(--text-dark); }
.mp-order-items { margin: var(--space-sm) 0; padding: var(--space-sm) 0; border-top: 1px solid var(--gray-100); border-bottom: 1px solid var(--gray-100); font-size: var(--text-xs); color: var(--gray-600); }
.mp-order-items div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.mp-order-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: var(--space-sm); }
</style>
</head>
<body style="background:var(--bg-light);">

<div class="mp-topbar">
  <a class="mp-brand" href="../index.html">
    <img src="../assets/icon-192.png" alt="MyPlopPlop">
    <span>Merchant</span>
  </a>
  <div class="mp-top-actions" id="mpLangBar"></div>
</div>

<div class="mp-store-header" id="mpStoreHeader"></div>

<div class="mp-layout">
  <aside class="mp-sidebar" id="mpSidebar"></aside>
  <main class="mp-main">
    <h1 class="mp-page-title" id="pgTitle">Kòmand</h1>
    <div id="mpBody"></div>
  </main>
</div>

<nav class="mp-bottom-nav" id="mpBottomNav"></nav>

<script src="../js/merchant.js"></script>
<script>
(function () {
  var L = {
    title:   { kr:'Kòmand', fr:'Commandes', en:'Orders', es:'Pedidos' },
    all:     { kr:'Tout', fr:'Toutes', en:'All', es:'Todos' },
    news:    { kr:'Nouvo', fr:'Nouvelles', en:'New', es:'Nuevos' },
    active:  { kr:'An kou', fr:'En cours', en:'In progress', es:'En curso' },
    done:    { kr:'Fini', fr:'Terminées', en:'Completed', es:'Completados' },
    none:    { kr:'Pa gen kòmand isit la.', fr:'Aucune commande ici.', en:'No orders here.', es:'Sin pedidos aquí.' },
    accept:  { kr:'Aksepte', fr:'Accepter', en:'Accept', es:'Aceptar' },
    prep:    { kr:'M ap prepare l', fr:'En préparation', en:'Preparing', es:'Preparando' },
    ready:   { kr:'Li pare — rele chofè a', fr:'Prêt — appeler le livreur', en:'Ready — call the driver', es:'Listo — llamar repartidor' },
    deliv:   { kr:'Livre', fr:'Livré', en:'Delivered', es:'Entregado' },
    cancel:  { kr:'Anile', fr:'Annuler', en:'Cancel', es:'Cancelar' },
    confirmCancel: { kr:'Anile kòmand sa a ?', fr:'Annuler cette commande ?', en:'Cancel this order?', es:'¿Cancelar este pedido?' },
    pickup:  { kr:'Kliyan an ap vin chèche', fr:'Retrait sur place', en:'Customer pickup', es:'Recogida' },
    delivery:{ kr:'Livrezon', fr:'Livraison', en:'Delivery', es:'Entrega' },
    driver:  { kr:'Chofè', fr:'Livreur', en:'Driver', es:'Repartidor' },
    pin:     { kr:'Kòd', fr:'Code', en:'PIN', es:'Código' },
    refresh: { kr:'Aktyalize', fr:'Actualiser', en:'Refresh', es:'Actualizar' },
    unpaid:  { kr:'Poko peye', fr:'Non payé', en:'Unpaid', es:'No pagado' },
    paid:    { kr:'Peye', fr:'Payé', en:'Paid', es:'Pagado' }
  };
  function L_(k) { var e = L[k]; return e ? (e[MP.lang()] || e.en) : k; }

  function langBar() {
    var bar = document.getElementById('mpLangBar');
    bar.innerHTML = ['kr', 'fr', 'en', 'es'].map(function (l) {
      var flag = { kr: '🇭🇹', fr: '🇫🇷', en: '🇬🇧', es: '🇪🇸' }[l];
      return '<button class="mp-lang' + (MP.lang() === l ? ' active' : '') + '" data-l="' + l + '">' + flag + '</button>';
    }).join('');
    bar.querySelectorAll('[data-l]').forEach(function (b) {
      b.addEventListener('click', function () { localStorage.setItem('pp_lang', b.dataset.l); location.reload(); });
    });
  }

  var storeId = null, orders = [], tab = 'new';
  var TABS = [
    ['new',    'news',   ['pending']],
    ['active', 'active', ['confirmed', 'preparing', 'ready', 'picked_up', 'delivering']],
    ['done',   'done',   ['delivered', 'cancelled']],
    ['all',    'all',    null]
  ];

  /* the merchant's next step for each status — one obvious button, no menus */
  var NEXT = {
    pending:   { to: 'confirmed', label: 'accept', cls: 'mp-btn-red' },
    confirmed: { to: 'preparing', label: 'prep',   cls: 'mp-btn-blue' },
    preparing: { to: 'ready',     label: 'ready',  cls: 'mp-btn-red' },
    ready:     null,   // dispatch engine takes over: nearest driver is offered the job
    picked_up: null,
    delivering:null
  };

  var tabPicked = false;
  function load() {
    return MP.req('GET', '/api/stores/' + storeId + '/orders?limit=60').then(function (d) {
      orders = (d && d.success && d.data) ? d.data : [];
      // Open on the first tab that actually has orders, so the merchant never
      // lands on an empty screen while work is waiting one tab over.
      if (!tabPicked) {
        tabPicked = true;
        for (var i = 0; i < TABS.length; i++) {
          var st = TABS[i][2];
          var n = st ? orders.filter(function (o) { return st.indexOf(o.status) !== -1; }).length : orders.length;
          if (n > 0) { tab = TABS[i][0]; break; }
        }
      }
      render();
    });
  }

  function render() {
    document.getElementById('pgTitle').textContent = L_('title');
    var def = TABS.filter(function (t) { return t[0] === tab; })[0];
    var list = def[2] ? orders.filter(function (o) { return def[2].indexOf(o.status) !== -1; }) : orders;

    var html = '<div class="mp-tabs">' + TABS.map(function (t) {
      var n = t[2] ? orders.filter(function (o) { return t[2].indexOf(o.status) !== -1; }).length : orders.length;
      return '<button class="mp-tab' + (t[0] === tab ? ' active' : '') + '" data-tab="' + t[0] + '">' +
        L_(t[1]) + ' (' + n + ')</button>';
    }).join('') + '</div>';

    if (!list.length) {
      html += '<div class="mp-empty"><div class="mp-empty-icon">🧾</div><p>' + L_('none') + '</p>' +
        '<button class="mp-btn mp-btn-ghost" id="btnRefresh">' + L_('refresh') + '</button></div>';
    } else {
      html += list.map(card).join('');
      html += '<button class="mp-btn mp-btn-ghost mp-btn-block" id="btnRefresh">' + L_('refresh') + '</button>';
    }

    document.getElementById('mpBody').innerHTML = html;

    document.querySelectorAll('[data-tab]').forEach(function (b) {
      b.addEventListener('click', function () { tab = b.dataset.tab; render(); });
    });
    var r = document.getElementById('btnRefresh');
    if (r) r.addEventListener('click', function () { r.disabled = true; load(); });
    document.querySelectorAll('[data-adv]').forEach(function (b) {
      b.addEventListener('click', function () { advance(b.dataset.adv, b.dataset.to, b); });
    });
    document.querySelectorAll('[data-cancel]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm(L_('confirmCancel'))) return;
        advance(b.dataset.cancel, 'cancelled', b);
      });
    });
  }

  function card(o) {
    var cust = (o.customer && o.customer.name) || '';
    var phone = (o.customer && o.customer.phone) || '';
    var next = NEXT[o.status];
    var items = (o.items || []).map(function (it) {
      return '<div><span>' + (it.quantity || 1) + '× ' + MP.esc(it.name || '') + '</span><span>' + MP.money(it.subtotal || 0) + '</span></div>';
    }).join('');

    var actions = '';
    if (next) {
      actions += '<button class="mp-btn ' + next.cls + '" style="flex:1;" data-adv="' + o._id + '" data-to="' + next.to + '">' + L_(next.label) + '</button>';
    }
    if (o.status === 'ready' || o.status === 'picked_up' || o.status === 'delivering') {
      if (o.deliveryType === 'pickup') {
        actions += '<button class="mp-btn mp-btn-red" style="flex:1;" data-adv="' + o._id + '" data-to="delivered">' + L_('deliv') + '</button>';
      }
    }
    if (['pending', 'confirmed', 'preparing'].indexOf(o.status) !== -1) {
      actions += '<button class="mp-btn mp-btn-ghost mp-btn-sm" data-cancel="' + o._id + '">' + L_('cancel') + '</button>';
    }

    return '<div class="mp-order">' +
      '<div class="mp-order-top">' +
        '<div><div class="mp-order-num">#' + MP.esc(o.orderNumber || '') + '</div>' +
          '<div class="mp-row-sub">' + MP.esc(cust) + (phone ? ' · ' + MP.esc(phone) : '') + ' · ' + MP.when(o.createdAt) + '</div>' +
          '<div class="mp-row-sub">' + (o.deliveryType === 'pickup' ? L_('pickup') : L_('delivery')) +
            (o.rider && o.rider.name ? ' · ' + L_('driver') + ': ' + MP.esc(o.rider.name) : '') +
            (o.deliveryPin ? ' · ' + L_('pin') + ' ' + MP.esc(o.deliveryPin) : '') + '</div>' +
        '</div>' +
        '<div style="text-align:right;flex-shrink:0;">' +
          '<div class="mp-price">' + MP.money(o.total) + '</div>' +
          '<span class="mp-status ' + MP.esc(o.status) + '">' + MP.esc(o.status) + '</span>' +
          '<div class="mp-row-sub">' + (o.paymentStatus === 'paid' ? '✅ ' + L_('paid') : '⏳ ' + L_('unpaid')) + '</div>' +
        '</div>' +
      '</div>' +
      (items ? '<div class="mp-order-items">' + items + '</div>' : '') +
      (actions ? '<div class="mp-order-actions">' + actions + '</div>' : '') +
    '</div>';
  }

  function advance(id, to, btn) {
    btn.disabled = true;
    MP.req('PUT', '/api/orders/' + id + '/status', { status: to }).then(function (d) {
      if (!d || !d.success) throw new Error((d && d.message) || 'failed');
      MP.toast(MP.t('saved'), 'success');
      return load();
    }).catch(function () {
      btn.disabled = false;
      MP.toast(MP.t('saveFail'), 'error');
    });
  }

  langBar();
  MP.boot('orders', function (data) {
    storeId = data.store._id;
    load();
  });
})();
</script>
</body>
</html>
