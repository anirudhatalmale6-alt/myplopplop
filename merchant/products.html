<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D21034">
<meta property="og:image" content="https://myplopplop.com/assets/og-myplopplop.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<title>Pwodwi — MyPlopPlop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/merchant.css">
</head>
<body style="background:var(--bg-light);">

<div class="mp-topbar">
  <a class="mp-brand" href="../index.html">
    <img src="../assets/icon-192.png" alt="MyPlopPlop">
    <span>Merchant</span>
  </a>
  <div class="mp-top-actions" id="mpLangBar"></div>
</div>

<div class="mp-store-header" id="mpStoreHeader"></div>

<div class="mp-layout">
  <aside class="mp-sidebar" id="mpSidebar"></aside>
  <main class="mp-main">
    <h1 class="mp-page-title" id="pgTitle">Pwodwi</h1>
    <div id="mpBody"></div>
  </main>
</div>

<nav class="mp-bottom-nav" id="mpBottomNav"></nav>

<div class="mp-modal" id="prodModal">
  <div class="mp-modal-box">
    <div class="mp-modal-title" id="modalTitle"></div>
    <div class="mp-field"><label id="lbPhoto"></label>
      <div class="mp-logo-row">
        <div class="mp-logo-preview" id="pPrev">📦</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button class="mp-btn mp-btn-blue mp-btn-sm" id="pPick"></button>
          <button class="mp-btn mp-btn-ghost mp-btn-sm" id="pClear"></button>
        </div>
        <input type="file" accept="image/*" class="mp-file" id="pFile">
      </div>
    </div>
    <div class="mp-field"><label id="lbName"></label><input class="mp-input" id="pName" maxlength="120"></div>
    <div class="mp-grid-2">
      <div class="mp-field"><label id="lbPrice"></label><input class="mp-input" type="number" min="0" id="pPrice"></div>
      <div class="mp-field"><label id="lbStock"></label><input class="mp-input" type="number" min="0" id="pStock"></div>
    </div>
    <div class="mp-field"><label id="lbCat"></label><input class="mp-input" id="pCat" maxlength="60"></div>
    <div class="mp-field"><label id="lbDesc"></label><textarea class="mp-textarea" id="pDesc" maxlength="500"></textarea></div>
    <label class="mp-hours-closed" style="margin-bottom:var(--space-md);"><input type="checkbox" id="pInStock" checked> <span id="lbInStock"></span></label>
    <div style="display:flex;gap:8px;">
      <button class="mp-btn mp-btn-ghost" style="flex:1;" id="pCancel"></button>
      <button class="mp-btn mp-btn-red" style="flex:2;" id="pSave"></button>
    </div>
  </div>
</div>

<script src="../js/merchant.js"></script>
<script>
(function () {
  var L = {
    title:    { kr:'Pwodwi', fr:'Produits', en:'Products', es:'Productos' },
    add:      { kr:'+ Ajoute yon pwodwi', fr:'+ Ajouter un produit', en:'+ Add a product', es:'+ Añadir producto' },
    bulk:     { kr:'Enpòte yon lis (CSV/Excel)', fr:'Importer une liste (CSV/Excel)', en:'Import a list (CSV/Excel)', es:'Importar lista (CSV/Excel)' },
    search:   { kr:'Chèche yon pwodwi...', fr:'Rechercher un produit...', en:'Search a product...', es:'Buscar producto...' },
    none:     { kr:'Pa gen pwodwi ankò. Ajoute premye a !', fr:'Aucun produit. Ajoutez le premier !', en:'No products yet. Add your first one!', es:'Sin productos aún.' },
    noMatch:  { kr:'Anyen pa koresponn.', fr:'Aucun résultat.', en:'No matches.', es:'Sin resultados.' },
    newP:     { kr:'Nouvo pwodwi', fr:'Nouveau produit', en:'New product', es:'Nuevo producto' },
    editP:    { kr:'Modifye pwodwi', fr:'Modifier le produit', en:'Edit product', es:'Editar producto' },
    photo:    { kr:'Foto', fr:'Photo', en:'Photo', es:'Foto' },
    choose:   { kr:'Chwazi', fr:'Choisir', en:'Choose', es:'Elegir' },
    remove:   { kr:'Retire', fr:'Retirer', en:'Remove', es:'Quitar' },
    name:     { kr:'Non pwodwi a', fr:'Nom du produit', en:'Product name', es:'Nombre' },
    price:    { kr:'Pri (HTG)', fr:'Prix (HTG)', en:'Price (HTG)', es:'Precio (HTG)' },
    stock:    { kr:'Kantite nan estòk', fr:'Quantité en stock', en:'Stock quantity', es:'Cantidad' },
    cat:      { kr:'Kategori', fr:'Catégorie', en:'Category', es:'Categoría' },
    desc:     { kr:'Deskripsyon', fr:'Description', en:'Description', es:'Descripción' },
    inStock:  { kr:'Disponib pou vann', fr:'Disponible à la vente', en:'Available for sale', es:'Disponible' },
    cancel:   { kr:'Anile', fr:'Annuler', en:'Cancel', es:'Cancelar' },
    save:     { kr:'Anrejistre', fr:'Enregistrer', en:'Save', es:'Guardar' },
    saving:   { kr:'Ap anrejistre...', fr:'Enregistrement...', en:'Saving...', es:'Guardando...' },
    edit:     { kr:'Modifye', fr:'Modifier', en:'Edit', es:'Editar' },
    del:      { kr:'Efase', fr:'Supprimer', en:'Delete', es:'Borrar' },
    confirmDel:{ kr:'Efase pwodwi sa a ?', fr:'Supprimer ce produit ?', en:'Delete this product?', es:'¿Borrar este producto?' },
    out:      { kr:'Fini nan estòk', fr:'Rupture de stock', en:'Out of stock', es:'Agotado' },
    needName: { kr:'Mete yon non ak yon pri.', fr:'Indiquez un nom et un prix.', en:'Enter a name and a price.', es:'Pon nombre y precio.' },
    tooBig:   { kr:'Foto a twò gwo.', fr:'Photo trop lourde.', en:'Photo too heavy.', es:'Foto muy pesada.' }
  };
  function L_(k) { var e = L[k]; return e ? (e[MP.lang()] || e.en) : k; }

  function langBar() {
    var bar = document.getElementById('mpLangBar');
    bar.innerHTML = ['kr', 'fr', 'en', 'es'].map(function (l) {
      var flag = { kr: '🇭🇹', fr: '🇫🇷', en: '🇬🇧', es: '🇪🇸' }[l];
      return '<button class="mp-lang' + (MP.lang() === l ? ' active' : '') + '" data-l="' + l + '">' + flag + '</button>';
    }).join('');
    bar.querySelectorAll('[data-l]').forEach(function (b) {
      b.addEventListener('click', function () { localStorage.setItem('pp_lang', b.dataset.l); location.reload(); });
    });
  }

  var products = [], storeId = null, editing = null, photo = '', filter = '';

  function render() {
    document.getElementById('pgTitle').textContent = L_('title');
    var list = products.filter(function (p) {
      if (!filter) return true;
      return (p.name || '').toLowerCase().indexOf(filter) !== -1 ||
             (p.category || '').toLowerCase().indexOf(filter) !== -1;
    });

    var html =
      '<div style="display:flex;gap:8px;margin-bottom:var(--space-md);flex-wrap:wrap;">' +
        '<button class="mp-btn mp-btn-red" style="flex:1;min-width:180px;" id="btnAdd">' + L_('add') + '</button>' +
        '<a class="mp-btn mp-btn-ghost" style="flex:1;min-width:180px;" href="inventory.html">' + L_('bulk') + '</a>' +
      '</div>' +
      '<input class="mp-input" id="q" placeholder="' + L_('search') + '" value="' + MP.esc(filter) + '" style="margin-bottom:var(--space-md);">';

    if (!products.length) {
      html += '<div class="mp-empty"><div class="mp-empty-icon">📦</div><p>' + L_('none') + '</p></div>';
    } else if (!list.length) {
      html += '<div class="mp-empty"><div class="mp-empty-icon">🔍</div><p>' + L_('noMatch') + '</p></div>';
    } else {
      html += list.map(function (p) {
        var img = (p.images && p.images[0]) ? '<img src="' + MP.esc(p.images[0]) + '" alt="">' : '📦';
        return '<div class="mp-row">' +
          '<div class="mp-row-thumb">' + img + '</div>' +
          '<div class="mp-row-main">' +
            '<div class="mp-row-name">' + MP.esc(p.name) + '</div>' +
            '<div class="mp-row-sub">' + MP.money(p.price) +
              (p.category ? ' · ' + MP.esc(p.category) : '') +
              (p.inStock === false ? ' · <span style="color:var(--error);font-weight:600;">' + L_('out') + '</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="mp-row-actions">' +
            '<button class="mp-btn mp-btn-ghost mp-btn-sm" data-edit="' + p._id + '">' + L_('edit') + '</button>' +
            '<button class="mp-btn mp-btn-ghost mp-btn-sm" data-del="' + p._id + '" style="color:var(--error);">✕</button>' +
          '</div></div>';
      }).join('');
    }

    document.getElementById('mpBody').innerHTML = html;

    document.getElementById('btnAdd').addEventListener('click', function () { openModal(null); });
    var q = document.getElementById('q');
    q.addEventListener('input', function () {
      filter = q.value.trim().toLowerCase();
      var pos = q.selectionStart;
      render();
      var nq = document.getElementById('q');
      nq.focus(); nq.setSelectionRange(pos, pos);
    });
    document.querySelectorAll('[data-edit]').forEach(function (b) {
      b.addEventListener('click', function () {
        openModal(products.filter(function (p) { return p._id === b.dataset.edit; })[0]);
      });
    });
    document.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function () { del(b.dataset.del); });
    });
  }

  /* ---- modal ---- */
  var modal = document.getElementById('prodModal');
  function labels() {
    document.getElementById('lbPhoto').textContent = L_('photo');
    document.getElementById('lbName').textContent = L_('name');
    document.getElementById('lbPrice').textContent = L_('price');
    document.getElementById('lbStock').textContent = L_('stock');
    document.getElementById('lbCat').textContent = L_('cat');
    document.getElementById('lbDesc').textContent = L_('desc');
    document.getElementById('lbInStock').textContent = L_('inStock');
    document.getElementById('pPick').textContent = L_('choose');
    document.getElementById('pClear').textContent = L_('remove');
    document.getElementById('pCancel').textContent = L_('cancel');
    document.getElementById('pSave').textContent = L_('save');
  }

  function setPhoto(url) {
    photo = url || '';
    var prev = document.getElementById('pPrev');
    prev.className = 'mp-logo-preview' + (photo ? ' has' : '');
    prev.innerHTML = photo ? '<img src="' + photo + '" alt="">' : '📦';
  }

  function openModal(p) {
    editing = p || null;
    document.getElementById('modalTitle').textContent = p ? L_('editP') : L_('newP');
    document.getElementById('pName').value = p ? (p.name || '') : '';
    document.getElementById('pPrice').value = p ? (p.price || '') : '';
    document.getElementById('pStock').value = (p && p.stockQuantity >= 0) ? p.stockQuantity : '';
    document.getElementById('pCat').value = p ? (p.category || '') : '';
    document.getElementById('pDesc').value = p ? (p.description || '') : '';
    document.getElementById('pInStock').checked = p ? p.inStock !== false : true;
    setPhoto(p && p.images && p.images[0]);
    modal.classList.add('open');
  }
  function closeModal() { modal.classList.remove('open'); editing = null; }

  document.getElementById('pCancel').addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
  document.getElementById('pPick').addEventListener('click', function () { document.getElementById('pFile').click(); });
  document.getElementById('pClear').addEventListener('click', function () { setPhoto(''); });
  document.getElementById('pFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    MP.compressImage(f, 700, 220000).then(setPhoto).catch(function () { MP.toast(L_('tooBig'), 'error'); });
  });

  document.getElementById('pSave').addEventListener('click', function () {
    var btn = this;
    var name = document.getElementById('pName').value.trim();
    var price = parseFloat(document.getElementById('pPrice').value);
    if (!name || !(price >= 0)) { MP.toast(L_('needName'), 'error'); return; }
    var stockRaw = document.getElementById('pStock').value;
    var body = {
      name: name,
      price: price,
      category: document.getElementById('pCat').value.trim(),
      description: document.getElementById('pDesc').value.trim(),
      images: photo ? [photo] : [],
      stockQuantity: stockRaw === '' ? -1 : (parseInt(stockRaw, 10) || 0),
      inStock: document.getElementById('pInStock').checked
    };
    btn.disabled = true; btn.textContent = L_('saving');
    var call = editing
      ? MP.req('PUT', '/api/stores/products/' + editing._id, body)
      : MP.req('POST', '/api/stores/' + storeId + '/products', body);
    call.then(function (d) {
      btn.disabled = false; btn.textContent = L_('save');
      if (!d || !d.success) throw new Error((d && d.message) || 'failed');
      if (editing) {
        products = products.map(function (p) { return p._id === editing._id ? d.data : p; });
      } else {
        products.unshift(d.data);
      }
      closeModal();
      render();
      MP.toast(MP.t('saved'), 'success');
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = L_('save');
      MP.toast(e && e.message === 'too_large' ? L_('tooBig') : MP.t('saveFail'), 'error');
    });
  });

  function del(id) {
    if (!confirm(L_('confirmDel'))) return;
    MP.req('DELETE', '/api/stores/products/' + id).then(function (d) {
      if (!d || !d.success) throw new Error('failed');
      products = products.filter(function (p) { return p._id !== id; });
      render();
      MP.toast(MP.t('saved'), 'success');
    }).catch(function () { MP.toast(MP.t('saveFail'), 'error'); });
  }

  langBar();
  labels();
  MP.boot('products', function (data) {
    storeId = data.store._id;
    products = data.products || [];
    render();
  });
})();
</script>
</body>
</html>
