<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D21034">
<meta property="og:image" content="https://myplopplop.com/assets/og-myplopplop.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<title>Paramèt Boutik — MyPlopPlop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/merchant.css">
</head>
<body style="background:var(--bg-light);">

<div class="mp-topbar">
  <a class="mp-brand" href="../index.html">
    <img src="../assets/icon-192.png" alt="MyPlopPlop">
    <span>Merchant</span>
  </a>
  <div class="mp-top-actions" id="mpLangBar"></div>
</div>

<div class="mp-store-header" id="mpStoreHeader"></div>

<div class="mp-layout">
  <aside class="mp-sidebar" id="mpSidebar"></aside>
  <main class="mp-main">
    <h1 class="mp-page-title" id="pgTitle">Paramèt</h1>
    <div id="mpBody"></div>
  </main>
</div>

<nav class="mp-bottom-nav" id="mpBottomNav"></nav>

<script src="../js/merchant.js"></script>
<script>
(function () {
  var L = {
    title:      { kr:'Paramèt', fr:'Paramètres', en:'Settings', es:'Ajustes' },
    accepting:  { kr:'Boutik la ouvè', fr:'Boutique ouverte', en:'Store is open', es:'Tienda abierta' },
    acceptSub:  { kr:'Kliyan yo ka wè w epi kòmande', fr:'Les clients vous voient et commandent', en:'Customers can see you and order', es:'Los clientes pueden ver y pedir' },
    closedT:    { kr:'Boutik la fèmen', fr:'Boutique fermée', en:'Store is closed', es:'Tienda cerrada' },
    closedSub:  { kr:'Boutik ou kache pou kliyan yo', fr:'Votre boutique est masquée', en:'Your store is hidden from customers', es:'Tu tienda está oculta' },
    identity:   { kr:'Idantite Boutik', fr:'Identité de la boutique', en:'Store identity', es:'Identidad' },
    logo:       { kr:'Logo boutik ou', fr:'Logo de la boutique', en:'Store logo', es:'Logo de la tienda' },
    choose:     { kr:'Chwazi yon imaj', fr:'Choisir une image', en:'Choose an image', es:'Elegir imagen' },
    remove:     { kr:'Retire', fr:'Retirer', en:'Remove', es:'Quitar' },
    logoHint:   { kr:'JPG oswa PNG. Nou redwi li otomatikman — pran nenpòt foto nan telefòn ou.', fr:"JPG ou PNG. Redimensionné automatiquement — prenez n'importe quelle photo.", en:'JPG or PNG. Resized automatically — any phone photo works.', es:'JPG o PNG. Se redimensiona solo.' },
    name:       { kr:'Non boutik la', fr:'Nom de la boutique', en:'Store name', es:'Nombre' },
    desc:       { kr:'Deskripsyon', fr:'Description', en:'Description', es:'Descripción' },
    cat:        { kr:'Kategori', fr:'Catégorie', en:'Category', es:'Categoría' },
    phone:      { kr:'Telefòn', fr:'Téléphone', en:'Phone', es:'Teléfono' },
    email:      { kr:'Imel', fr:'E-mail', en:'Email', es:'Correo' },
    addr:       { kr:'Adrès', fr:'Adresse', en:'Address', es:'Dirección' },
    city:       { kr:'Vil', fr:'Ville', en:'City', es:'Ciudad' },
    saveProfile:{ kr:'Anrejistre pwofil la', fr:'Enregistrer le profil', en:'Save profile', es:'Guardar perfil' },
    hours:      { kr:'Lè Ouvèti', fr:'Heures d\'ouverture', en:'Business hours', es:'Horario' },
    saveHours:  { kr:'Anrejistre lè yo', fr:'Enregistrer les heures', en:'Save hours', es:'Guardar horario' },
    closedLbl:  { kr:'Fèmen', fr:'Fermé', en:'Closed', es:'Cerrado' },
    delivery:   { kr:'Livrezon', fr:'Livraison', en:'Delivery', es:'Entrega' },
    doDelivery: { kr:'Mwen fè livrezon', fr:'Je fais la livraison', en:'I offer delivery', es:'Ofrezco entrega' },
    doPickup:   { kr:'Kliyan ka vin chèche', fr:'Retrait sur place', en:'Customer pickup', es:'Recogida' },
    fee:        { kr:'Frè livrezon (HTG)', fr:'Frais de livraison (HTG)', en:'Delivery fee (HTG)', es:'Costo de entrega (HTG)' },
    feeHint:    { kr:'Kite 0 pou sèvi ak pri MsouWout la (dapre distans).', fr:'Laissez 0 pour utiliser le tarif MsouWout (selon la distance).', en:'Leave 0 to use the MsouWout distance price.', es:'Deja 0 para usar el precio por distancia.' },
    freeMin:    { kr:'Livrezon gratis apati (HTG)', fr:'Livraison gratuite dès (HTG)', en:'Free delivery from (HTG)', es:'Envío gratis desde (HTG)' },
    prep:       { kr:'Tan preparasyon (min)', fr:'Temps de préparation (min)', en:'Prep time (min)', es:'Tiempo de prep. (min)' },
    saveDeliv:  { kr:'Anrejistre livrezon', fr:'Enregistrer la livraison', en:'Save delivery', es:'Guardar entrega' },
    link:       { kr:'Lyen Boutik Ou', fr:'Lien de votre boutique', en:'Your store link', es:'Enlace de tu tienda' },
    copy:       { kr:'Kopye lyen an', fr:'Copier le lien', en:'Copy link', es:'Copiar enlace' },
    copied:     { kr:'Lyen kopye !', fr:'Lien copié !', en:'Link copied!', es:'¡Enlace copiado!' },
    open:       { kr:'Louvri', fr:'Ouvrir', en:'Open', es:'Abrir' },
    tooBig:     { kr:'Imaj la twò gwo. Eseye yon lòt.', fr:"L'image est trop lourde. Essayez-en une autre.", en:'That image is too heavy. Try another.', es:'La imagen es muy pesada.' },
    saving:     { kr:'Ap anrejistre...', fr:'Enregistrement...', en:'Saving...', es:'Guardando...' }
  };
  function L_(k) { var e = L[k]; return e ? (e[MP.lang()] || e.en) : k; }

  var DAYS = [
    ['monday',    { kr:'Len', fr:'Lun', en:'Mon', es:'Lun' }],
    ['tuesday',   { kr:'Mad', fr:'Mar', en:'Tue', es:'Mar' }],
    ['wednesday', { kr:'Mèk', fr:'Mer', en:'Wed', es:'Mié' }],
    ['thursday',  { kr:'Jed', fr:'Jeu', en:'Thu', es:'Jue' }],
    ['friday',    { kr:'Van', fr:'Ven', en:'Fri', es:'Vie' }],
    ['saturday',  { kr:'Sam', fr:'Sam', en:'Sat', es:'Sáb' }],
    ['sunday',    { kr:'Dim', fr:'Dim', en:'Sun', es:'Dom' }]
  ];
  var CATS = [
    ['restaurant',  { kr:'Restoran', fr:'Restaurant', en:'Restaurant', es:'Restaurante' }],
    ['supermarket', { kr:'Makèt', fr:'Supermarché', en:'Supermarket', es:'Supermercado' }],
    ['pharmacy',    { kr:'Famasi', fr:'Pharmacie', en:'Pharmacy', es:'Farmacia' }],
    ['hardware',    { kr:'Kenkayri', fr:'Quincaillerie', en:'Hardware', es:'Ferretería' }],
    ['wholesale',   { kr:'Gwosis', fr:'Gros', en:'Wholesale', es:'Mayorista' }],
    ['retail',      { kr:'Detay / Boutik', fr:'Détail / Boutique', en:'Retail / Shop', es:'Tienda' }],
    ['bakery',      { kr:'Boulanjri', fr:'Boulangerie', en:'Bakery', es:'Panadería' }],
    ['other',       { kr:'Lòt', fr:'Autre', en:'Other', es:'Otro' }]
  ];

  function langBar() {
    var bar = document.getElementById('mpLangBar');
    bar.innerHTML = ['kr', 'fr', 'en', 'es'].map(function (l) {
      var flag = { kr: '🇭🇹', fr: '🇫🇷', en: '🇬🇧', es: '🇪🇸' }[l];
      return '<button class="mp-lang' + (MP.lang() === l ? ' active' : '') + '" data-l="' + l + '">' + flag + '</button>';
    }).join('');
    bar.querySelectorAll('[data-l]').forEach(function (b) {
      b.addEventListener('click', function () {
        localStorage.setItem('pp_lang', b.dataset.l);
        location.reload();
      });
    });
  }

  var pendingLogo = null; // data URL awaiting save

  function render(s) {
    document.getElementById('pgTitle').textContent = L_('title');
    var open = s.status === 'active';
    var d = s.deliveryOptions || {};
    var h = s.openingHours || {};
    var storeUrl = 'https://myplopplop.com/store.html?id=' + s._id;

    document.getElementById('mpBody').innerHTML =
      '<div class="mp-toggle-row' + (open ? '' : ' off') + '" id="acceptRow">' +
        '<div><div class="mp-toggle-label" id="acceptLabel">' + (open ? L_('accepting') : L_('closedT')) + '</div>' +
        '<div class="mp-toggle-sub" id="acceptSub">' + (open ? L_('acceptSub') : L_('closedSub')) + '</div></div>' +
        '<button class="mp-toggle' + (open ? ' active' : '') + '" id="acceptToggle" aria-label="open/closed"></button>' +
      '</div>' +

      '<div class="mp-card">' +
        '<div class="mp-card-title">' + MP.svg('<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>') + L_('identity') + '</div>' +

        '<div class="mp-field"><label>' + L_('logo') + '</label>' +
          '<div class="mp-logo-row">' +
            '<div class="mp-logo-preview' + (s.logo ? ' has' : '') + '" id="logoPrev">' +
              (s.logo ? '<img src="' + s.logo + '" alt="logo">' : '🏪') + '</div>' +
            '<div style="display:flex;flex-direction:column;gap:8px;">' +
              '<button class="mp-btn mp-btn-blue mp-btn-sm" id="logoPick">' + L_('choose') + '</button>' +
              '<button class="mp-btn mp-btn-ghost mp-btn-sm" id="logoClear">' + L_('remove') + '</button>' +
            '</div>' +
            '<input type="file" accept="image/*" class="mp-file" id="logoFile">' +
          '</div>' +
          '<div class="mp-hint">' + L_('logoHint') + '</div>' +
        '</div>' +

        '<div class="mp-field"><label>' + L_('name') + '</label>' +
          '<input class="mp-input" id="fName" maxlength="100" value="' + MP.esc(s.name) + '"></div>' +
        '<div class="mp-field"><label>' + L_('desc') + '</label>' +
          '<textarea class="mp-textarea" id="fDesc" maxlength="500">' + MP.esc(s.description || '') + '</textarea></div>' +
        '<div class="mp-field"><label>' + L_('cat') + '</label>' +
          '<select class="mp-select" id="fCat">' + CATS.map(function (c) {
            return '<option value="' + c[0] + '"' + (s.category === c[0] ? ' selected' : '') + '>' + (c[1][MP.lang()] || c[1].en) + '</option>';
          }).join('') + '</select></div>' +
        '<div class="mp-grid-2">' +
          '<div class="mp-field"><label>' + L_('phone') + '</label><input class="mp-input" id="fPhone" value="' + MP.esc(s.phone || '') + '"></div>' +
          '<div class="mp-field"><label>' + L_('email') + '</label><input class="mp-input" id="fEmail" value="' + MP.esc(s.email || '') + '"></div>' +
        '</div>' +
        '<div class="mp-grid-2">' +
          '<div class="mp-field"><label>' + L_('addr') + '</label><input class="mp-input" id="fStreet" value="' + MP.esc((s.address && s.address.street) || '') + '"></div>' +
          '<div class="mp-field"><label>' + L_('city') + '</label><input class="mp-input" id="fCity" value="' + MP.esc((s.address && s.address.city) || '') + '"></div>' +
        '</div>' +
        '<button class="mp-btn mp-btn-red mp-btn-block" id="saveProfile">' + L_('saveProfile') + '</button>' +
      '</div>' +

      '<div class="mp-card">' +
        '<div class="mp-card-title">' + MP.svg('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>') + L_('hours') + '</div>' +
        DAYS.map(function (dd) {
          var key = dd[0], row = h[key] || {};
          return '<div class="mp-hours-row"><span class="mp-hours-day">' + (dd[1][MP.lang()] || dd[1].en) + '</span>' +
            '<div class="mp-hours-inputs">' +
              '<input type="time" class="mp-hours-input" data-h="' + key + '-open" value="' + (row.open || '08:00') + '"' + (row.closed ? ' disabled' : '') + '>' +
              '<span style="color:var(--gray-400);">–</span>' +
              '<input type="time" class="mp-hours-input" data-h="' + key + '-close" value="' + (row.close || '18:00') + '"' + (row.closed ? ' disabled' : '') + '>' +
              '<label class="mp-hours-closed"><input type="checkbox" data-h="' + key + '-closed"' + (row.closed ? ' checked' : '') + '> ' + L_('closedLbl') + '</label>' +
            '</div></div>';
        }).join('') +
        '<button class="mp-btn mp-btn-red mp-btn-block" style="margin-top:var(--space-md);" id="saveHours">' + L_('saveHours') + '</button>' +
      '</div>' +

      '<div class="mp-card">' +
        '<div class="mp-card-title">' + MP.svg('<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>') + L_('delivery') + '</div>' +
        '<label class="mp-hours-closed" style="margin-bottom:10px;"><input type="checkbox" id="dDelivery"' + (d.delivery !== false ? ' checked' : '') + '> ' + L_('doDelivery') + '</label><br>' +
        '<label class="mp-hours-closed" style="margin-bottom:var(--space-md);"><input type="checkbox" id="dPickup"' + (d.selfPickup !== false ? ' checked' : '') + '> ' + L_('doPickup') + '</label>' +
        '<div class="mp-grid-2">' +
          '<div class="mp-field"><label>' + L_('fee') + '</label><input class="mp-input" type="number" min="0" id="dFee" value="' + (d.deliveryFee || 0) + '"></div>' +
          '<div class="mp-field"><label>' + L_('freeMin') + '</label><input class="mp-input" type="number" min="0" id="dFree" value="' + (d.freeDeliveryMin || 0) + '"></div>' +
        '</div>' +
        '<div class="mp-field"><label>' + L_('prep') + '</label><input class="mp-input" type="number" min="0" id="dPrep" value="' + (d.estimatedDeliveryMins || 45) + '"></div>' +
        '<div class="mp-hint" style="margin-bottom:var(--space-md);">' + L_('feeHint') + '</div>' +
        '<button class="mp-btn mp-btn-red mp-btn-block" id="saveDeliv">' + L_('saveDeliv') + '</button>' +
      '</div>' +

      '<div class="mp-card">' +
        '<div class="mp-card-title">' + MP.svg('<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>') + L_('link') + '</div>' +
        '<input class="mp-input" id="storeUrl" readonly value="' + storeUrl + '" style="margin-bottom:var(--space-sm);">' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
          '<button class="mp-btn mp-btn-blue mp-btn-sm" id="copyLink">' + L_('copy') + '</button>' +
          '<a class="mp-btn mp-btn-ghost mp-btn-sm" href="' + storeUrl + '" target="_blank" rel="noopener">' + L_('open') + '</a>' +
        '</div>' +
      '</div>';

    wire(s);
  }

  function wire(s) {
    /* open / closed */
    document.getElementById('acceptToggle').addEventListener('click', function () {
      var btn = this;
      var nowOpen = !btn.classList.contains('active');
      btn.disabled = true;
      MP.saveStore({ status: nowOpen ? 'active' : 'closed' }).then(function (st) {
        btn.disabled = false;
        btn.classList.toggle('active', st.status === 'active');
        var row = document.getElementById('acceptRow');
        row.classList.toggle('off', st.status !== 'active');
        document.getElementById('acceptLabel').textContent = st.status === 'active' ? L_('accepting') : L_('closedT');
        document.getElementById('acceptSub').textContent = st.status === 'active' ? L_('acceptSub') : L_('closedSub');
        MP.renderStoreHeader();
        MP.toast(MP.t('saved'), 'success');
      }).catch(function (e) {
        btn.disabled = false;
        MP.toast(MP.t('saveFail'), 'error');
      });
    });

    /* logo */
    var file = document.getElementById('logoFile');
    document.getElementById('logoPick').addEventListener('click', function () { file.click(); });
    file.addEventListener('change', function () {
      var f = file.files && file.files[0];
      if (!f) return;
      MP.compressImage(f, 600, 220000).then(function (dataUrl) {
        pendingLogo = dataUrl;
        var prev = document.getElementById('logoPrev');
        prev.className = 'mp-logo-preview has';
        prev.innerHTML = '<img src="' + dataUrl + '" alt="logo">';
        saveLogo();
      }).catch(function () { MP.toast(L_('tooBig'), 'error'); });
    });
    document.getElementById('logoClear').addEventListener('click', function () {
      pendingLogo = '';
      var prev = document.getElementById('logoPrev');
      prev.className = 'mp-logo-preview';
      prev.innerHTML = '🏪';
      saveLogo();
    });

    function saveLogo() {
      MP.toast(L_('saving'));
      MP.saveStore({ logo: pendingLogo }).then(function () {
        MP.renderStoreHeader();
        MP.toast(MP.t('saved'), 'success');
      }).catch(function (e) {
        MP.toast(e && e.message === 'too_large' ? L_('tooBig') : MP.t('saveFail'), 'error');
      });
    }

    /* profile */
    document.getElementById('saveProfile').addEventListener('click', function () {
      var btn = this, old = btn.textContent;
      var name = document.getElementById('fName').value.trim();
      if (!name) { MP.toast(L_('name'), 'error'); return; }
      btn.disabled = true; btn.textContent = L_('saving');
      MP.saveStore({
        name: name,
        description: document.getElementById('fDesc').value.trim(),
        category: document.getElementById('fCat').value,
        phone: document.getElementById('fPhone').value.trim(),
        email: document.getElementById('fEmail').value.trim(),
        address: Object.assign({}, s.address, {
          street: document.getElementById('fStreet').value.trim(),
          city: document.getElementById('fCity').value.trim()
        })
      }).then(function () {
        btn.disabled = false; btn.textContent = old;
        MP.renderStoreHeader();
        MP.toast(MP.t('saved'), 'success');
      }).catch(function () {
        btn.disabled = false; btn.textContent = old;
        MP.toast(MP.t('saveFail'), 'error');
      });
    });

    /* hours */
    document.querySelectorAll('[data-h$="-closed"]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var day = cb.dataset.h.replace('-closed', '');
        ['open', 'close'].forEach(function (k) {
          var i = document.querySelector('[data-h="' + day + '-' + k + '"]');
          if (i) i.disabled = cb.checked;
        });
      });
    });
    document.getElementById('saveHours').addEventListener('click', function () {
      var btn = this, old = btn.textContent;
      var hours = {};
      DAYS.forEach(function (dd) {
        var k = dd[0];
        hours[k] = {
          open: document.querySelector('[data-h="' + k + '-open"]').value || '08:00',
          close: document.querySelector('[data-h="' + k + '-close"]').value || '18:00',
          closed: document.querySelector('[data-h="' + k + '-closed"]').checked
        };
      });
      btn.disabled = true; btn.textContent = L_('saving');
      MP.saveStore({ openingHours: hours }).then(function () {
        btn.disabled = false; btn.textContent = old;
        MP.toast(MP.t('saved'), 'success');
      }).catch(function () {
        btn.disabled = false; btn.textContent = old;
        MP.toast(MP.t('saveFail'), 'error');
      });
    });

    /* delivery */
    document.getElementById('saveDeliv').addEventListener('click', function () {
      var btn = this, old = btn.textContent;
      btn.disabled = true; btn.textContent = L_('saving');
      MP.saveStore({
        deliveryOptions: {
          delivery: document.getElementById('dDelivery').checked,
          selfPickup: document.getElementById('dPickup').checked,
          deliveryFee: parseInt(document.getElementById('dFee').value, 10) || 0,
          freeDeliveryMin: parseInt(document.getElementById('dFree').value, 10) || 0,
          estimatedDeliveryMins: parseInt(document.getElementById('dPrep').value, 10) || 45
        }
      }).then(function () {
        btn.disabled = false; btn.textContent = old;
        MP.toast(MP.t('saved'), 'success');
      }).catch(function () {
        btn.disabled = false; btn.textContent = old;
        MP.toast(MP.t('saveFail'), 'error');
      });
    });

    /* copy link */
    document.getElementById('copyLink').addEventListener('click', function () {
      var input = document.getElementById('storeUrl');
      input.select();
      input.setSelectionRange(0, 99999);
      var done = function () { MP.toast(L_('copied'), 'success'); };
      if (navigator.clipboard) navigator.clipboard.writeText(input.value).then(done, function () { document.execCommand('copy'); done(); });
      else { document.execCommand('copy'); done(); }
    });
  }

  langBar();
  MP.boot('settings', function (data) { render(data.store); });
})();
</script>
</body>
</html>
