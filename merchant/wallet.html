<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D21034">
<meta property="og:image" content="https://myplopplop.com/assets/og-myplopplop.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<title>Bous — MyPlopPlop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/merchant.css">
<style>
.mp-balance {
  background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
  color: var(--white); border-radius: var(--radius-lg); padding: var(--space-lg);
  margin-bottom: var(--space-md);
}
.mp-balance-label { font-size: var(--text-xs); opacity: .8; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.mp-balance-value { font-family: var(--font-heading); font-size: var(--text-3xl); font-weight: 800; margin: 4px 0 var(--space-md); }
.mp-balance-split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-sm); }
.mp-balance-cell { background: rgba(255,255,255,.14); border-radius: var(--radius-md); padding: 10px 12px; }
.mp-balance-cell .v { font-family: var(--font-heading); font-weight: 700; font-size: var(--text-base); }
.mp-balance-cell .l { font-size: 10px; opacity: .85; }
</style>
</head>
<body style="background:var(--bg-light);">

<div class="mp-topbar">
  <a class="mp-brand" href="../index.html">
    <img src="../assets/icon-192.png" alt="MyPlopPlop">
    <span>Merchant</span>
  </a>
  <div class="mp-top-actions" id="mpLangBar"></div>
</div>

<div class="mp-store-header" id="mpStoreHeader"></div>

<div class="mp-layout">
  <aside class="mp-sidebar" id="mpSidebar"></aside>
  <main class="mp-main">
    <h1 class="mp-page-title" id="pgTitle">Bous</h1>
    <div id="mpBody"></div>
  </main>
</div>

<nav class="mp-bottom-nav" id="mpBottomNav"></nav>

<script src="../js/merchant.js"></script>
<script>
(function () {
  var L = {
    title:     { kr:'Bous', fr:'Portefeuille', en:'Wallet', es:'Billetera' },
    available: { kr:'Disponib pou retire', fr:'Disponible au retrait', en:'Available to withdraw', es:'Disponible' },
    pending:   { kr:'Ap tann', fr:'En attente', en:'Pending', es:'Pendiente' },
    total:     { kr:'Total', fr:'Total', en:'Total', es:'Total' },
    pendOrd:   { kr:'kòmand ap tann', fr:'commandes en attente', en:'orders pending', es:'pedidos pendientes' },
    availOrd:  { kr:'kòmand disponib', fr:'commandes disponibles', en:'orders available', es:'pedidos disponibles' },
    withdraw:  { kr:'Mande peman', fr:'Demander un paiement', en:'Request payout', es:'Solicitar pago' },
    minNote:   { kr:'Minimòm 500 HTG. Peman rive nan 24–48 èdtan sou MonCash oswa NatCash.', fr:'Minimum 500 HTG. Paiement sous 24–48 h via MonCash ou NatCash.', en:'Minimum 500 HTG. Paid within 24–48h via MonCash or NatCash.', es:'Mínimo 500 HTG. Pago en 24–48 h.' },
    method:    { kr:'Metòd', fr:'Méthode', en:'Method', es:'Método' },
    amount:    { kr:'Montan (HTG)', fr:'Montant (HTG)', en:'Amount (HTG)', es:'Monto (HTG)' },
    history:   { kr:'Istwa peman yo', fr:'Historique des paiements', en:'Payout history', es:'Historial' },
    noHistory: { kr:'Pa gen peman ankò.', fr:'Aucun paiement pour le moment.', en:'No payouts yet.', es:'Sin pagos aún.' },
    how:       { kr:'Kijan lajan an mache', fr:"Comment l'argent arrive", en:'How the money works', es:'Cómo funciona el dinero' },
    howBody:   {
      kr:'Lè yon kòmand livre epi kliyan an peye, pati pa w la ale nan "Ap tann". Apre MyPlopPlop verifye kòmand la, li pase nan "Disponib" — epi ou ka mande peman w.',
      fr:'Quand une commande est livrée et payée, votre part passe en « En attente ». Après vérification par MyPlopPlop, elle devient « Disponible » et vous pouvez demander le paiement.',
      en:'When an order is delivered and paid, your share goes to "Pending". Once MyPlopPlop verifies it, it becomes "Available" and you can request a payout.',
      es:'Cuando un pedido se entrega y se paga, tu parte pasa a «Pendiente». Tras la verificación, pasa a «Disponible».'
    },
    sending:   { kr:'Ap voye...', fr:'Envoi...', en:'Sending...', es:'Enviando...' }
  };
  function L_(k) { var e = L[k]; return e ? (e[MP.lang()] || e.en) : k; }

  function langBar() {
    var bar = document.getElementById('mpLangBar');
    bar.innerHTML = ['kr', 'fr', 'en', 'es'].map(function (l) {
      var flag = { kr: '🇭🇹', fr: '🇫🇷', en: '🇬🇧', es: '🇪🇸' }[l];
      return '<button class="mp-lang' + (MP.lang() === l ? ' active' : '') + '" data-l="' + l + '">' + flag + '</button>';
    }).join('');
    bar.querySelectorAll('[data-l]').forEach(function (b) {
      b.addEventListener('click', function () { localStorage.setItem('pp_lang', b.dataset.l); location.reload(); });
    });
  }

  function load() {
    return MP.req('GET', '/api/payouts/wallet').then(function (d) {
      if (!d || !d.success) throw new Error((d && d.message) || 'failed');
      render(d.data);
    }).catch(function (e) {
      document.getElementById('mpBody').innerHTML =
        '<div class="mp-empty"><div class="mp-empty-icon">⚠️</div><p>' + MP.esc(String(e.message || e)) + '</p></div>';
    });
  }

  function render(w) {
    document.getElementById('pgTitle').textContent = L_('title');
    var avail = w.available_balance || 0;

    document.getElementById('mpBody').innerHTML =
      '<div class="mp-balance">' +
        '<div class="mp-balance-label">' + L_('available') + '</div>' +
        '<div class="mp-balance-value">' + MP.money(avail) + '</div>' +
        '<div class="mp-balance-split">' +
          '<div class="mp-balance-cell"><div class="v">' + MP.money(w.pending_balance || 0) + '</div>' +
            '<div class="l">' + L_('pending') + ' · ' + (w.pending_orders || 0) + ' ' + L_('pendOrd') + '</div></div>' +
          '<div class="mp-balance-cell"><div class="v">' + MP.money(w.balance || 0) + '</div>' +
            '<div class="l">' + L_('total') + '</div></div>' +
        '</div>' +
      '</div>' +

      '<div class="mp-card">' +
        '<div class="mp-card-title">' + MP.svg('<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>') + L_('withdraw') + '</div>' +
        '<div class="mp-grid-2">' +
          '<div class="mp-field"><label>' + L_('amount') + '</label>' +
            '<input class="mp-input" type="number" min="500" id="wAmount" value="' + (avail >= 500 ? Math.floor(avail) : '') + '"></div>' +
          '<div class="mp-field"><label>' + L_('method') + '</label>' +
            '<select class="mp-select" id="wMethod"><option value="moncash">MonCash</option><option value="natcash">NatCash</option></select></div>' +
        '</div>' +
        '<div class="mp-hint" style="margin-bottom:var(--space-md);">' + L_('minNote') + '</div>' +
        '<button class="mp-btn mp-btn-red mp-btn-block" id="wSend"' + (avail < 500 ? ' disabled' : '') + '>' + L_('withdraw') + '</button>' +
      '</div>' +

      '<div class="mp-card">' +
        '<div class="mp-card-title">' + MP.svg('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>') + L_('history') + '</div>' +
        ((w.recent_payouts && w.recent_payouts.length)
          ? w.recent_payouts.map(function (p) {
              return '<div class="mp-row"><div class="mp-row-thumb">💸</div>' +
                '<div class="mp-row-main"><div class="mp-row-name">' + MP.money(p.amount) + '</div>' +
                '<div class="mp-row-sub">' + MP.esc(p.method || '') + ' · ' + MP.when(p.createdAt) + '</div></div>' +
                '<span class="mp-status ' + MP.esc(p.status === 'completed' ? 'delivered' : 'pending') + '">' + MP.esc(p.status || '') + '</span></div>';
            }).join('')
          : '<div class="mp-empty" style="padding:var(--space-lg) 0;"><p>' + L_('noHistory') + '</p></div>') +
      '</div>' +

      '<div class="mp-card">' +
        '<div class="mp-card-title">' + MP.svg('<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>') + L_('how') + '</div>' +
        '<p style="font-size:var(--text-sm);color:var(--gray-600);line-height:1.6;">' + L_('howBody') + '</p>' +
      '</div>';

    var send = document.getElementById('wSend');
    if (send) send.addEventListener('click', function () {
      var btn = this, old = btn.textContent;
      var amount = parseInt(document.getElementById('wAmount').value, 10) || 0;
      btn.disabled = true; btn.textContent = L_('sending');
      MP.req('POST', '/api/payouts/request', {
        amount: amount,
        method: document.getElementById('wMethod').value
      }).then(function (d) {
        btn.textContent = old;
        if (!d || !d.success) { btn.disabled = false; MP.toast((d && d.message) || MP.t('saveFail'), 'error'); return; }
        MP.toast((d.data && d.data.message) || MP.t('saved'), 'success');
        load();
      }).catch(function () {
        btn.disabled = false; btn.textContent = old;
        MP.toast(MP.t('saveFail'), 'error');
      });
    });
  }

  langBar();
  MP.boot('wallet', function () { load(); });
})();
</script>
</body>
</html>
