<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D21034">
<meta property="og:image" content="https://myplopplop.com/assets/og-myplopplop.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<title>Kòb Mwen — MyPlopPlop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/rider.css">
</head>
<body style="background:var(--bg-light);">

<div class="rd-topbar">
  <a class="rd-brand" href="../index.html"><img src="../assets/icon-192.png" alt="MyPlopPlop"><span>Chofè</span></a>
  <div class="rd-langs" id="rdLangs"></div>
</div>

<div class="rd-driver" id="rdDriver"></div>

<main class="rd-main">
  <h1 class="rd-title" id="rdTitle">Kòb</h1>
  <div id="rdBody"></div>
</main>

<nav class="rider-bottom-nav" id="rdNav"></nav>

<script src="../js/rider.js"></script>
<script>
(function () {
  var L = {
    title:    { kr:'Kòb Mwen', fr:'Mes Revenus', en:'My Earnings', es:'Mis Ingresos' },
    today:    { kr:'Jodi a', fr:"Aujourd'hui", en:'Today', es:'Hoy' },
    week:     { kr:'Semèn sa a', fr:'Cette semaine', en:'This week', es:'Esta semana' },
    month:    { kr:'Mwa sa a', fr:'Ce mois', en:'This month', es:'Este mes' },
    all:      { kr:'Depi nan konmansman', fr:'Depuis le début', en:'All time', es:'Todo' },
    daily:    { kr:'Chak jou (7 dènye jou)', fr:'Par jour (7 derniers jours)', en:'Daily (last 7 days)', es:'Por día (7 días)' },
    trips:    { kr:'Kous', fr:'Courses', en:'Trips', es:'Viajes' },
    deliv:    { kr:'Livrezon', fr:'Livraisons', en:'Deliveries', es:'Entregas' },
    rating:   { kr:'Nòt', fr:'Note', en:'Rating', es:'Calificación' },
    lifetime: { kr:'Total depi nan konmansman', fr:'Total depuis le début', en:'Lifetime total', es:'Total histórico' },
    recent:   { kr:'Dènye peman yo', fr:'Derniers paiements', en:'Recent payments', es:'Pagos recientes' },
    none:     { kr:'Pa gen kòb ki antre pou peryòd sa a.', fr:'Aucun revenu sur cette période.', en:'No earnings in this period.', es:'Sin ingresos en este periodo.' },
    noneEver: { kr:'Ou poko fè okenn kous. Ale an liy pou w kòmanse!', fr:"Aucune course pour l'instant. Passez en ligne !", en:'No trips yet. Go online to start!', es:'Sin viajes aún.' },
    note:     { kr:'Chif sa yo soti dirèk nan kont ou — se pa egzanp.', fr:'Ces chiffres viennent de votre compte — ce ne sont pas des exemples.', en:'These figures come straight from your account — they are not samples.', es:'Cifras reales de tu cuenta.' }
  };
  function L_(k) { return RD.pick(L[k]) || k; }

  var DAYNAME = {
    kr: ['Dim','Len','Mad','Mèk','Jed','Van','Sam'],
    fr: ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'],
    en: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
    es: ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb']
  };

  var txs = [], period = 'week';

  function startOf(p) {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    if (p === 'today') return d;
    if (p === 'week')  { d.setDate(d.getDate() - 6); return d; }
    if (p === 'month') { d.setDate(d.getDate() - 29); return d; }
    return new Date(0);
  }

  function earningsIn(p) {
    var from = startOf(p);
    return txs.filter(function (t) {
      return t.type === 'earning' && new Date(t.createdAt) >= from;
    });
  }

  function render(stats) {
    document.getElementById('rdTitle').textContent = L_('title');
    var sel = earningsIn(period);
    var total = sel.reduce(function (a, t) { return a + (Number(t.amount) || 0); }, 0);

    // last 7 days, bucketed from the real transaction list
    var days = [];
    for (var i = 6; i >= 0; i--) {
      var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
      var next = new Date(d); next.setDate(next.getDate() + 1);
      var sum = txs.filter(function (t) {
        var td = new Date(t.createdAt);
        return t.type === 'earning' && td >= d && td < next;
      }).reduce(function (a, t) { return a + (Number(t.amount) || 0); }, 0);
      days.push({ label: DAYNAME[RD.lang()][d.getDay()], sum: sum, today: i === 0 });
    }
    var peak = Math.max.apply(null, days.map(function (x) { return x.sum; }).concat([1]));

    var periodLabel = { today: L_('today'), week: L_('week'), month: L_('month'), all: L_('all') }[period];

    var html =
      '<div class="rd-hero">' +
        '<div class="period">' + periodLabel + '</div>' +
        '<div class="amount">' + RD.money(total) + '</div>' +
        '<div class="sub">' + sel.length + ' ' + L_('deliv').toLowerCase() + '</div>' +
      '</div>' +

      '<div class="rd-tabs">' +
        ['today', 'week', 'month', 'all'].map(function (p) {
          return '<button class="rd-tab' + (p === period ? ' active' : '') + '" data-p="' + p + '">' +
                 ({ today: L_('today'), week: L_('week'), month: L_('month'), all: L_('all') })[p] + '</button>';
        }).join('') +
      '</div>' +

      '<div class="rd-stats">' +
        '<div class="rd-stat"><div class="v">' + (stats.totalRides || 0) + '</div><div class="l">' + L_('trips') + '</div></div>' +
        '<div class="rd-stat"><div class="v">' + (stats.totalDeliveries || 0) + '</div><div class="l">' + L_('deliv') + '</div></div>' +
        '<div class="rd-stat"><div class="v">' + (Number(stats.rating) || 0).toFixed(1) + '</div><div class="l">' + L_('rating') + '</div></div>' +
        '<div class="rd-stat"><div class="v">' + RD.shortMoney(stats.totalEarnings || 0) + '</div><div class="l">' + L_('lifetime') + '</div></div>' +
      '</div>' +

      '<div class="rd-card"><h4>' + L_('daily') + '</h4>' +
        (peak <= 1
          ? '<div class="rd-empty" style="padding:var(--space-lg) 0;"><p style="margin:0;">' + L_('none') + '</p></div>'
          : '<div class="rd-bars">' + days.map(function (d) {
          var h = Math.max(3, Math.round(d.sum / peak * 100));
          return '<div class="rd-bar-wrap">' +
                 '<div class="rd-bar' + (d.today ? ' today' : '') + '" style="height:' + h + '%;">' +
                 (d.sum ? '<span class="val">' + RD.shortMoney(d.sum) + '</span>' : '') + '</div>' +
                 '<span class="rd-bar-label">' + d.label + '</span></div>';
        }).join('') + '</div>') +
      '</div>' +

      '<div class="rd-card"><h4>' + L_('recent') + '</h4>' +
        (sel.length
          ? sel.slice(0, 12).map(function (t) {
              return '<div class="rd-row"><div class="rd-row-icon">💰</div>' +
                '<div class="rd-row-main"><div class="rd-row-name">' + RD.esc(t.description || 'Kous') + '</div>' +
                '<div class="rd-row-sub">' + RD.when(t.createdAt) + '</div></div>' +
                '<div class="rd-amount pos">+' + RD.money(t.amount) + '</div></div>';
            }).join('')
          : '<div class="rd-empty"><div class="ico">🛵</div><p>' +
            (txs.length ? L_('none') : L_('noneEver')) + '</p></div>') +
      '</div>' +

      '<p style="font-size:var(--text-xs);color:var(--text-muted);text-align:center;">' + L_('note') + '</p>';

    document.getElementById('rdBody').innerHTML = html;
    document.querySelectorAll('[data-p]').forEach(function (b) {
      b.addEventListener('click', function () { period = b.dataset.p; render(stats); });
    });
  }

  RD.boot('earnings', function (stats) {
    RD.req('GET', '/api/payments/history').then(function (d) {
      txs = (d && d.success && d.transactions) ? d.transactions : [];
      render(stats);
    }).catch(function () { txs = []; render(stats); });
  });
})();
</script>
</body>
</html>
