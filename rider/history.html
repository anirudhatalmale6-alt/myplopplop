<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D21034">
<meta property="og:image" content="https://myplopplop.com/assets/og-myplopplop.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<title>Kous Mwen — MyPlopPlop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/rider.css">
<style>
.rd-ride { background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-lg); padding:var(--space-md); margin-bottom:var(--space-sm); }
.rd-ride-top { display:flex; justify-content:space-between; align-items:flex-start; gap:var(--space-sm); }
.rd-leg { display:flex; gap:9px; margin-top:var(--space-sm); font-size:var(--text-xs); color:var(--gray-600); }
.rd-leg .pins { display:flex; flex-direction:column; align-items:center; padding-top:4px; }
.rd-leg .pin { width:8px; height:8px; border-radius:50%; background:var(--success); flex-shrink:0; }
.rd-leg .pin.end { background:var(--primary-red); }
.rd-leg .line { width:2px; flex:1; min-height:16px; background:var(--gray-200); }
.rd-leg .addrs { flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; }
.rd-leg .addrs div { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rd-pill { display:inline-block; padding:3px 9px; border-radius:var(--radius-full); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; }
.rd-pill.completed,.rd-pill.delivered { background:var(--success-light); color:#065F46; }
.rd-pill.cancelled { background:var(--error-light); color:#991B1B; }
.rd-pill.in_progress,.rd-pill.accepted,.rd-pill.picking_up,.rd-pill.searching { background:var(--info-light); color:var(--primary-blue); }
</style>
</head>
<body style="background:var(--bg-light);">

<div class="rd-topbar">
  <a class="rd-brand" href="../index.html"><img src="../assets/icon-192.png" alt="MyPlopPlop"><span>Chofè</span></a>
  <div class="rd-langs" id="rdLangs"></div>
</div>

<div class="rd-driver" id="rdDriver"></div>

<main class="rd-main">
  <h1 class="rd-title" id="rdTitle">Kous</h1>
  <div id="rdBody"></div>
</main>

<nav class="rider-bottom-nav" id="rdNav"></nav>

<script src="../js/rider.js"></script>
<script>
(function () {
  var L = {
    title:  { kr:'Kous Mwen', fr:'Mes Courses', en:'My Trips', es:'Mis Viajes' },
    all:    { kr:'Tout', fr:'Toutes', en:'All', es:'Todos' },
    done:   { kr:'Fini', fr:'Terminées', en:'Completed', es:'Completados' },
    active: { kr:'An kou', fr:'En cours', en:'Active', es:'En curso' },
    canc:   { kr:'Anile', fr:'Annulées', en:'Cancelled', es:'Cancelados' },
    none:   { kr:'Pa gen kous isit la.', fr:'Aucune course ici.', en:'No trips here.', es:'Sin viajes aquí.' },
    noneEver:{ kr:'Ou poko fè okenn kous. Ale an liy sou paj Akèy la.', fr:"Aucune course pour l'instant. Passez en ligne depuis l'accueil.", en:'No trips yet. Go online from the Home screen.', es:'Sin viajes aún.' },
    refresh:{ kr:'Aktyalize', fr:'Actualiser', en:'Refresh', es:'Actualizar' },
    earned: { kr:'Ou fè', fr:'Gagné', en:'You earned', es:'Ganaste' },
    total:  { kr:'kous', fr:'courses', en:'trips', es:'viajes' }
  };
  function L_(k) { return RD.pick(L[k]) || k; }

  var rides = [], tab = 'all';
  var TABS = [
    ['all', 'all', null],
    ['done', 'done', ['completed', 'delivered']],
    ['active', 'active', ['searching', 'accepted', 'picking_up', 'in_progress', 'delivering']],
    ['canc', 'canc', ['cancelled']]
  ];

  function addr(x) {
    if (!x) return '—';
    if (typeof x === 'string') return x;
    return x.address || x.name || (x.lat != null ? (Number(x.lat).toFixed(4) + ', ' + Number(x.lng).toFixed(4)) : '—');
  }

  function render() {
    document.getElementById('rdTitle').textContent = L_('title');
    var def = TABS.filter(function (t) { return t[0] === tab; })[0];
    var list = def[2] ? rides.filter(function (r) { return def[2].indexOf(r.status) !== -1; }) : rides;

    var html = '<div class="rd-tabs">' + TABS.map(function (t) {
      var n = t[2] ? rides.filter(function (r) { return t[2].indexOf(r.status) !== -1; }).length : rides.length;
      return '<button class="rd-tab' + (t[0] === tab ? ' active' : '') + '" data-t="' + t[0] + '">' +
             L_(t[1]) + ' (' + n + ')</button>';
    }).join('') + '</div>';

    if (!list.length) {
      html += '<div class="rd-empty"><div class="ico">🛵</div><p>' +
              (rides.length ? L_('none') : L_('noneEver')) + '</p>' +
              '<button class="rd-btn rd-btn-ghost" id="rdRefresh">' + L_('refresh') + '</button></div>';
    } else {
      html += list.map(function (r) {
        var pay = r.driverEarning != null ? r.driverEarning : (r.price != null ? r.price : r.fare);
        return '<div class="rd-ride">' +
          '<div class="rd-ride-top">' +
            '<div style="min-width:0;">' +
              '<div class="rd-row-name">' + RD.esc((r.customer && r.customer.name) || r.customerName || '—') + '</div>' +
              '<div class="rd-row-sub">' + RD.when(r.createdAt) +
                (r.distanceKm ? ' · ' + Number(r.distanceKm).toFixed(1) + ' km' : '') +
                (r.type ? ' · ' + RD.esc(r.type) : '') + '</div>' +
            '</div>' +
            '<div style="text-align:right;flex-shrink:0;">' +
              '<div class="rd-amount pos">' + RD.money(pay) + '</div>' +
              '<span class="rd-pill ' + RD.esc(r.status) + '">' + RD.esc(r.status) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="rd-leg"><div class="pins"><span class="pin"></span><span class="line"></span><span class="pin end"></span></div>' +
            '<div class="addrs"><div>' + RD.esc(addr(r.pickup)) + '</div><div>' + RD.esc(addr(r.dropoff)) + '</div></div>' +
          '</div>' +
        '</div>';
      }).join('');
      var earned = list.reduce(function (a, r) {
        return a + (Number(r.driverEarning != null ? r.driverEarning : r.price) || 0);
      }, 0);
      html += '<div class="rd-card" style="text-align:center;">' +
        '<div class="rd-row-sub">' + L_('earned') + ' · ' + list.length + ' ' + L_('total') + '</div>' +
        '<div style="font-family:var(--font-heading);font-size:var(--text-xl);font-weight:800;color:var(--success);">' +
        RD.money(earned) + '</div></div>' +
        '<button class="rd-btn rd-btn-ghost" id="rdRefresh">' + L_('refresh') + '</button>';
    }

    document.getElementById('rdBody').innerHTML = html;
    document.querySelectorAll('[data-t]').forEach(function (b) {
      b.addEventListener('click', function () { tab = b.dataset.t; render(); });
    });
    var rf = document.getElementById('rdRefresh');
    if (rf) rf.addEventListener('click', function () { rf.disabled = true; load(); });
  }

  function load() {
    return RD.req('GET', '/api/rides?page=1&limit=50').then(function (d) {
      rides = (d && d.rides) ? d.rides : [];
      render();
    }).catch(function () { rides = []; render(); });
  }

  RD.boot('history', function () { load(); });
})();
</script>
</body>
</html>
