<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D21034">
<meta property="og:image" content="https://myplopplop.com/assets/og-myplopplop.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<title>Pwofil Chofè — MyPlopPlop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/rider.css">
<style>
.rd-status { display:flex; align-items:center; justify-content:space-between; gap:var(--space-md);
  padding:var(--space-md); border-radius:var(--radius-lg); margin-bottom:var(--space-md); background:var(--success-light); }
.rd-status.off { background:var(--gray-100); }
.rd-status .lbl { font-weight:700; font-size:var(--text-sm); color:var(--text-dark); }
.rd-status .sub { font-size:var(--text-xs); color:var(--text-muted); margin-top:2px; }
.rd-switch { width:50px; height:28px; border-radius:var(--radius-full); border:none; cursor:pointer;
  background:var(--gray-300); position:relative; flex-shrink:0; transition:background var(--transition-normal); }
.rd-switch::after { content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
  background:var(--white); transition:transform var(--transition-normal); box-shadow:var(--shadow-sm); }
.rd-switch.on { background:var(--success); }
.rd-switch.on::after { transform:translateX(22px); }
.rd-kv { display:flex; justify-content:space-between; gap:var(--space-md); padding:10px 0; border-bottom:1px solid var(--gray-100); font-size:var(--text-sm); }
.rd-kv:last-child { border-bottom:none; }
.rd-kv .k { color:var(--text-muted); }
.rd-kv .v { font-weight:600; color:var(--text-dark); text-align:right; word-break:break-word; }
.rd-badge { display:inline-block; padding:3px 10px; border-radius:var(--radius-full); font-size:10px; font-weight:700; text-transform:uppercase; }
.rd-badge.approved { background:var(--success-light); color:#065F46; }
.rd-badge.pending { background:var(--warning-light); color:#92400E; }
.rd-badge.rejected,.rd-badge.suspended { background:var(--error-light); color:#991B1B; }
</style>
</head>
<body style="background:var(--bg-light);">

<div class="rd-topbar">
  <a class="rd-brand" href="../index.html"><img src="../assets/icon-192.png" alt="MyPlopPlop"><span>Chofè</span></a>
  <div class="rd-langs" id="rdLangs"></div>
</div>

<div class="rd-driver" id="rdDriver"></div>

<main class="rd-main">
  <h1 class="rd-title" id="rdTitle">Pwofil</h1>
  <div id="rdBody"></div>
</main>

<nav class="rider-bottom-nav" id="rdNav"></nav>

<script src="../js/rider.js"></script>
<script>
(function () {
  var L = {
    title:   { kr:'Pwofil Mwen', fr:'Mon Profil', en:'My Profile', es:'Mi Perfil' },
    online:  { kr:'Mwen an liy', fr:'Je suis en ligne', en:"I'm online", es:'Estoy en línea' },
    onSub:   { kr:'W ap resevwa nouvo kous', fr:'Vous recevez de nouvelles courses', en:'You will receive new jobs', es:'Recibirás nuevos viajes' },
    offline: { kr:'Mwen dekonekte', fr:'Je suis hors ligne', en:"I'm offline", es:'Estoy desconectado' },
    offSub:  { kr:'Ou p ap resevwa kous', fr:'Vous ne recevez pas de courses', en:'You will not receive jobs', es:'No recibirás viajes' },
    me:      { kr:'Enfòmasyon mwen', fr:'Mes informations', en:'My information', es:'Mi información' },
    name:    { kr:'Non', fr:'Nom', en:'Name', es:'Nombre' },
    phone:   { kr:'Telefòn', fr:'Téléphone', en:'Phone', es:'Teléfono' },
    status:  { kr:'Estati kont lan', fr:'Statut du compte', en:'Account status', es:'Estado' },
    grade:   { kr:'Nivo', fr:'Niveau', en:'Grade', es:'Nivel' },
    vehicle: { kr:'Machin mwen', fr:'Mon véhicule', en:'My vehicle', es:'Mi vehículo' },
    vtype:   { kr:'Kalite', fr:'Type', en:'Type', es:'Tipo' },
    plate:   { kr:'Plak', fr:'Plaque', en:'Plate', es:'Placa' },
    model:   { kr:'Modèl', fr:'Modèle', en:'Model', es:'Modelo' },
    color:   { kr:'Koulè', fr:'Couleur', en:'Colour', es:'Color' },
    licence: { kr:'Nimewo lisans', fr:'Numéro de permis', en:'Licence number', es:'N.º de licencia' },
    services:{ kr:'Sèvis', fr:'Services', en:'Services', es:'Servicios' },
    perf:    { kr:'Pèfòmans', fr:'Performance', en:'Performance', es:'Rendimiento' },
    trips:   { kr:'Kous', fr:'Courses', en:'Trips', es:'Viajes' },
    deliv:   { kr:'Livrezon', fr:'Livraisons', en:'Deliveries', es:'Entregas' },
    rating:  { kr:'Nòt', fr:'Note', en:'Rating', es:'Calificación' },
    earned:  { kr:'Total', fr:'Total', en:'Total', es:'Total' },
    edit:    { kr:'Pou chanje enfòmasyon machin ou, kontakte sipò MyPlopPlop sou WhatsApp.', fr:'Pour modifier les informations du véhicule, contactez le support MyPlopPlop sur WhatsApp.', en:'To change your vehicle details, contact MyPlopPlop support on WhatsApp.', es:'Para cambiar los datos del vehículo, contacta con soporte por WhatsApp.' },
    support: { kr:'Kontakte sipò', fr:'Contacter le support', en:'Contact support', es:'Contactar soporte' },
    logout:  { kr:'Dekonekte', fr:'Se déconnecter', en:'Log out', es:'Cerrar sesión' },
    none:    { kr:'—', fr:'—', en:'—', es:'—' },
    sec:     { kr:'Kòd Sekrè W', fr:'Votre code secret', en:'Your PIN', es:'Tu PIN' },
    pinHint: { kr:'Chanje PIN ou lè w vle. Se ak li ou konekte.', fr:'Changez votre PIN quand vous voulez. C\'est avec lui que vous vous connectez.', en:'Change your PIN whenever you like. It is what you log in with.', es:'Cambia tu PIN cuando quieras. Es con lo que inicias sesión.' },
    curPin:  { kr:'PIN ou kounye a', fr:'PIN actuel', en:'Current PIN', es:'PIN actual' },
    newPin:  { kr:'Nouvo PIN (4 chif)', fr:'Nouveau PIN (4 chiffres)', en:'New PIN (4 digits)', es:'PIN nuevo (4 dígitos)' },
    repPin:  { kr:'Repete nouvo PIN an', fr:'Répétez le nouveau PIN', en:'Repeat the new PIN', es:'Repite el PIN nuevo' },
    doPin:   { kr:'Chanje PIN an', fr:'Changer le PIN', en:'Change PIN', es:'Cambiar PIN' },
    pinLen:  { kr:'PIN an dwe gen 4 chif', fr:'Le PIN doit avoir 4 chiffres', en:'The PIN must be 4 digits', es:'El PIN debe tener 4 dígitos' },
    pinNo:   { kr:'De nouvo PIN yo pa menm', fr:'Les deux nouveaux PIN sont différents', en:'The two new PINs are not the same', es:'Los dos PIN nuevos no son iguales' },
    pinBad:  { kr:'PIN ou kounye a pa bon', fr:'Votre PIN actuel est incorrect', en:'Your current PIN is not right', es:'Tu PIN actual no es correcto' },
    pinDone: { kr:'PIN ou chanje', fr:'Votre PIN est changé', en:'Your PIN is changed', es:'Tu PIN fue cambiado' }
  };
  function L_(k) { return RD.pick(L[k]) || k; }
  var WA = 'https://wa.me/50946859702';

  function kv(k, v) {
    return '<div class="rd-kv"><span class="k">' + k + '</span><span class="v">' + (v || L_('none')) + '</span></div>';
  }

  function render(stats, profile) {
    document.getElementById('rdTitle').textContent = L_('title');
    var u = RD.user() || {};
    var p = profile || {};
    var on = !!stats.isOnline;
    var st = p.status || stats.status || 'pending';

    document.getElementById('rdBody').innerHTML =
      '<div class="rd-status' + (on ? '' : ' off') + '" id="stRow">' +
        '<div><div class="lbl" id="stLbl">' + (on ? L_('online') : L_('offline')) + '</div>' +
        '<div class="sub" id="stSub">' + (on ? L_('onSub') : L_('offSub')) + '</div></div>' +
        '<button class="rd-switch' + (on ? ' on' : '') + '" id="stBtn" aria-label="online"></button>' +
      '</div>' +

      '<div class="rd-stats">' +
        '<div class="rd-stat"><div class="v">' + (stats.totalRides || 0) + '</div><div class="l">' + L_('trips') + '</div></div>' +
        '<div class="rd-stat"><div class="v">' + (stats.totalDeliveries || 0) + '</div><div class="l">' + L_('deliv') + '</div></div>' +
        '<div class="rd-stat"><div class="v">' + (Number(stats.rating) || 0).toFixed(1) + '</div><div class="l">' + L_('rating') + '</div></div>' +
        '<div class="rd-stat"><div class="v">' + RD.shortMoney(stats.totalEarnings || 0) + '</div><div class="l">' + L_('earned') + '</div></div>' +
      '</div>' +

      '<div class="rd-card"><h4>' + L_('me') + '</h4>' +
        kv(L_('name'), RD.esc(u.name || (p.user && p.user.name))) +
        kv(L_('phone'), RD.esc(u.phone || (p.user && p.user.phone))) +
        kv(L_('status'), '<span class="rd-badge ' + RD.esc(st) + '">' + RD.esc(st) + '</span>') +
        (RD.gradeName(stats) ? kv(L_('grade'), RD.esc(RD.gradeName(stats))) : '') +
      '</div>' +

      '<div class="rd-card"><h4>' + L_('vehicle') + '</h4>' +
        kv(L_('vtype'), RD.esc(p.vehicleType)) +
        kv(L_('plate'), RD.esc(p.vehiclePlate)) +
        kv(L_('model'), RD.esc(p.vehicleModel)) +
        kv(L_('color'), RD.esc(p.vehicleColor)) +
        kv(L_('licence'), RD.esc(p.licenseNumber)) +
        kv(L_('services'), RD.esc((p.services || []).join(', '))) +
        '<p style="font-size:var(--text-xs);color:var(--text-muted);margin:var(--space-md) 0 var(--space-sm);">' + L_('edit') + '</p>' +
        '<a class="rd-btn rd-btn-ghost" href="' + WA + '?text=' +
          encodeURIComponent('Bonjou MyPlopPlop, mwen se ' + (u.name || '') + ' (chofè). Mwen bezwen chanje enfòmasyon machin mwen.') +
          '" target="_blank" rel="noopener">' + L_('support') + '</a>' +
      '</div>' +

      /* The driver owns their own PIN — no need to ask anyone to change it. */
      '<div class="rd-card"><h4>' + L_('sec') + '</h4>' +
        '<p style="font-size:var(--text-xs);color:var(--text-muted);margin:0 0 var(--space-md);">' + L_('pinHint') + '</p>' +
        '<div class="rd-field"><label>' + L_('curPin') + '</label>' +
          '<input class="rd-input" id="pCur" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></div>' +
        '<div class="rd-field"><label>' + L_('newPin') + '</label>' +
          '<input class="rd-input" id="pNew" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></div>' +
        '<div class="rd-field"><label>' + L_('repPin') + '</label>' +
          '<input class="rd-input" id="pRep" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></div>' +
        '<button class="rd-btn rd-btn-red" id="pSave">' + L_('doPin') + '</button>' +
      '</div>' +

      '<button class="rd-btn rd-btn-ghost" id="rdOut" style="color:var(--error);">' + L_('logout') + '</button>';

    document.getElementById('pSave').addEventListener('click', function () {
      var btn = this;
      var cur = document.getElementById('pCur').value.trim();
      var nu  = document.getElementById('pNew').value.trim();
      var rp  = document.getElementById('pRep').value.trim();
      if (!/^[0-9]{4}$/.test(nu)) { RD.toast(L_('pinLen'), 'error'); return; }
      if (nu !== rp) { RD.toast(L_('pinNo'), 'error'); return; }
      btn.disabled = true;
      RD.req('PUT', '/api/auth/change-pin', { currentPin: cur, newPin: nu }).then(function (d) {
        btn.disabled = false;
        if (d && d.success) {
          document.getElementById('pCur').value = '';
          document.getElementById('pNew').value = '';
          document.getElementById('pRep').value = '';
          RD.toast(L_('pinDone'), 'success');
        } else {
          RD.toast(d && d.code === 'WRONG_PIN' ? L_('pinBad') : (d && d.message) || RD.t('failed'), 'error');
        }
      }).catch(function () { btn.disabled = false; RD.toast(RD.t('failed'), 'error'); });
    });

    document.getElementById('stBtn').addEventListener('click', function () {
      var btn = this;
      var next = !btn.classList.contains('on');
      btn.disabled = true;
      RD.req('PUT', '/api/drivers/online', { isOnline: next }).then(function (d) {
        btn.disabled = false;
        if (!d || !d.success) { RD.toast(RD.t('failed'), 'error'); return; }
        btn.classList.toggle('on', d.isOnline);
        document.getElementById('stRow').classList.toggle('off', !d.isOnline);
        document.getElementById('stLbl').textContent = d.isOnline ? L_('online') : L_('offline');
        document.getElementById('stSub').textContent = d.isOnline ? L_('onSub') : L_('offSub');
        stats.isOnline = d.isOnline;
        RD.header(stats);
        RD.toast(RD.t('saved'), 'success');
      }).catch(function () { btn.disabled = false; RD.toast(RD.t('failed'), 'error'); });
    });
    document.getElementById('rdOut').addEventListener('click', RD.logout);
  }

  RD.boot('profile', function (stats) {
    RD.req('GET', '/api/drivers/profile').then(function (d) {
      render(stats, (d && d.profile) || null);
    }).catch(function () { render(stats, null); });
  });
})();
</script>
</body>
</html>
