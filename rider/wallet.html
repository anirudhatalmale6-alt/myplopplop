<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D21034">
<meta property="og:image" content="https://myplopplop.com/assets/og-myplopplop.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<title>Bous Chofè — MyPlopPlop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/rider.css">
<style>
.rd-bal { background:linear-gradient(135deg,var(--primary-blue),var(--primary-blue-dark)); color:var(--white);
  border-radius:var(--radius-xl); padding:var(--space-lg); margin-bottom:var(--space-md); }
.rd-bal .l { font-size:var(--text-xs); opacity:.85; font-weight:600; text-transform:uppercase; letter-spacing:.4px; }
.rd-bal .v { font-family:var(--font-heading); font-size:2.1rem; font-weight:800; margin:4px 0 var(--space-md); }
.rd-bal-split { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-sm); }
.rd-bal-cell { background:rgba(255,255,255,.14); border-radius:var(--radius-md); padding:10px 12px; }
.rd-bal-cell .cv { font-family:var(--font-heading); font-weight:700; font-size:var(--text-base); }
.rd-bal-cell .cl { font-size:10px; opacity:.85; }
</style>
</head>
<body style="background:var(--bg-light);">

<div class="rd-topbar">
  <a class="rd-brand" href="../index.html"><img src="../assets/icon-192.png" alt="MyPlopPlop"><span>Chofè</span></a>
  <div class="rd-langs" id="rdLangs"></div>
</div>

<div class="rd-driver" id="rdDriver"></div>

<main class="rd-main">
  <h1 class="rd-title" id="rdTitle">Bous</h1>
  <div id="rdBody"></div>
</main>

<nav class="rider-bottom-nav" id="rdNav"></nav>

<script src="../js/rider.js"></script>
<script>
(function () {
  var L = {
    title:    { kr:'Bous Mwen', fr:'Mon Portefeuille', en:'My Wallet', es:'Mi Billetera' },
    avail:    { kr:'Disponib pou retire', fr:'Disponible au retrait', en:'Available to withdraw', es:'Disponible' },
    lifetime: { kr:'Total ou fè', fr:'Total gagné', en:'Total earned', es:'Total ganado' },
    payments: { kr:'peman', fr:'paiements', en:'payments', es:'pagos' },
    ask:      { kr:'Mande Peman', fr:'Demander un paiement', en:'Request a payout', es:'Solicitar pago' },
    amount:   { kr:'Montan (HTG)', fr:'Montant (HTG)', en:'Amount (HTG)', es:'Monto (HTG)' },
    method:   { kr:'Metòd', fr:'Méthode', en:'Method', es:'Método' },
    number:   { kr:'Nimewo MonCash / NatCash', fr:'Numéro MonCash / NatCash', en:'MonCash / NatCash number', es:'Número MonCash / NatCash' },
    note:     { kr:'Minimòm 500 HTG. Nou trete demann yo nan 24–48 èdtan.', fr:'Minimum 500 HTG. Traité sous 24–48 h.', en:'Minimum 500 HTG. Processed within 24–48h.', es:'Mínimo 500 HTG. En 24–48 h.' },
    tooLow:   { kr:'Ou bezwen omwen 500 HTG pou mande yon peman.', fr:'Il faut au moins 500 HTG pour demander un paiement.', en:'You need at least 500 HTG to request a payout.', es:'Necesitas al menos 500 HTG.' },
    history:  { kr:'Demann peman yo', fr:'Demandes de paiement', en:'Payout requests', es:'Solicitudes de pago' },
    noHist:   { kr:'Ou poko mande okenn peman.', fr:'Aucune demande pour le moment.', en:'No payout requests yet.', es:'Sin solicitudes aún.' },
    how:      { kr:'Kijan sa mache', fr:'Comment ça marche', en:'How it works', es:'Cómo funciona' },
    howBody:  {
      kr:'Chak fwa ou fini yon livrezon epi kliyan an peye, pòsyon pa w la antre nan bous ou touswit. Lè w gen 500 HTG oswa plis, ou ka mande pou nou voye l ba ou sou MonCash oswa NatCash.',
      fr:'Dès qu’une livraison est terminée et payée, votre part arrive dans votre portefeuille. À partir de 500 HTG vous pouvez demander un virement MonCash ou NatCash.',
      en:'As soon as a delivery is finished and paid, your share lands in your wallet. From 500 HTG you can request a MonCash or NatCash transfer.',
      es:'Cuando una entrega se completa y se paga, tu parte llega a tu billetera. Desde 500 HTG puedes solicitar el pago.'
    },
    sending:  { kr:'Ap voye...', fr:'Envoi...', en:'Sending...', es:'Enviando...' },
    needNum:  { kr:'Mete nimewo w pou nou voye lajan an.', fr:'Indiquez le numéro à créditer.', en:'Enter the number to send the money to.', es:'Indica el número.' }
  };
  function L_(k) { return RD.pick(L[k]) || k; }

  function load() {
    return RD.req('GET', '/api/payouts/wallet').then(function (d) {
      if (!d || !d.success) throw new Error((d && d.message) || 'failed');
      render(d.data);
    }).catch(function (e) {
      document.getElementById('rdBody').innerHTML =
        '<div class="rd-empty"><div class="ico">⚠️</div><p>' + RD.esc(String(e.message || e)) + '</p>' +
        '<button class="rd-btn rd-btn-ghost" onclick="location.reload()">' + RD.t('retry') + '</button></div>';
    });
  }

  function render(w) {
    document.getElementById('rdTitle').textContent = L_('title');
    var avail = Number(w.available_balance) || 0;
    var u = RD.user() || {};

    document.getElementById('rdBody').innerHTML =
      '<div class="rd-bal">' +
        '<div class="l">' + L_('avail') + '</div>' +
        '<div class="v">' + RD.money(avail) + '</div>' +
        '<div class="rd-bal-split">' +
          '<div class="rd-bal-cell"><div class="cv">' + RD.money(w.lifetime_earned || 0) + '</div>' +
            '<div class="cl">' + L_('lifetime') + '</div></div>' +
          '<div class="rd-bal-cell"><div class="cv">' + (w.earning_count || 0) + '</div>' +
            '<div class="cl">' + L_('payments') + '</div></div>' +
        '</div>' +
      '</div>' +

      '<div class="rd-card"><h4>' + L_('ask') + '</h4>' +
        '<div class="rd-field"><label>' + L_('amount') + '</label>' +
          '<input class="rd-input" type="number" min="500" id="wAmt" value="' + (avail >= 500 ? Math.floor(avail) : '') + '"></div>' +
        '<div class="rd-field"><label>' + L_('method') + '</label>' +
          '<select class="rd-select" id="wMethod"><option value="moncash">MonCash</option><option value="natcash">NatCash</option></select></div>' +
        '<div class="rd-field"><label>' + L_('number') + '</label>' +
          '<input class="rd-input" id="wNum" value="' + RD.esc(u.phone || '') + '"></div>' +
        '<p style="font-size:var(--text-xs);color:var(--text-muted);margin:0 0 var(--space-md);">' +
          (avail < 500 ? L_('tooLow') : L_('note')) + '</p>' +
        '<button class="rd-btn rd-btn-red" id="wSend"' + (avail < 500 ? ' disabled' : '') + '>' + L_('ask') + '</button>' +
      '</div>' +

      '<div class="rd-card"><h4>' + L_('history') + '</h4>' +
        ((w.recent_payouts && w.recent_payouts.length)
          ? w.recent_payouts.map(function (p) {
              return '<div class="rd-row"><div class="rd-row-icon">💸</div>' +
                '<div class="rd-row-main"><div class="rd-row-name">' + RD.money(p.amount) + '</div>' +
                '<div class="rd-row-sub">' + RD.esc(p.method || '') + ' · ' + RD.when(p.createdAt) + '</div></div>' +
                '<span class="rd-row-sub" style="font-weight:700;">' + RD.esc(p.status || '') + '</span></div>';
            }).join('')
          : '<div class="rd-empty" style="padding:var(--space-lg) 0;"><p>' + L_('noHist') + '</p></div>') +
      '</div>' +

      '<div class="rd-card"><h4>' + L_('how') + '</h4>' +
        '<p style="font-size:var(--text-sm);color:var(--gray-600);line-height:1.6;margin:0;">' + L_('howBody') + '</p>' +
      '</div>';

    var btn = document.getElementById('wSend');
    if (btn) btn.addEventListener('click', function () {
      var num = document.getElementById('wNum').value.trim();
      if (!num) { RD.toast(L_('needNum'), 'error'); return; }
      var old = btn.textContent;
      btn.disabled = true; btn.textContent = L_('sending');
      RD.req('POST', '/api/payouts/request', {
        amount: parseInt(document.getElementById('wAmt').value, 10) || 0,
        method: document.getElementById('wMethod').value,
        recipient: num
      }).then(function (d) {
        btn.textContent = old;
        if (!d || !d.success) { btn.disabled = false; RD.toast((d && d.message) || RD.t('failed'), 'error'); return; }
        RD.toast((d.data && d.data.message) || RD.t('saved'), 'success');
        load();
      }).catch(function () {
        btn.disabled = false; btn.textContent = old;
        RD.toast(RD.t('failed'), 'error');
      });
    });
  }

  RD.boot('wallet', function () { load(); });
})();
</script>
</body>
</html>
