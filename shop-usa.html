<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Shop USA — MyPlopPlop</title>
<meta name="description" content="717+ pwodui Ameriken livre nan Ayiti. Peye an Goud.">
<meta property="og:title" content="Shop USA — MyPlopPlop">
<meta property="og:description" content="717+ pwodui Ameriken livre nan Ayiti. Peye an Goud.">
<meta property="og:image" content="https://myplopplop.com/assets/og-myplopplop.jpg">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<meta name="theme-color" content="#00209F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#00209F;--navy-deep:#0A0E27;--navy-mid:#1545CC;
  --red:#D21034;--red-dark:#B00D2B;
  --white:#FFF;--bg:#F5F7FA;--bg-warm:#FAFAFA;
  --gray-100:#F3F4F6;--gray-200:#E5E7EB;--gray-300:#D1D5DB;
  --gray-400:#9CA3AF;--gray-500:#6B7280;--gray-600:#4B5563;
  --gray-700:#374151;--gray-800:#1F2937;--gray-900:#111827;
  --success:#10B981;
  --heading:'Bricolage Grotesque',Georgia,serif;
  --body:'DM Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --radius:14px;--radius-sm:8px;
  --shadow:0 2px 16px rgba(10,14,39,.06);
  --shadow-lg:0 8px 40px rgba(10,14,39,.10);
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--gray-800);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ═══ GRAIN ═══ */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.02;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* ═══ NAV ═══ */
.nav{position:sticky;top:0;z-index:100;background:var(--navy-deep);border-bottom:3px solid var(--red);backdrop-filter:blur(12px)}
.nav-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;height:58px}
.nav-logo{height:32px;flex-shrink:0}
.nav-title{font-family:var(--heading);font-weight:800;color:var(--white);font-size:.95rem;white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav-title .flag{font-size:1.1rem}
.nav-search{flex:1;max-width:420px;position:relative;margin-left:auto}
.nav-search input{width:100%;padding:8px 14px 8px 36px;border:none;border-radius:100px;background:rgba(255,255,255,.1);color:var(--white);font-family:var(--body);font-size:.85rem;outline:none;transition:background .2s}
.nav-search input::placeholder{color:rgba(255,255,255,.4)}
.nav-search input:focus{background:rgba(255,255,255,.18)}
.nav-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:rgba(255,255,255,.4)}
.nav-cart{position:relative;cursor:pointer;padding:8px;margin-left:8px;flex-shrink:0}
.nav-cart svg{width:22px;height:22px;color:var(--white)}
.cart-badge{position:absolute;top:2px;right:2px;background:var(--red);color:var(--white);font-size:.6rem;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);display:none}
.cart-badge.show{display:flex;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}

@media(max-width:600px){
  .nav-search{display:none}
  .nav-title{font-size:.85rem}
}

/* ═══ MOBILE SEARCH ═══ */
.mob-search{display:none;padding:10px 16px;background:var(--navy-deep)}
.mob-search input{width:100%;padding:10px 14px 10px 38px;border:none;border-radius:100px;background:rgba(255,255,255,.1);color:var(--white);font-size:.9rem;outline:none}
.mob-search input::placeholder{color:rgba(255,255,255,.4)}
.mob-search{position:relative}
.mob-search svg{position:absolute;left:28px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:rgba(255,255,255,.4)}
@media(max-width:600px){.mob-search{display:block}}

/* ═══ HERO ═══ */
.hero{
  background:var(--navy-deep);position:relative;overflow:hidden;
  padding:40px 16px 32px;text-align:center;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 70% 60% at 20% 80%,rgba(210,16,52,.08) 0%,transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 20%,rgba(0,32,159,.15) 0%,transparent 50%);
}
.hero-content{position:relative;z-index:2;max-width:680px;margin:0 auto}
.hero-flags{font-size:2rem;margin-bottom:12px;letter-spacing:8px}
.hero h1{font-family:var(--heading);font-size:clamp(1.6rem,4.5vw,2.6rem);font-weight:800;color:var(--white);line-height:1.1;margin-bottom:10px}
.hero h1 span{background:linear-gradient(135deg,var(--red),#FF4D6A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:clamp(.85rem,2vw,1.05rem);color:rgba(255,255,255,.55);line-height:1.5;margin-bottom:20px;font-weight:500}
.hero-badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hero-badge{
  display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:100px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  font-size:.75rem;font-weight:600;color:rgba(255,255,255,.7);
}
.hero-badge svg{width:14px;height:14px;color:var(--success)}
.hero-stripe{position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--navy) 40%,var(--red) 40% 50%,var(--success) 50%)}

/* ═══ CATEGORIES ═══ */
.cats{position:sticky;top:58px;z-index:90;background:var(--white);border-bottom:1px solid var(--gray-200);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.cats-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:0;padding:0 16px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.cats-inner::-webkit-scrollbar{display:none}
.cat-pill{
  flex-shrink:0;padding:12px 18px;font-size:.82rem;font-weight:600;color:var(--gray-500);
  cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;
  font-family:var(--body);background:none;border:none;border-bottom:2px solid transparent;
}
.cat-pill:hover{color:var(--navy)}
.cat-pill.active{color:var(--navy);border-bottom-color:var(--red);font-weight:700}

/* ═══ TOOLBAR ═══ */
.toolbar{max-width:1280px;margin:0 auto;padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.toolbar-count{font-size:.82rem;color:var(--gray-500);font-weight:500}
.toolbar-count strong{color:var(--gray-800);font-weight:700}
.toolbar-sort{position:relative}
.toolbar-sort select{
  appearance:none;padding:8px 32px 8px 12px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);
  font-family:var(--body);font-size:.8rem;color:var(--gray-700);background:var(--white);cursor:pointer;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%236B7280' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;
}

/* ═══ PRODUCT GRID ═══ */
.grid-wrap{max-width:1280px;margin:0 auto;padding:8px 12px 40px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(5,1fr)}}

/* ═══ PRODUCT CARD ═══ */
.card{
  background:var(--white);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);transition:transform .25s ease,box-shadow .25s ease;
  display:flex;flex-direction:column;cursor:pointer;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card-img{
  aspect-ratio:1;background:var(--gray-100);overflow:hidden;position:relative;
}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.card:hover .card-img img{transform:scale(1.06)}
.card-img .delivery-tag{
  position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:100px;
  background:rgba(10,14,39,.7);backdrop-filter:blur(6px);
  font-size:.6rem;font-weight:600;color:var(--white);display:flex;align-items:center;gap:3px;
}
.card-img .delivery-tag svg{width:10px;height:10px}
.card-body{padding:10px 12px 14px;flex:1;display:flex;flex-direction:column}
.card-name{
  font-size:.78rem;font-weight:600;color:var(--gray-800);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:8px;min-height:2.1em;
}
.card-price{font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--navy-deep);line-height:1}
.card-price-usd{font-family:var(--mono);font-size:.65rem;color:var(--gray-400);margin-top:2px;font-weight:500}
.card-bottom{margin-top:auto;padding-top:10px}
.card-btn{
  width:100%;padding:9px;border:none;border-radius:var(--radius-sm);
  background:var(--navy);color:var(--white);font-family:var(--body);
  font-size:.78rem;font-weight:600;cursor:pointer;transition:background .2s;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.card-btn:hover{background:var(--navy-mid)}
.card-btn:active{transform:scale(.97)}
.card-btn svg{width:14px;height:14px}
.card-btn.added{background:var(--success)}

/* ═══ LOADING / EMPTY ═══ */
.skel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:1280px;margin:0 auto;padding:8px 12px}
@media(min-width:640px){.skel-grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:960px){.skel-grid{grid-template-columns:repeat(4,1fr);gap:16px}}
@media(min-width:1200px){.skel-grid{grid-template-columns:repeat(5,1fr)}}
.skel{background:var(--white);border-radius:var(--radius);overflow:hidden}
.skel-img{aspect-ratio:1;background:linear-gradient(110deg,var(--gray-100) 30%,var(--gray-200) 50%,var(--gray-100) 70%);background-size:200%;animation:shimmer 1.4s infinite}
.skel-txt{padding:12px;display:flex;flex-direction:column;gap:8px}
.skel-line{height:12px;border-radius:6px;background:linear-gradient(110deg,var(--gray-100) 30%,var(--gray-200) 50%,var(--gray-100) 70%);background-size:200%;animation:shimmer 1.4s infinite}
.skel-line.w60{width:60%}.skel-line.w40{width:40%}.skel-line.w80{width:80%}
.skel-btn{height:36px;border-radius:var(--radius-sm);background:var(--gray-100);margin-top:4px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.empty-state{text-align:center;padding:60px 20px;color:var(--gray-400)}
.empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:.4}
.empty-state p{font-size:.9rem}

.load-more-wrap{text-align:center;padding:24px 16px 48px}
.load-more{
  padding:12px 36px;border:2px solid var(--navy);border-radius:100px;
  background:transparent;color:var(--navy);font-family:var(--body);font-size:.85rem;
  font-weight:700;cursor:pointer;transition:all .2s;
}
.load-more:hover{background:var(--navy);color:var(--white)}
.load-more:disabled{opacity:.4;cursor:not-allowed}

/* ═══ CART SIDEBAR ═══ */
.cart-overlay{position:fixed;inset:0;background:rgba(10,14,39,.5);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s}
.cart-overlay.open{opacity:1;pointer-events:auto}
.cart-panel{
  position:fixed;top:0;right:-380px;width:min(380px,90vw);height:100%;z-index:201;
  background:var(--white);box-shadow:-8px 0 40px rgba(0,0,0,.15);
  display:flex;flex-direction:column;transition:right .35s cubic-bezier(.23,1,.32,1);
}
.cart-panel.open{right:0}
.cart-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--gray-200)}
.cart-header h2{font-family:var(--heading);font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.cart-close{background:none;border:none;cursor:pointer;padding:8px;color:var(--gray-500)}
.cart-close svg{width:20px;height:20px}
.cart-items{flex:1;overflow-y:auto;padding:16px 20px}
.cart-empty{text-align:center;padding:40px 0;color:var(--gray-400);font-size:.9rem}
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--gray-100)}
.ci-img{width:60px;height:60px;border-radius:var(--radius-sm);overflow:hidden;background:var(--gray-100);flex-shrink:0}
.ci-img img{width:100%;height:100%;object-fit:cover}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:.78rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ci-price{font-family:var(--mono);font-size:.8rem;font-weight:700;color:var(--navy);margin-top:3px}
.ci-qty{display:flex;align-items:center;gap:0;margin-top:6px}
.ci-qty button{width:28px;height:28px;border:1px solid var(--gray-200);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;color:var(--gray-600)}
.ci-qty button:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.ci-qty button:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.ci-qty span{width:32px;height:28px;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--gray-200);border-bottom:1px solid var(--gray-200);font-family:var(--mono);font-size:.8rem;font-weight:700}
.ci-remove{background:none;border:none;color:var(--red);font-size:.7rem;cursor:pointer;margin-top:4px;font-weight:600}
.cart-footer{padding:16px 20px;border-top:1px solid var(--gray-200);background:var(--bg-warm)}
.cart-total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.cart-total-label{font-size:.85rem;font-weight:600;color:var(--gray-600)}
.cart-total-price{font-family:var(--mono);font-size:1.3rem;font-weight:700;color:var(--navy-deep)}
.cart-checkout{
  width:100%;padding:14px;border:none;border-radius:var(--radius);
  background:var(--red);color:var(--white);font-family:var(--heading);
  font-size:1rem;font-weight:700;cursor:pointer;transition:background .2s;
}
.cart-checkout:hover{background:var(--red-dark)}

/* ═══ FOOTER ═══ */
.footer{background:var(--navy-deep);padding:32px 16px;text-align:center}
.footer-logo{height:28px;opacity:.5;margin-bottom:10px}
.footer p{font-size:.75rem;color:rgba(255,255,255,.3)}

/* ═══ REVEAL ═══ */
.rv{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease}
.rv.vis{opacity:1;transform:translateY(0)}

/* ═══ TOAST ═══ */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--navy-deep);color:var(--white);padding:10px 24px;border-radius:100px;
  font-size:.82rem;font-weight:600;z-index:300;pointer-events:none;
  transition:transform .35s cubic-bezier(.23,1,.32,1),opacity .35s;opacity:0;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast svg{width:16px;height:16px;color:var(--success)}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <img src="assets/myplopplop-logo-nav.png" alt="MyPlopPlop" class="nav-logo">
    <div class="nav-title"><span class="flag">&#127482;&#127480;</span> Shop USA</div>
    <div class="nav-search">

      <div class="cart-badge" id="cartBadge">0</div>

</nav>

<div class="mob-search">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
  <input type="text" id="mobSearchInput" placeholder="Chache pwodui..." oninput="debounceSearch()">
</div>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <div class="hero-flags">&#127482;&#127480; &#10132; &#127469;&#127481;</div>
    <h1>Shop <span>USA</span> Products</h1>

        Credit Card
      </div>
      <div class="hero-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        ~21 Jou Livrezon
      </div>
      <div class="hero-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Garanti
      </div>
    </div>
  </div>
  <div class="hero-stripe"></div>
</section>

<!-- CATEGORIES -->
<div class="cats">
  <div class="cats-inner" id="catTabs">
    <button class="cat-pill active" data-cat="">Tout</button>
    <button class="cat-pill" data-cat="auto-parts">&#128663; Auto</button>
    <button class="cat-pill" data-cat="phones-electronics">&#128241; Elektwonik</button>
    <button class="cat-pill" data-cat="solar-energy">&#9728;&#65039; Solè</button>

    <button class="cat-pill" data-cat="beauty-personal-care">&#128132; Bote</button>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="toolbar-count"><strong id="prodCount">0</strong> pwodui</div>
  <div class="toolbar-sort">
    <select id="sortSelect" onchange="loadProducts(1)">
      <option value="">Popilè</option>
      <option value="price_asc">Pri &#8593;</option>
      <option value="price_desc">Pri &#8595;</option>
      <option value="newest">Nouvo</option>
    </select>
  </div>
</div>

<!-- PRODUCTS -->
<div class="grid-wrap">
  <div class="grid" id="productGrid"></div>
</div>
<div class="load-more-wrap" id="loadMoreWrap" style="display:none">
  <button class="load-more" id="loadMoreBtn" onclick="loadMore()">Chaje Plis</button>
</div>

<!-- SKELETON -->
<div class="skel-grid" id="skeleton">
  <div class="skel"><div class="skel-img"></div><div class="skel-txt"><div class="skel-line w80"></div><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-btn"></div></div></div>
  <div class="skel"><div class="skel-img"></div><div class="skel-txt"><div class="skel-line w80"></div><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-btn"></div></div></div>
  <div class="skel"><div class="skel-img"></div><div class="skel-txt"><div class="skel-line w80"></div><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-btn"></div></div></div>
  <div class="skel"><div class="skel-img"></div><div class="skel-txt"><div class="skel-line w80"></div><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-btn"></div></div></div>
  <div class="skel"><div class="skel-img"></div><div class="skel-txt"><div class="skel-line w80"></div><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-btn"></div></div></div>
  <div class="skel"><div class="skel-img"></div><div class="skel-txt"><div class="skel-line w80"></div><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-btn"></div></div></div>
</div>

<!-- EMPTY STATE -->
<div class="empty-state" id="emptyState" style="display:none">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
  <p>Pa gen pwodui jwenn. Eseye yon lòt rechèch.</p>
</div>

<!-- CART OVERLAY -->
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h2>&#128722; Panye</h2>
    <button class="cart-close" onclick="toggleCart()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="cart-items" id="cartItems">
    <div class="cart-empty">Panye ou vid</div>
  </div>
  <div class="cart-footer">
    <div class="cart-total">
      <span class="cart-total-label">Total</span>
      <span class="cart-total-price" id="cartTotal">0 HTG</span>
    </div>
    <button class="cart-checkout" onclick="checkout()">Peye Kounye a</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="toastMsg">Ajoute nan panye!</span>
</div>

<!-- FOOTER -->
<footer class="footer">
  <img src="assets/myplopplop-logo-nav.png" alt="MyPlopPlop" class="footer-logo"><br>
  <p>&copy; 2026 MyPlopPlop. Tout dwa rezève.</p>
</footer>

<script>
var API='https://myplopplop-api.onrender.com';
var currentCat='';
var currentPage=1;
var totalProducts=0;
var searchTerm='';
var cart=JSON.parse(localStorage.getItem('pp_cart')||'[]');
var searchTimer=null;
var loading=false;

function fmtHTG(n){return n.toLocaleString('en-US').replace(/,/g,',')+' HTG'}
function fmtUSD(htg){return '~$'+(htg/135).toFixed(2)+' USD'}

function debounceSearch(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(function(){
    var v=(document.getElementById('searchInput').value||document.getElementById('mobSearchInput').value).trim();
    searchTerm=v;
    document.getElementById('searchInput').value=v;
    document.getElementById('mobSearchInput').value=v;
    loadProducts(1);
  },400);
}

function selectCat(cat){
  currentCat=cat;
  document.querySelectorAll('.cat-pill').forEach(function(p){
    p.classList.toggle('active',p.dataset.cat===cat);
  });
  loadProducts(1);
}

document.getElementById('catTabs').addEventListener('click',function(e){
  var pill=e.target.closest('.cat-pill');
  if(pill)selectCat(pill.dataset.cat);
});

async function loadProducts(page){
  if(loading)return;
  loading=true;
  currentPage=page;
  if(page===1){
    document.getElementById('productGrid').innerHTML='';
    document.getElementById('skeleton').style.display='';
    document.getElementById('emptyState').style.display='none';
    document.getElementById('loadMoreWrap').style.display='none';
  }
  var sort=document.getElementById('sortSelect').value;
  var url=API+'/api/international/products?supplierType=CJ_USA&page='+page+'&limit=24';
  if(currentCat)url+='&category='+currentCat;
  if(sort)url+='&sort='+sort;
  if(searchTerm)url+='&search='+encodeURIComponent(searchTerm);

  try{
    var resp=await fetch(url);
    var json=await resp.json();
    if(!json.success)throw new Error(json.message);

    var products=json.data||[];
    totalProducts=json.pagination?json.pagination.total:products.length;
    document.getElementById('prodCount').textContent=totalProducts;
    document.getElementById('skeleton').style.display='none';

    if(products.length===0&&page===1){
      document.getElementById('emptyState').style.display='';
      loading=false;
      return;
    }

    var grid=document.getElementById('productGrid');
    products.forEach(function(p,i){
      var img=p.images&&p.images.length>0?p.images[0]:'';
      var card=document.createElement('div');
      card.className='card rv';
      card.innerHTML=
        '<div class="card-img">'+
          '<img src="'+(img||'')+'" alt="'+esc(p.name)+'" loading="lazy" onerror="this.style.display=\'none\'">'+
          '<div class="delivery-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>~21j</div>'+
        '</div>'+
        '<div class="card-body">'+
          '<div class="card-name">'+esc(p.name)+'</div>'+
          '<div class="card-price">'+fmtHTG(p.finalPriceHTG)+'</div>'+
          '<div class="card-price-usd">'+fmtUSD(p.finalPriceHTG)+'</div>'+
          '<div class="card-bottom">'+
            '<button class="card-btn" data-id="'+p._id+'" onclick="addToCart(this,\''+p._id+'\',\''+esc(p.name).replace(/'/g,"\\'")+'\','+p.finalPriceHTG+',\''+(img||'').replace(/'/g,"\\'")+'\')">'+
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>'+
              'Ajoute nan Panye'+
            '</button>'+
          '</div>'+
        '</div>';
      grid.appendChild(card);
      setTimeout(function(){card.classList.add('vis')},30+i*40);
    });

    var loaded=grid.children.length;
    if(loaded<totalProducts){
      document.getElementById('loadMoreWrap').style.display='';
      document.getElementById('loadMoreBtn').disabled=false;
    }else{
      document.getElementById('loadMoreWrap').style.display='none';
    }
  }catch(e){
    console.error('Load error:',e);
    document.getElementById('skeleton').style.display='none';
    if(page===1)document.getElementById('emptyState').style.display='';
  }
  loading=false;
}

function loadMore(){
  document.getElementById('loadMoreBtn').disabled=true;
  loadProducts(currentPage+1);
}

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

function addToCart(btn,id,name,price,img){
  var existing=cart.find(function(c){return c.id===id});
  if(existing){existing.qty++}
  else{cart.push({id:id,name:name,price:price,img:img,qty:1})}
  saveCart();
  btn.classList.add('added');
  btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg> Ajoute!';
  setTimeout(function(){
    btn.classList.remove('added');
    btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg> Ajoute nan Panye';
  },1200);
  showToast(name.substring(0,30)+'... ajoute!');
}

function saveCart(){
  localStorage.setItem('pp_cart',JSON.stringify(cart));
  updateBadge();
}

function updateBadge(){
  var total=cart.reduce(function(s,c){return s+c.qty},0);
  var badge=document.getElementById('cartBadge');
  badge.textContent=total;
  badge.classList.toggle('show',total>0);
}

function toggleCart(){
  var open=document.getElementById('cartPanel').classList.toggle('open');
  document.getElementById('cartOverlay').classList.toggle('open',open);
  document.body.style.overflow=open?'hidden':'';
  if(open)renderCart();
}

function renderCart(){
  var container=document.getElementById('cartItems');
  if(cart.length===0){
    container.innerHTML='<div class="cart-empty">Panye ou vid</div>';
    document.getElementById('cartTotal').textContent='0 HTG';
    return;
  }
  var html='';
  var total=0;
  cart.forEach(function(item,idx){
    total+=item.price*item.qty;
    html+='<div class="ci">'+
      '<div class="ci-img"><img src="'+item.img+'" alt="" onerror="this.style.display=\'none\'"></div>'+
      '<div class="ci-info">'+
        '<div class="ci-name">'+esc(item.name)+'</div>'+
        '<div class="ci-price">'+fmtHTG(item.price*item.qty)+'</div>'+
        '<div class="ci-qty">'+
          '<button onclick="changeQty('+idx+',-1)">-</button>'+
          '<span>'+item.qty+'</span>'+
          '<button onclick="changeQty('+idx+',1)">+</button>'+
        '</div>'+
        '<button class="ci-remove" onclick="removeItem('+idx+')">Retire</button>'+
      '</div>'+
    '</div>';
  });
  container.innerHTML=html;
  document.getElementById('cartTotal').textContent=fmtHTG(total);
}

function changeQty(idx,delta){
  cart[idx].qty+=delta;
  if(cart[idx].qty<1)cart.splice(idx,1);
  saveCart();renderCart();
}

function removeItem(idx){
  cart.splice(idx,1);
  saveCart();renderCart();
}

function checkout(){
  if(cart.length===0)return;
  showToast('Checkout ap vini byento!');
}

function showToast(msg){
  var t=document.getElementById('toast');
  document.getElementById('toastMsg').textContent=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2200);
}

updateBadge();
loadProducts(1);

var revealObs=new IntersectionObserver(function(entries){
  entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('vis');revealObs.unobserve(e.target)}});
},{threshold:.1});
new MutationObserver(function(){
  document.querySelectorAll('.rv:not(.vis)').forEach(function(el){revealObs.observe(el)});
}).observe(document.getElementById('productGrid'),{childList:true});
</script>
</body>
</html>
