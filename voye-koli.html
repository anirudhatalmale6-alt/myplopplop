<html lang="ht">

<title>Voye yon koli | MyPlopPlop</title>

/* 27 Oct 2026 - "VOYE YON KOLI". Jeffery: "Upload or take a photo of the
   package. Enter pickup location and destination. Enter recipient's phone
   number. See the delivery price and pay. Get connected to an available
   MsouWout driver. Track the package until delivery is confirmed."
   This page only collects and shows. The price, the payment check and the
   dispatch are the server's (routes/rides.js /parcel, services/parcel.js). */
:root{--red:#D21034;--blue:#00209F;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f4f6fa;--white:#fff;--green:#0f9d55;--amber:#b45309}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
.top{background:var(--blue);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.top a{color:#fff;text-decoration:none;font-size:22px;line-height:1}
.top h1{font-family:Poppins;font-size:17px;font-weight:700}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--white);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(16,24,40,.08);margin-bottom:14px}
h2{font-family:Poppins;font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
label{display:block;font-size:12.5px;font-weight:700;color:#374151;margin:10px 0 5px}
input,textarea{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;font:500 15px Inter,sans-serif;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:0;border-color:var(--blue)}
.photo{border:2px dashed var(--line);border-radius:14px;min-height:150px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;cursor:pointer;color:var(--muted);font-weight:700;text-align:center;overflow:hidden;position:relative;background:#fafbfc}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .ic{font-size:34px}
.gps{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:#E9F7EE;color:var(--green);border:1px solid #bfe5cb;border-radius:999px;padding:7px 12px;font:700 13px Inter,sans-serif;cursor:pointer}
.place{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.12);z-index:15;overflow:hidden;display:none}
.sugg.show{display:block}
.sugg button{display:block;width:100%;text-align:left;padding:11px 13px;border:0;background:#fff;border-bottom:1px solid #f1f2f4;font:500 14px Inter,sans-serif;cursor:pointer;color:var(--ink)}
.sugg button small{display:block;color:var(--muted);font-size:12px}
.picked{margin-top:6px;font-size:12.5px;color:var(--green);font-weight:700;display:none}
.picked.show{display:block}
.price{display:flex;justify-content:space-between;align-items:center}
.price b{font-family:Poppins;font-size:24px}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m{border:2px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;font:700 13px Inter,sans-serif;background:#fff;cursor:pointer;color:var(--ink)}
.m.on{border-color:var(--blue);background:#EEF1FB;color:var(--blue)}
.m[hidden]{display:none}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:14px;font:700 16px Inter,sans-serif;cursor:pointer;text-align:center;text-decoration:none}
.btn-red{background:var(--red);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-green{background:#25D366;color:#fff}
.btn-line{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.err{color:var(--red);font-size:13.5px;font-weight:600;margin-top:10px;min-height:1px}
.code{font-family:Poppins;font-size:42px;font-weight:800;letter-spacing:.3em;text-align:center;padding:6px 0 0 .3em}
.box{border:2px dashed var(--blue);border-radius:14px;padding:14px;margin:10px 0}
.steps{list-style:none;margin:6px 0}
.steps li{display:flex;gap:10px;align-items:center;padding:7px 0;color:var(--muted);font-weight:600;font-size:14px}
.steps li .d{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 22px;display:grid;place-items:center;font-size:12px}
.steps li.done{color:var(--ink)} .steps li.done .d{background:var(--green);border-color:var(--green);color:#fff}
.steps li.now{color:var(--blue)} .steps li.now .d{border-color:var(--blue);background:#EEF1FB}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f1f2f4;font-size:14px}
.row span:first-child{color:var(--muted)} .row span:last-child{font-weight:600;text-align:right}
[hidden]{display:none!important}
</style>

          location.reload(); return;
        }
        b.disabled = false; b.textContent = t('aGo');
        if (isNew && /already registered/i.test((d && d.message) || '')) return authView('old', t('aExists'));
        err.textContent = isNew ? ((d && d.message) || t('net')) : t('aBad');
      }).catch(function () { b.disabled = false; b.textContent = t('aGo'); err.textContent = t('net'); });
    };
  }

  /* ═══ THE FORM ═════════════════════════════════════════════════════════ */
  function formView() {
    var photo = '', pick = null, drop = null, method = 'moncash', cardOn = false;
    app.innerHTML =
      '<div class="card"><h2>📷 ' + t('photo') + '</h2>' +
        '<label class="photo" id="ph"><span class="ic">📷</span><span id="phTxt">' + t('photoTap') + '</span>' +
        '<input type="file" id="phIn" accept="image/*" capture="environment" hidden></label>' +
        '<label for="desc">' + t('what') + '</label><input id="desc" maxlength="120" placeholder="' + esc(t('whatPh')) + '"></div>' +
      place('from', '🟢', t('from')) + place('to', '🔴', t('to')) +
      '<div class="card"><h2>👤 ' + t('who') + '</h2>' +
        '<label for="rn">' + t('rname') + '</label><input id="rn" maxlength="60" autocomplete="off">' +
        '<label for="rp">' + t('rphone') + '</label><input id="rp" type="tel" inputmode="tel" maxlength="16" placeholder="' + esc(t('rphonePh')) + '"></div>' +
      '<div class="card"><div class="price"><span class="muted" style="font-weight:700">' + t('price') + '</span><b id="price">—</b></div>' +
        '<p class="muted" id="priceNote">' + t('priceWait') + '</p>' +
        '<label>' + t('pay') + '</label><div class="methods">' +
          '<button class="m on" data-m="moncash">MonCash</button><button class="m" data-m="natcash">NatCash</button><button class="m" data-m="card" hidden id="mCard">💳 ' + t('card') + '</button></div>' +
        '<button class="btn btn-red" id="go" style="margin-top:16px">' + t('payBtn', { p: '' }) + '</button><p class="muted" style="margin-top:10px;font-size:.86rem">' + esc(t('payFirst')) + '</p><div class="err" id="err"></div></div>';

    function place(k, dot, title) {
      return '<div class="card"><h2>' + dot + ' ' + title + '</h2><div class="place"><input id="' + k + 'Q" autocomplete="off" placeholder="' + esc(t('search')) + '"><div class="sugg" id="' + k + 'S"></div></div>' +
        '<div class="picked" id="' + k + 'Ok">' + t('onMap') + '</div>' +
        '<button class="gps" type="button" id="' + k + 'Gps">' + t('gps') + '</button>' +
        '<label for="' + k + 'N">' + t('landmark') + '</label><input id="' + k + 'N" maxlength="120" placeholder="' + esc(t('landmarkPh')) + '"></div>';
    }

    api('GET', '/api/payments/parcel/methods').then(function (d) { if (d && d.card) { cardOn = true; el('mCard').hidden = false; } });
    document.querySelectorAll('.m').forEach(function (b) {
      b.onclick = function () { method = b.getAttribute('data-m'); document.querySelectorAll('.m').forEach(function (x) { x.classList.toggle('on', x === b); }); };
    });

    /* The photo is shrunk ON THE PHONE (≤1000 px, JPEG) so a 4 MB camera
       picture does not have to cross a weak 4G link - the server refuses
       anything over ~500 KB anyway. */
    el('phIn').onchange = function (e) {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        var im = new Image();
        im.onload = function () {
          var s = Math.min(1, 1000 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
          cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
          cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
          var q = 0.75, out = cv.toDataURL('image/jpeg', q);
          while (out.length > 450 * 1024 && q > 0.3) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
          photo = out;
          var box = el('ph'), old = box.querySelector('img'); if (old) old.remove();
          var img = new Image(); img.src = out; img.alt = ''; box.appendChild(img);
          el('phTxt').textContent = t('photoChange');
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(f);
    };

    // an old "take a photo" must not stay on screen once she has taken it
    app.addEventListener('input', function () { el('err').textContent = ''; });
    app.addEventListener('change', function () { el('err').textContent = ''; });
    wirePlace('from', function (p) { pick = p; quote(); });
    wirePlace('to', function (p) { drop = p; quote(); });

    function wirePlace(k, set) {
      var q = el(k + 'Q'), box = el(k + 'S'), okEl = el(k + 'Ok'), timer = null, last = [];
      q.addEventListener('input', function () {
        set(null); okEl.classList.remove('show');
        clearTimeout(timer); var text = q.value.trim();
        if (text.length < 2) { box.classList.remove('show'); return; }
        timer = setTimeout(function () { find(text).then(show); }, 250);
      });
      function show(list) {
        last = list;
        if (!list.length) { box.classList.remove('show'); return; }
        box.innerHTML = list.map(function (r, i) {
          var nm = r.name || String(r.display_name || '').split(',')[0];
          return '<button type="button" data-i="' + i + '">' + esc(nm) + '<small>' + esc(r.display_name || '') + '</small></button>';
        }).join('');
        box.classList.add('show');
      }
      box.addEventListener('click', function (ev) {
        var b = ev.target.closest('button'); if (!b) return;
        var r = last[+b.getAttribute('data-i')];
        var parts = String(r.display_name || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean);
        var head = r.name || parts[0] || '';
        q.value = [head].concat(parts.filter(function (x) { return x !== head; }).slice(0, 2)).join(', ');
        box.classList.remove('show'); okEl.classList.add('show');
        set({ address: q.value.slice(0, 190), lat: +r.lat, lng: +r.lon });
      });
      document.addEventListener('click', function (ev) { if (!ev.target.closest('.place')) box.classList.remove('show'); });
      el(k + 'Gps').onclick = function () {
        if (!navigator.geolocation) { alert(t('gpsNo')); return; }
        el(k + 'Gps').disabled = true;
        navigator.geolocation.getCurrentPosition(function (pos) {
          el(k + 'Gps').disabled = false;
          q.value = t('gpsHere'); okEl.classList.add('show');
          set({ address: t('gpsHere') + ' ' + pos.coords.latitude.toFixed(5) + ', ' + pos.coords.longitude.toFixed(5), lat: pos.coords.latitude, lng: pos.coords.longitude });
        }, function (e) {
          /* 5 Nov 2026 ("works reliably"): indoors the GPS chip often times out - ask once more for the phone's
             network position (Wi-Fi / cell, quick) before giving up. A refusal (code 1) is not asked again. */
          if (e && e.code !== 1) {
            return navigator.geolocation.getCurrentPosition(function (pos) {
              el(k + 'Gps').disabled = false; q.value = t('gpsHere'); okEl.classList.add('show');
              set({ address: t('gpsHere') + ' ' + pos.coords.latitude.toFixed(5) + ', ' + pos.coords.longitude.toFixed(5), lat: pos.coords.latitude, lng: pos.coords.longitude });
            }, function () { el(k + 'Gps').disabled = false; alert(t('gpsNo')); }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 });
          }
          el(k + 'Gps').disabled = false; alert(t('gpsNo'));
        }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
      };
    }

    /* Our own Haiti list first (the MsouWout one - Delimart, Eagle, every
       branch), OpenStreetMap only when it has nothing. */
    function find(text) {
      var local = (window.MW_PLACES ? MW_PLACES.search(text, { limit: 6 }) : Promise.resolve([])).catch(function () { return []; });
      return local.then(function (list) {
        if (list && list.length) return list;
        return fetch('https://nominatim.openstreetmap.org/search?format=json&countrycodes=ht&limit=5&q=' + encodeURIComponent(text), { headers: { 'Accept-Language': 'fr' } })
          .then(function (r) { return r.json(); }).then(function (a) { return (a || []).map(function (x) { return { display_name: x.display_name, lat: x.lat, lon: x.lon, name: x.name || '' }; }); })
          .catch(function () { return []; });
      });
    }

    var quoted = 0;
    function quote() {
      el('price').textContent = '—'; el('go').textContent = t('payBtn', { p: '' });
      if (!pick || !drop) { el('priceNote').textContent = t('priceWait'); return; }
      var mine = ++quoted;
      api('POST', '/api/rides/quote', { type: 'delivery', pickup: { lat: pick.lat, lng: pick.lng }, dropoff: { lat: drop.lat, lng: drop.lng } }).then(function (d) {
        if (mine !== quoted || !d || !d.success) return;
        el('price').textContent = money(d.data.deliveryFee);
        el('priceNote').textContent = d.data.distanceKm + ' km';
        el('go').textContent = t('payBtn', { p: money(d.data.deliveryFee) });
      }).catch(function () {});
    }

    el('go').onclick = function () {
      var err = el('err'); err.textContent = '';
      var rp = el('rp').value.replace(/\D/g, '');
      if (!photo) return (err.textContent = t('eqNoPhoto'));
      if (!pick) return (err.textContent = t('eqNoFrom'));
      if (!drop) return (err.textContent = t('eqNoTo'));
      if (!el('rn').value.trim()) return (err.textContent = t('eqNoName'));
      /* 5 Nov 2026 (Jeffery: "Recipient name and phone are validated"): a Haiti number = 8 digits, or 509 + 8 */
      if (!(rp.length === 8 || (rp.length === 11 && rp.indexOf('509') === 0))) { el('rp').focus(); return (err.textContent = t('eqNoPhone')); }
      var btn = el('go'); btn.disabled = true; btn.textContent = t('working');
      api('POST', '/api/rides/parcel', {
        pickup: { address: pick.address, lat: pick.lat, lng: pick.lng, notes: el('fromN').value },
        dropoff: { address: drop.address, lat: drop.lat, lng: drop.lng, notes: el('toN').value },
        recipient: { name: el('rn').value.trim(), phone: rp }, photo: photo, description: el('desc').value, paymentMethod: method
      }).then(function (d) {
        if (!d.success) throw new Error(d.message || t('net'));
        try { localStorage.setItem('mpp_koli_last', d.ride._id); } catch (e) {}
        return startPay(d.ride._id, method);
      }).catch(function (e) { btn.disabled = false; quote(); err.textContent = e.message || t('net'); });
    };
  }

  function startPay(id, m) {
    return api('POST', '/api/payments/parcel/start', { rideId: id, method: m }).then(function (d) {
      if (!d.success || !d.paymentUrl) {
        // the parcel exists; the payment did not start - land on its page, where "Pay again" is
        if (d.code === 'not_payable') { location.href = 'voye-koli.html?ride=' + id; return; }
        throw new Error(d.message || t('net'));
      }
      location.href = d.paymentUrl;
    });
  }

  /* ═══ AFTER PAYING: the parcel's own page ════════════════════════════════ */
  function statusView(id) {
    var polls = 0, timer = null, chosen = 'moncash';
    function load() {
      api('GET', '/api/payments/parcel/' + encodeURIComponent(id) + '/check').then(function (d) {
        if (!d.success) { app.innerHTML = '<div class="card"><p class="err">' + esc(d.message || t('net')) + '</p><a class="btn btn-blue" href="voye-koli.html" style="margin-top:12px">' + t('newOne') + '</a></div>'; return; }
        draw(d.ride);
        polls++;
        var st = d.ride.status, wait = st === 'awaiting_payment' ? (polls < 40 ? 4000 : 15000) : (st === 'delivered' || st === 'cancelled' ? 0 : 15000);
        clearTimeout(timer); if (wait) timer = setTimeout(load, wait);
      }).catch(function () { clearTimeout(timer); timer = setTimeout(load, 8000); });
    }
    function draw(r) {
      var st = r.status, rec = r.recipient || {}, me = user() || {};
      var link = 'https://myplopplop.com/koli.html?t=' + r.trackToken;
      var steps = [['s1', ['requested', 'accepted', 'picking_up', 'in_progress', 'delivered']], ['s2', ['accepted', 'picking_up', 'in_progress', 'delivered']], ['s3', ['in_progress', 'delivered']], ['s4', ['delivered']]];
      var html = '<div class="card"><h2>' + (st === 'awaiting_payment' ? '<span class="spin"></span> ' : '📦 ') + esc(t('st_' + st)) + '</h2>';
      if (st !== 'awaiting_payment' && st !== 'cancelled') {
        html += '<ul class="steps">' + steps.map(function (s, i) {
          var done = s[1].indexOf(st) !== -1, now = !done && (i === 0 || steps[i - 1][1].indexOf(st) !== -1);
          return '<li class="' + (done ? 'done' : now ? 'now' : '') + '"><span class="d">' + (done ? '✓' : i + 1) + '</span>' + esc(t(s[0])) + '</li>';
        }).join('') + '</ul>';
      }
      if (r.driver && r.driver.name && ['accepted', 'picking_up', 'in_progress'].indexOf(st) !== -1) {
        html += '<div class="row"><span>' + t('driver') + '</span><span>' + esc(r.driver.name) + (r.driver.phone ? ' · <a href="tel:' + esc(r.driver.phone) + '">' + t('call') + '</a>' : '') + '</span></div>';
      }
      html += '<div class="row"><span>' + t('from2') + '</span><span>' + esc(r.pickup && r.pickup.address) + '</span></div>' +
        '<div class="row"><span>' + t('to2') + '</span><span>' + esc(rec.name) + ' · ' + esc(r.dropoff && r.dropoff.address) + '</span></div>' +
        '<div class="row" style="border:0"><span>' + t('amount') + '</span><span>' + money(r.fare && r.fare.total) + '</span></div>';
      if (st === 'requested' && !r.driver) {
        html += '<p class="muted" style="margin:10px 0 8px">' + esc(t('searchNote')) + '</p>' +
          '<button class="btn btn-line" id="cxlPaid">' + esc(t('cancelPaid')) + '</button><div class="err" id="err"></div>';
      }
      if (st === 'cancelled' && r.refund && r.refund.status) {
        html += (r.refund.reason === 'no_driver' ? '<p class="muted" style="margin:10px 0 4px">' + esc(t('whyNoDriver')) + '</p>' : '') +
          '<div class="box" style="margin-top:10px;font-weight:700">' + esc(r.refund.status === 'refunded'
            ? t('refundDone', { m: money(r.refund.amount), r: r.refund.reference || '' }) : t('refundOwed', { m: money(r.refund.amount) })) + '</div>';
      }
      if (st === 'awaiting_payment') {
        html += '<p class="muted" style="margin:8px 0 12px">' + t('waitPay') + '</p>' +
          '<div class="methods"><button class="m on" data-m="moncash">MonCash</button><button class="m" data-m="natcash">NatCash</button><button class="m" data-m="card" id="mCard2" hidden>💳 ' + t('card') + '</button></div>' +
          '<button class="btn btn-blue" id="again" style="margin-top:12px">' + t('payAgain') + '</button>' +
          '<button class="btn btn-line" id="cxl" style="margin-top:10px">' + t('cancel') + '</button><div class="err" id="err"></div>';
      }
      html += '</div>';
      if (r.paymentStatus === 'paid' && st !== 'cancelled' && r.pin) {
        var msg = t('waMsg', { n: String(rec.name || '').split(' ')[0], s: (me.name || '').split(' ')[0] || 'MyPlopPlop', l: link, c: r.pin });
        var wa = 'https://wa.me/' + String(rec.phone || '').replace(/\D/g, '') + '?text=' + encodeURIComponent(msg);
        html += '<div class="card"><h2>📲 ' + esc(t('forRecipient', { n: rec.name || '' })) + '</h2>' +
          '<div class="box"><div class="muted" style="text-align:center;font-weight:700">' + t('codeIs') + '</div><div class="code">' + esc(r.pin) + '</div></div>' +
          '<p class="muted" style="margin-bottom:12px">' + esc(t('codeNote', { n: String(rec.name || '').split(' ')[0] })) + '</p>' +
          '<a class="btn btn-green" href="' + esc(wa) + '" target="_blank" rel="noopener">' + esc(t('sendWa', { n: String(rec.name || '').split(' ')[0] })) + '</a>' +
          '<button class="btn btn-line" id="cp" style="margin-top:10px">' + t('copy') + '</button>' +
          '<p class="muted" style="margin-top:12px">' + t('track') + ': <a href="' + esc(link) + '">' + esc(link) + '</a></p></div>';
        window.__kmsg = msg;
      }
      html += '<a class="btn btn-line" href="https://wa.me/50946859702?text=' + encodeURIComponent('Bonjou, kesyon sou koli ' + String(r._id).slice(-6)) + '" target="_blank" rel="noopener" style="margin-bottom:10px">' + t('help') + '</a>';
      if (st === 'delivered' || st === 'cancelled') html += '<a class="btn btn-blue" href="voye-koli.html">' + t('newOne') + '</a>';
      app.innerHTML = html;

      if (el('cp')) el('cp').onclick = function () {
        var b = el('cp'); (navigator.clipboard ? navigator.clipboard.writeText(window.__kmsg) : Promise.reject()).then(function () { b.textContent = t('copied'); }).catch(function () { prompt('', window.__kmsg); });
      };
      if (el('cxlPaid')) el('cxlPaid').onclick = function () {
        var b = el('cxlPaid');
        if (!b.getAttribute('data-sure')) { b.setAttribute('data-sure', '1'); b.textContent = t('cancelSure') + ' ✔'; b.style.borderColor = '#D21034'; b.style.color = '#D21034'; return; }
        b.disabled = true;
        api('PUT', '/api/rides/' + encodeURIComponent(id) + '/cancel', { reason: 'sender' }).then(function (d) {
          if (!d.success) { el('err').textContent = d.message || t('net'); b.disabled = false; }
          load();
        });
      };
      if (el('again')) {
        api('GET', '/api/payments/parcel/methods').then(function (d) { if (d && d.card && el('mCard2')) el('mCard2').hidden = false; });
        document.querySelectorAll('.m').forEach(function (b) {
          b.onclick = function () { chosen = b.getAttribute('data-m'); document.querySelectorAll('.m').forEach(function (x) { x.classList.toggle('on', x === b); }); };
        });
        el('again').onclick = function () {
          el('again').disabled = true; el('err').textContent = '';
          startPay(id, chosen).catch(function (e) { el('again').disabled = false; el('err').textContent = e.message || t('net'); });
        };
        /* Two taps, not window.confirm(): a WebView can stop drawing JS
           dialogs and confirm() then returns false silently (Jennifer, 9 Oct,
           on MsouWout: "Chak m peze anile l pa anile"). */
        el('cxl').onclick = function () {
          var b = el('cxl');
          if (!b.getAttribute('data-sure')) { b.setAttribute('data-sure', '1'); b.textContent = t('cancelSure') + ' ✔'; b.style.borderColor = '#D21034'; b.style.color = '#D21034'; return; }
          b.disabled = true;
          api('PUT', '/api/rides/' + encodeURIComponent(id) + '/cancel', { reason: 'sender' }).then(function (d) {
            if (!d.success) { el('err').textContent = d.message || t('net'); }
            load();
          });
        };
      }
    }
    load();
  }
})();
</script>
<script src="/js/msw-return.js?v=1" defer></script>
